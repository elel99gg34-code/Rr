<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MINECRAFT PvP 2.0 POWER - 1v1 Duel</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05040a;
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:none;color:#fff;user-select:none;-webkit-user-select:none}
  canvas{display:block;position:absolute;left:0;top:0;width:100%;height:100%}
  #hud{pointer-events:none}
  #ui{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:10}
  #ui.on{display:flex}
  #ui .bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(60,20,10,.55),rgba(2,2,6,.92) 70%)}
  #ui.blur .bg{backdrop-filter:blur(4px)}
  .panel{position:relative;width:min(820px,95vw);max-height:95vh;overflow-y:auto;padding:26px 30px 30px;
    background:linear-gradient(#12101acc,#08060eee);
    border:1px solid #ff6a2b55;text-align:center;
    box-shadow:0 0 0 1px #000,0 0 60px #ff5c1a22,0 0 120px #000 inset,0 20px 60px #000d}
  .panel::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg,transparent,#ff6a2b,#ffd93d,#ff6a2b,transparent)}
  .panel::-webkit-scrollbar{width:8px}.panel::-webkit-scrollbar-thumb{background:#ff6a2b66}
  h1{font-size:44px;letter-spacing:4px;margin-bottom:0;font-weight:800;
    background:linear-gradient(#fff 30%,#ffb14d 60%,#ff5c1a 100%);-webkit-background-clip:text;
    background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 22px #ff5c1a88)}
  .v2{display:inline-block;font-size:15px;font-weight:800;letter-spacing:2px;color:#05040a;
    background:linear-gradient(#ffd93d,#ff8f1a);padding:3px 12px;margin-left:10px;vertical-align:6px;
    box-shadow:0 0 18px #ffb14d88;transform:skewX(-10deg)}
  .sub{font-size:13px;color:#9aa0b4;margin:8px 0 20px;letter-spacing:.5px}
  h2{font-size:24px;margin-bottom:14px;letter-spacing:2px;text-shadow:0 3px 0 #000,0 0 20px #ff5c1a66}
  .mcbtn{display:block;width:100%;margin:7px 0;padding:13px 10px;font:inherit;font-size:16px;font-weight:700;
    color:#e8e8ee;letter-spacing:1px;background:linear-gradient(#2a2732,#16141d);
    border:1px solid #ffffff22;cursor:pointer;transition:.12s;position:relative;overflow:hidden}
  .mcbtn:hover{background:linear-gradient(#3a3646,#211e2b);border-color:#ff8f4d88;
    box-shadow:0 0 24px #ff5c1a33,inset 0 0 24px #ff5c1a18;transform:translateY(-1px)}
  .mcbtn:active{transform:translateY(1px)}
  .mcbtn.primary{background:linear-gradient(#ff9d3c,#ff5c1a);color:#1a0c02;border-color:#ffd08a;
    text-shadow:0 1px 0 #ffd08a88;box-shadow:0 0 30px #ff5c1a66}
  .mcbtn.primary:hover{background:linear-gradient(#ffb864,#ff7433);box-shadow:0 0 44px #ff5c1aaa}
  .mcbtn.small{font-size:13px;padding:10px 8px}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .opt{padding:12px 7px;background:#1a1822aa;border:1px solid #ffffff18;cursor:pointer;
    font-size:14px;transition:.12s;position:relative}
  .opt:hover{background:#262233cc;border-color:#ffffff33}
  .opt.sel{background:linear-gradient(#40270f,#20120a);border-color:#ffb14d;
    box-shadow:0 0 22px #ff8f1a44,inset 0 0 18px #ff8f1a22}
  .opt.sel::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,#ff5c1a,#ffd93d)}
  .opt .t{font-size:15px;font-weight:800;margin-bottom:4px;letter-spacing:.5px}
  .opt .d{font-size:11px;color:#a8adbd;line-height:1.5}
  .lab{font-size:11px;color:#6f7488;text-align:left;margin:18px 0 8px;letter-spacing:3px;font-weight:700}
  .lab span{color:#ff8f4d}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:8px 12px;background:#ffffff0a;margin-bottom:3px;
    border-left:2px solid #ff6a2b66}
  .kv b{color:#ffd93d;font-weight:700}
  table.stats{width:100%;font-size:13px;border-collapse:collapse;margin-top:8px}
  table.stats td{padding:7px 10px;border-bottom:1px solid #ffffff10}
  table.stats td:nth-child(2){text-align:right;color:#6fd0ff;font-weight:800}
  table.stats td:nth-child(3){text-align:right;color:#ff7a7a;font-weight:800;width:24%}
  table.stats th{font-size:11px;color:#6f7488;padding:5px 10px;text-align:right;letter-spacing:1px}
  table.stats th:first-child{text-align:left}
  .slider{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 2px}
  .slider span:first-child{width:140px;text-align:left;color:#a8adbd}
  .slider span:last-child{width:56px;text-align:right;color:#ffb14d;font-weight:700}
  input[type=range]{flex:1;-webkit-appearance:none;height:6px;background:#000;border:1px solid #ffffff22;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:20px;
    background:linear-gradient(#ffb14d,#ff5c1a);border:1px solid #000;box-shadow:0 0 12px #ff5c1a88}
  input[type=range]::-moz-range-thumb{width:12px;height:20px;background:#ff8f1a;border:1px solid #000;border-radius:0}
  .keys{display:grid;grid-template-columns:repeat(2,1fr);gap:5px 18px;font-size:12.5px;text-align:left;color:#b8bdcd}
  .keys div{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:#ffffff08}
  .keys div.hot{background:linear-gradient(90deg,#ff5c1a22,transparent);border-left:2px solid #ff8f1a}
  .keys kbd{background:#26232f;border:1px solid #000;box-shadow:0 2px 0 #0a090d;padding:2px 8px;
    font-family:inherit;font-size:11px;color:#ffd93d;margin-left:8px;font-weight:700}
  .win{font-size:40px;font-weight:800;letter-spacing:6px;margin-bottom:2px}
  .win.w{color:#7dff9b;text-shadow:0 0 40px #0f8a3f,0 4px 0 #000}
  .win.l{color:#ff5c5c;text-shadow:0 0 40px #8a0f0f,0 4px 0 #000}
  .score{font-size:60px;font-weight:800;letter-spacing:8px;margin:4px 0 12px;text-shadow:0 4px 0 #000}
  .score .me{color:#6fd0ff}.score .op{color:#ff7a7a}
  .hint{font-size:11.5px;color:#6f7488;margin-top:16px;line-height:1.8}
  .hint b{color:#ffb14d}
  #load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#05040a;z-index:30;
    flex-direction:column;gap:16px;font-size:14px;color:#6f7488}
  .barwrap{width:300px;height:6px;background:#15131c;border:1px solid #ffffff18}
  .bar{height:100%;width:0;background:linear-gradient(90deg,#ff5c1a,#ffd93d);transition:width .18s;box-shadow:0 0 16px #ff8f1a}
  /* ===== 핵 클라이언트 창 ===== */
  .fpanel{position:fixed;z-index:20;font-family:inherit;user-select:none;
    background:#0a0812f2;border:1px solid #ffffff14;
    box-shadow:0 18px 50px #000000cc, 0 0 0 1px #00000088;backdrop-filter:blur(3px)}
  #hackPanel{left:26px;top:50%;transform:translateY(-50%);width:340px}
  #hackerPanel{right:26px;top:50%;transform:translateY(-50%);width:206px}
  /* 타이틀바 */
  .fbar{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:grab;
    background:linear-gradient(160deg,#1a0f1e,#0c0812);border-bottom:1px solid #ffffff10}
  .fbar:active{cursor:grabbing}
  .fbar .flogo{width:16px;height:16px;display:grid;place-items:center;font-size:11px;
    background:linear-gradient(135deg,#ff2d55,#7a0f2a);color:#fff;font-weight:800}
  #hackerPanel .fbar .flogo{background:linear-gradient(135deg,#12d67a,#064a2a)}
  .fbar .fname{font-size:13px;font-weight:800;letter-spacing:2.5px;color:#fff}
  .fbar .fver{font-size:9px;color:#ff2d55;font-weight:700;letter-spacing:1px}
  #hackerPanel .fbar .fver{color:#12d67a}
  .fbar .fx{margin-left:auto;font-size:11px;color:#55506a;cursor:pointer;padding:0 3px}
  .fbar .fx:hover{color:#ff5c7a}
  /* 카테고리 탭 */
  .ftabs{display:flex;background:#07050e;border-bottom:1px solid #ffffff0d}
  .ftab{flex:1;text-align:center;padding:7px 2px 6px;font-size:10.5px;font-weight:700;color:#4d4a63;
    cursor:pointer;border-bottom:2px solid transparent;transition:.12s;white-space:nowrap}
  .ftab:hover{color:#9a95b5;background:#ffffff06}
  .ftab.fsel{color:#fff;border-bottom-color:#ff2d55;background:#ff2d5510}
  /* 검색 */
  .fsearch{padding:7px 10px;border-bottom:1px solid #ffffff0a}
  .fsearch input{width:100%;background:#05040a;border:1px solid #ffffff12;color:#d8d5e6;
    font-family:inherit;font-size:11px;padding:5px 7px;outline:none}
  .fsearch input:focus{border-color:#ff2d5566}
  .fsearch input::placeholder{color:#3f3b52}
  /* 모듈 리스트 */
  .flist{max-height:min(52vh,430px);overflow-y:auto;overscroll-behavior:contain}
  .flist::-webkit-scrollbar{width:5px}
  .flist::-webkit-scrollbar-thumb{background:#2a2438}
  .flist::-webkit-scrollbar-track{background:#07050e}
  .fmod{display:flex;align-items:center;gap:8px;padding:7px 11px;cursor:pointer;
    font-size:12px;border-left:2px solid transparent;transition:.1s}
  .fmod:hover{background:#ffffff09}
  .fmod.fon{background:linear-gradient(90deg,#ff2d5514,transparent);border-left-color:#ff2d55}
  #hackerPanel .fmod.fon{background:linear-gradient(90deg,#12d67a14,transparent);border-left-color:#12d67a}
  .fmod .fdot{width:7px;height:7px;flex-shrink:0;background:#241f33;transition:.12s;border-radius:1px}
  .fmod.fon .fdot{background:#ff2d55;box-shadow:0 0 7px #ff2d55}
  #hackerPanel .fmod.fon .fdot{background:#12d67a;box-shadow:0 0 7px #12d67a}
  .fmod .flabel{flex:1;color:#7d788f;font-weight:700;min-width:0}
  .fmod.fon .flabel{color:#fff}
  .fmod .fkey{font-size:9px;color:#3f3b52;font-weight:700;letter-spacing:.5px}
  .fmod.fon .fkey{color:#ff8fa5}
  .fmod .farrow{font-size:8px;color:#3f3b52;width:9px;text-align:center;transition:.12s}
  .fmod.fopen .farrow{transform:rotate(90deg);color:#ff2d55}
  .fdesc{padding:0 11px 7px 30px;font-size:10px;color:#5b5670;line-height:1.55}
  /* 모듈 설정 */
  .fset{padding:2px 11px 9px 30px;background:#05040a80;border-left:2px solid #ff2d5544}
  .fsrow{margin-bottom:7px}
  .fsrow:last-child{margin-bottom:0}
  .fsrow .fslab{display:flex;justify-content:space-between;font-size:10px;color:#8d88a3;
    font-weight:700;margin-bottom:3px}
  .fsrow .fsval{color:#ff2d55}
  .fsrow input[type=range]{width:100%;height:3px;-webkit-appearance:none;appearance:none;
    background:#241f33;outline:none;cursor:pointer}
  .fsrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:10px;height:10px;background:#ff2d55;cursor:pointer;box-shadow:0 0 6px #ff2d5599}
  .fsrow input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;
    background:#ff2d55;cursor:pointer}
  /* 하단바 */
  .ffoot{display:flex;align-items:center;gap:6px;padding:6px 11px;font-size:9px;color:#3f3b52;
    background:#07050e;border-top:1px solid #ffffff0a}
  .ffoot b{color:#6d6885}
  .ffoot .fcount{margin-left:auto;color:#ff2d55;font-weight:800}
  #hackerPanel .ffoot .fcount{color:#12d67a}
  .fempty{padding:18px 11px;text-align:center;font-size:10.5px;color:#3f3b52}
  /* 해커 전용 */
  .faction{padding:6px 11px;cursor:pointer;font-size:11.5px;color:#7d788f;display:flex;
    align-items:center;gap:8px;transition:.1s;border-left:2px solid transparent;font-weight:700}
  .faction:hover{background:#ffffff09}
  .faction .fdot{width:7px;height:7px;flex-shrink:0;background:#241f33;border-radius:1px}
  .faction.fon{background:linear-gradient(90deg,#ff2d5514,transparent);border-left-color:#ff2d55}
  .faction.fon .fdot{background:#ff2d55;box-shadow:0 0 7px #ff2d55}
  .faction.fon .flabel{color:#ff9ab0}
  .fdiv{height:1px;background:#ffffff0d;margin:3px 0}
  .fclue{padding:5px 11px 7px;font-size:9px;color:#3a3550;text-align:center;line-height:1.6}
  /* 해커 정보 */
  .hkinfo{padding:8px 10px 4px}
  .hkrow{display:flex;justify-content:space-between;font-size:10.5px;padding:2px 0;color:#7a7a9a}
  .hkrow b{color:#4aff9c;font-weight:700}
  .hkbar{height:5px;background:#1a2a1a;border-radius:2px;margin:4px 0 6px}
  .hkbar div{height:100%;border-radius:2px;transition:.2s}
  /* 모드 설정 화면 */
  .modrow{display:grid;grid-template-columns:18px 1fr;gap:3px 10px;align-items:center;text-align:left;
    padding:8px 11px;margin-bottom:4px;background:#ffffff08;border-left:2px solid #ffffff18;cursor:pointer;transition:.12s}
  .modrow:hover{background:#ffffff12}
  .modrow.on{background:linear-gradient(90deg,#ff5c1a22,transparent);border-left-color:#ff8f1a}
  .modrow input{width:15px;height:15px;accent-color:#ff8f1a;cursor:pointer;grid-row:span 2}
  .modrow .mt{font-size:14px;font-weight:700;color:#c8ccd8}
  .modrow.on .mt{color:#ffd93d}
  .modrow .md{font-size:11px;color:#7a7f92;grid-column:2;line-height:1.5}
  .modrow kbd{background:#26232f;border:1px solid #000;box-shadow:0 2px 0 #0a090d;padding:1px 6px;
    font-family:inherit;font-size:11px;color:#ffd93d;margin-left:6px;font-weight:700}
  /* ===== 모바일 터치 조작 ===== */
  #touch{position:fixed;inset:0;z-index:15;display:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #touch.on{display:block}
  #touch .tz{position:absolute;pointer-events:auto}
  /* 왼쪽 조이스틱 */
  #tstick{left:0;bottom:0;width:44%;height:64%;pointer-events:auto}
  #tstickBase{position:absolute;width:132px;height:132px;border-radius:50%;
    border:2px solid #ffffff2a;background:#0a081266;left:26px;bottom:26px;
    display:grid;place-items:center;transition:opacity .15s;opacity:.75}
  #tstickKnob{width:56px;height:56px;border-radius:50%;background:#ffffff33;
    border:2px solid #ffffff55;transition:transform .05s linear}
  /* 오른쪽 시점 영역 */
  #tlook{right:0;top:0;width:56%;height:100%;pointer-events:auto}
  /* 버튼 공통 */
  .tbtn{position:absolute;pointer-events:auto;display:grid;place-items:center;
    border-radius:50%;background:#0a0812aa;border:2px solid #ffffff28;color:#e8e6f2;
    font-weight:800;text-align:center;line-height:1.15;font-family:inherit;
    -webkit-tap-highlight-color:transparent}
  .tbtn:active,.tbtn.tdown{background:#ff2d5544;border-color:#ff2d55aa;color:#fff;transform:scale(.94)}
  .tbtn small{display:block;font-size:8px;opacity:.6;font-weight:700}
  #tAtk{right:22px;bottom:120px;width:88px;height:88px;font-size:14px;
    background:#7a0f2aaa;border-color:#ff2d5566}
  #tUse{right:120px;bottom:150px;width:62px;height:62px;font-size:11px}
  #tJump{right:118px;bottom:64px;width:66px;height:66px;font-size:12px}
  #tSneak{right:22px;bottom:40px;width:62px;height:62px;font-size:11px}
  #tSneak.tlock{background:#ff8f1a55;border-color:#ff8f1aaa}
  #tQ{right:196px;bottom:172px;width:50px;height:50px;font-size:11px}
  #tF{right:200px;bottom:112px;width:50px;height:50px;font-size:11px}
  /* 상단 유틸 버튼 */
  .ttop{position:absolute;top:8px;pointer-events:auto;padding:7px 11px;border-radius:5px;
    background:#0a0812bb;border:1px solid #ffffff22;color:#c8c5d8;font-size:11px;font-weight:800;
    font-family:inherit;-webkit-tap-highlight-color:transparent}
  .ttop:active{background:#ff2d5544}
  #tPause{right:8px}
  #tChat{right:64px;color:#c8c5d8}
  #tHackBtn{right:128px;color:#ff8fa5}
  #tHackerBtn{right:186px;color:#7dffc0}
  /* 핫바 */
  #tbar{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;display:flex;gap:6px;
    pointer-events:auto}
  .tslot{width:52px;height:52px;background:#0a0812bb;border:2px solid #ffffff22;border-radius:4px;
    display:grid;place-items:center;position:relative;color:#e8e6f2;font-size:19px;font-weight:800}
  .tslot.tsel{border-color:#ffd93d;background:#ffd93d22}
  .tslot b{position:absolute;right:3px;bottom:1px;font-size:10px;color:#ffd93d}
  @media (max-height:430px){
    #tstickBase{width:108px;height:108px;left:16px;bottom:16px}
    #tstickKnob{width:46px;height:46px}
    #tAtk{width:74px;height:74px;bottom:92px;right:16px}
    #tUse{width:54px;height:54px;bottom:118px;right:100px}
    #tJump{width:56px;height:56px;bottom:48px;right:98px}
    #tSneak{width:52px;height:52px;bottom:30px;right:16px}
    #tQ{width:44px;height:44px;right:164px;bottom:136px}
    #tF{width:44px;height:44px;right:168px;bottom:86px}
    .tslot{width:44px;height:44px;font-size:16px}
  }
  /* 좁은 화면에서 핵 창이 넘치지 않도록 */
  @media (max-width:760px){
    #hackPanel{width:min(300px,86vw);left:8px}
    #hackerPanel{width:min(200px,60vw);right:8px}
    .flist{max-height:44vh}
  }
  /* ===== 채팅 / 명령어 ===== */
  #chat{position:fixed;left:0;right:0;bottom:0;z-index:22;display:none;
    background:linear-gradient(transparent,#05040ae6 22%);padding:60px 10px 8px}
  #chat.on{display:block}
  #chatIn{width:100%;background:#05040ad9;border:1px solid #ffffff2a;color:#fff;
    font-family:inherit;font-size:14px;padding:8px 11px;outline:none;caret-color:#7dff9b}
  #chatIn:focus{border-color:#7dff9b88}
  #chatSug{max-height:190px;overflow-y:auto;margin-bottom:5px;background:#05040ae0;
    border:1px solid #ffffff18;display:none}
  #chatSug.on{display:block}
  .csug{padding:5px 10px;font-size:12px;color:#8a8aaa;cursor:pointer;display:flex;gap:9px;align-items:baseline}
  .csug:hover,.csug.sel{background:#7dff9b18;color:#fff}
  .csug b{color:#7dff9b;font-weight:800;min-width:96px}
  .csug span{font-size:10.5px;color:#6a6a85;flex:1}
  .csug.sel span{color:#9a9ab5}
  #chatHint{font-size:10px;color:#4a4a63;padding:4px 2px 0}
  #chatHint b{color:#7dff9b}
  /* ===== 배드워즈 상점 ===== */
  #bwShop{left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,92vw)}
  #bwShop .fbar .flogo{background:linear-gradient(135deg,#ffd93d,#8a6a1f)}
  #bwShop .fbar .fver{color:#ffd93d}
  .bwres{display:flex;gap:14px;padding:8px 12px;background:#07050e;font-size:12px;
    color:#8a8aaa;border-bottom:1px solid #ffffff0d}
  .bwres b{color:#ffd93d;font-weight:800}
  .bwlist{max-height:min(52vh,420px);overflow-y:auto}
  .bwitem{padding:8px 12px;border-left:2px solid #ffd93d55;cursor:pointer;transition:.1s;
    display:grid;grid-template-columns:1fr auto;gap:2px 10px}
  .bwitem:hover{background:#ffd93d12}
  .bwitem.no{border-left-color:#ffffff14;opacity:.45;cursor:not-allowed}
  .bwn{font-size:12.5px;font-weight:800;color:#fff}
  .bwd{font-size:10.5px;color:#7a7f92;grid-column:1}
  .bwc{grid-row:span 2;align-self:center;font-size:11px;font-weight:800;color:#ffd93d;white-space:nowrap}
  .bwitem.no .bwc{color:#6a6a85}
  /* ===== 인벤토리 설정 ===== */
  .invrow{display:flex;align-items:center;gap:12px;text-align:left;padding:9px 12px;margin-bottom:5px;
    background:#ffffff08;border-left:2px solid #ffffff18;cursor:pointer;transition:.12s}

Entity.prototype.performAttack = function (target, cooled) {

  if (_Md && _Md.criticals && full) crit = true;      // Criticals : 항상 크리

  var botReach = (mods && mods.reach) ? mods.reachDist : d.reach;
  var reachOk = (mods && mods.killAura)
    ? (realDist < Math.max(botReach, mods.auraRange))   // 킬오라 : 조준 불필요
    : (rayHitsEntity(e, target, botReach) >= 0);
  var strength = e.attackStrength(0.5);
  var canAtk;
  if (COMBAT.mode === 18) {
    this.clickTimer -= 1;
    canAtk = this.clickTimer <= 0;
  } else {
    canAtk = strength >= d.atkStr;
  }

  /* ---- 크리티컬 : 공격 직후 "이번 사이클은 크리로 간다"를 결정 ----
     1.9+ 에서는 스프린트 공격(넉백)과 크리티컬을 동시에 얻을 수 없다.
     그래서 실제 PvP 처럼 둘 중 하나를 골라 커밋한다.                     */
  if (e.ticksSinceSwing <= 1) this.critIntent = (Math.random() < d.crit);
  if (e.onGround) this.critPending = false;

  if (this.critIntent && !e.eating && !e.blocking && realDist < 3.5 && realDist > 1.2) {
    if (COMBAT.mode === 19) e.sprinting = false;     // 크리티컬을 위해 달리기 포기
    if (e.onGround && !this.critPending && (COMBAT.mode === 18 || strength > 0.55)) {
      e.jumping = true; this.critPending = true;
    }
  }

  /* 사람처럼 가끔 멈칫한다 */
  if (this.hesitateT > 0) this.hesitateT--;
  else if (Math.random() < d.hesitate) this.hesitateT = rndInt(6, 18);

  var aura = !!(mods && mods.killAura);
  var doIt = canAtk && reachOk && !e.eating && !e.dead && (aura || this.hesitateT === 0);
  /* 크리티컬 노리는 중이면 낙하가 시작될 때까지 참는다 (킬오라는 무시) */
  if (doIt && !aura && this.critIntent && this.critPending && (e.onGround || e.fallDistance <= 0)) doIt = false;

  if (doIt) {
    if (e.blocking) e.blocking = false;
    e.attemptAttack(target);
    this.clickTimer = Math.max(1, Math.round(20 / d.cps) + rndInt(-1, 1));
    this.critPending = false; this.critIntent = false;
    if (d.wtap) this.wtapTimer = rndInt(2, 4);
  } else if (canAtk && !reachOk && !e.eating && !e.dead && !this.critPending &&
    realDist < 4.3 && Math.random() < d.whiff) {
    /* 사람처럼 가끔 헛스윙 (1.9+ 에선 쿨다운이 초기화된다) */
    e.attemptAttack(target);
    this.clickTimer = Math.max(1, Math.round(20 / d.cps) + rndInt(-1, 1));
  }
};

/* =====================================================================
   배드워즈 AI : 자원 모으기 → 다리 놓기 → 침대 부수기 → 교전
   true 를 돌려주면 이 틱은 배드워즈 로직이 전담한다
   ===================================================================== */
/* =====================================================================
   머더 AI — 역할에 따라 완전히 다르게 움직인다
   ===================================================================== */
BotAI.prototype.murder = function () {
  var e = this.e;
  var me = Game.mmIndexOf(e);
  if (me < 0) return false;
  if (this.killCool === undefined) this.killCool = 0;
  var role = MM.roles[me];
  e.moveForward = 0; e.moveStrafe = 0; e.jumping = false; e.sprinting = false;
  if (MM.over) return true;

  /* --- 목표 선정 --- */
  var goal = null, flee = null, best = 1e9;
  for (var i = 0; i < Game.entities.length; i++) {
    var o = Game.entities[i];
    if (o === e || o.dead) continue;
    var dx = o.x - e.x, dz = o.z - e.z, d = Math.sqrt(dx * dx + dz * dz);
    if (role === 'murderer') {
      if (d < best) { best = d; goal = o; }
    } else {
      /* 정체가 드러난 살인자는 피하거나(시민) 쫓는다(활 소지자) */
      if (MM.roles[i] === 'murderer' && MM.revealed[i]) {
        if (Game.mmHasBow(e)) { goal = o; best = d; }
        else if (d < 14) { flee = o; }
      }
    }
  }
  /* 활이 떨어져 있으면 주우러 간다 — 단 살인자가 그 근처면 포기 */
  var bowSafe = MM.bowDrop && !(function () {
    for (var q = 0; q < Game.entities.length; q++) {
      if (MM.roles[q] !== 'murderer' || Game.entities[q].dead) continue;
      var o2 = Game.entities[q];
      return Math.hypot(o2.x - MM.bowDrop.x, o2.z - MM.bowDrop.z) < 7;
    }
    return false;
  })();
  if (role !== 'murderer' && !Game.mmHasBow(e) && bowSafe && !flee) {
    goal = { x: MM.bowDrop.x, y: MM.bowDrop.y, z: MM.bowDrop.z, eyeY: function () { return this.y + 0.4; } };
    best = Math.sqrt((goal.x - e.x) * (goal.x - e.x) + (goal.z - e.z) * (goal.z - e.z));
  }

  /* --- 배회 --- */
  if (!goal && !flee) {
    if (this.wanderT === undefined || --this.wanderT <= 0) {
      this.wanderT = rndInt(40, 110);
      var a = Math.random() * TAU, r = rnd(4, 12);
      this.wx = CX + 0.5 + Math.cos(a) * r; this.wz = CZ + 0.5 + Math.sin(a) * r;
    }
    goal = { x: this.wx, y: e.y, z: this.wz, eyeY: function () { return this.y + 1.2; } };
    best = 99;
  }

  var tx, tz, away = false;
  if (flee) {
    /* 살인자에게서 정면으로 멀어진다 (가장자리 처리는 아래 edge 블록이 접선으로 꺾어준다).
       반대편 지점을 노리면 살인자를 지나쳐 달리게 되므로 쓰지 않는다. */
    var ax = e.x - flee.x, az = e.z - flee.z;
    var al = Math.sqrt(ax * ax + az * az) || 1;
    tx = e.x + (ax / al) * 12;
    tz = e.z + (az / al) * 12;
    away = true;
  }
  else { tx = goal.x; tz = goal.z; }

  var dx2 = tx - e.x, dz2 = tz - e.z;
  var dist = Math.sqrt(dx2 * dx2 + dz2 * dz2) || 0.001;

  /* 조준 : 도망칠 땐 진행 방향, 아니면 목표 */
  var lookX = away ? dx2 : (goal ? goal.x - e.x : dx2);
  var lookZ = away ? dz2 : (goal ? goal.z - e.z : dz2);
  var wantYaw = Math.atan2(-lookX, lookZ) / DEG;
  /* 도망칠 땐 뒷걸음질치지 않도록 빠르게 몸을 돌린다 (안 그러면 걷는 속도로 잡힌다) */
  e.yaw = approachDeg(e.yaw, wantYaw, away ? 26 : this.d.turn);
  if (goal && !away && goal.eyeY) {
    var dy = goal.eyeY() - e.eyeY();
    var fd = Math.sqrt(lookX * lookX + lookZ * lookZ);
    e.pitch = clamp(approachDeg(e.pitch, -Math.atan2(dy, Math.max(0.6, fd)) / DEG, this.d.turn), -90, 90);
  } else e.pitch = approachDeg(e.pitch, 0, 6);

  /* 아레나 밖으로 나가지 않기 —
     도망 중이면 중심으로 꺾지 말고 테두리를 따라 돈다 (살인자 품으로 뛰어들지 않도록) */
  var edge = octDist(e.x - CX, e.z - CZ);
  if (edge > 12.6) {
    var cx = (CX + 0.5) - e.x, cz = (CZ + 0.5) - e.z, cl = Math.sqrt(cx * cx + cz * cz) || 1;
    cx /= cl; cz /= cl;
    if (away && flee) {
      var tgx = -cz, tgz = cx;                       // 접선 방향
      var fx = e.x - flee.x, fz = e.z - flee.z;      // 살인자 반대쪽 접선을 고른다
      if (tgx * fx + tgz * fz < 0) { tgx = -tgx; tgz = -tgz; }
      dx2 = tgx * 0.86 + cx * 0.34;
      dz2 = tgz * 0.86 + cz * 0.34;
      var nl = Math.sqrt(dx2 * dx2 + dz2 * dz2) || 1;
      dx2 /= nl; dz2 /= nl;
    } else { dx2 = cx; dz2 = cz; away = false; }
    dist = 1;
  }

  /* 활을 든 쪽은 너무 가까워지면 조준을 유지한 채 뒷걸음질친다 (카이팅) */
  var backpedal = (Game.mmHasBow(e) && goal && goal.hurt && best < 6.5);
  if (backpedal) { dx2 = -(goal.x - e.x); dz2 = -(goal.z - e.z); dist = Math.max(0.001, best); }

  /* 이동 */
  var sy = Math.sin(e.yaw * DEG), cy = Math.cos(e.yaw * DEG);
  var nx = dx2 / dist, nz = dz2 / dist;
  var fwd = nx * (-sy) + nz * cy, stf = nx * cy + nz * sy;
  var stop = (role === 'murderer') ? 1.4 : (Game.mmHasBow(e) ? 9.0 : 0.8);
  if (away || backpedal || dist > stop) {
    e.moveForward = Math.abs(fwd) > 0.34 ? sign(fwd) : 0;
    e.moveStrafe = Math.abs(stf) > 0.34 ? sign(stf) : 0;
    /* 살인자는 스토킹하듯 걷는다 (짧게 돌진할 때만 달림) — 도망칠 여지를 준다 */
    var lunge = (role === 'murderer' && best < 4.5);
    e.sprinting = (e.moveForward > 0 && e.food > 6 &&
                   (away || backpedal || lunge || (role !== 'murderer' && dist > 3)));
  }

  /* --- 행동 --- */
  if (this.killCool > 0) this.killCool--;
  if (role === 'murderer' && goal && goal.hurt && best < 2.6 &&
      e.ticksSinceSwing >= 12 && this.killCool === 0) {
    e.attemptAttack(goal);
    this.killCool = 140;                // 한 명 죽인 뒤엔 한참 물러선다 (연쇄 학살 방지)
  } else if (Game.mmHasBow(e) && goal && goal.hurt && best < 22 && e.bowCool === 0) {
    /* 조준이 얼추 맞으면 쏜다 */
    var lv = e.lookVec();
    var gx = goal.x - e.x, gz = goal.z - e.z, gl = Math.sqrt(gx * gx + gz * gz) || 1;
    if ((gx / gl) * lv[0] + (gz / gl) * lv[2] > 0.93 && Math.random() < 0.55) e.shootBow();
  }
  return true;
};

BotAI.prototype.bedwars = function (target) {
  var e = this.e, d = this.d;
  var myIsle = BW_ISLE[1], foeIsle = BW_ISLE[0];
  if (!myIsle || !foeIsle) return false;

  var distToFoe = Math.sqrt((target.x - e.x) * (target.x - e.x) + (target.z - e.z) * (target.z - e.z));
  /* 상대가 가까우면 평소 전투 AI 에게 넘긴다 */
  if (distToFoe < 6.5 && !target.dead) return false;

  /* 상점 : 자원이 모이면 자동 구매 (블록 우선) */
  if (this.shopT === undefined) this.shopT = 0;
  if (--this.shopT <= 0) {
    this.shopT = 40;
    var res = BW.res[1];
    if (res.iron >= 4 && e.blocks < 24) { res.iron -= 4; e.blocks += 16; }
    else if (res.gold >= 3 && e.gapples < 3) { res.gold -= 3; e.gapples += 2; }
    else if (res.gold >= 6 && !(BW.upg[1].armor >= 8)) { res.gold -= 6; BW.upg[1].armor = (BW.upg[1].armor || 0) + 4; }
    else if (res.emerald >= 3) { res.emerald -= 3; BW.upg[1].sharp = (BW.upg[1].sharp || 0) + 1; }
  }

  /* 목표 : 상대 침대(살아 있으면) 아니면 상대 본인 */
  var goalX, goalZ, attackBed = false;
  if (BW.beds[0]) { goalX = foeIsle.bedX + 0.5; goalZ = foeIsle.bedZ + 0.5; attackBed = true; }
  else { goalX = target.x; goalZ = target.z; }

  var dx = goalX - e.x, dz = goalZ - e.z;
  var dist = Math.sqrt(dx * dx + dz * dz) || 0.001;
  var tox = dx / dist, toz = dz / dist;

  /* 조준 */
  var aimY = attackBed ? (SURF + 1.5) : (target.eyeY() - 0.2);
  var wantYaw = Math.atan2(-dx, dz) / DEG;
  var dy = aimY - e.eyeY();
  e.yaw = approachDeg(e.yaw, wantYaw, d.turn);
  e.pitch = clamp(approachDeg(e.pitch, -Math.atan2(dy, Math.max(0.6, dist)) / DEG, d.turn), -90, 90);

  /* 침대에 닿았으면 부순다 */
  if (attackBed && dist < 4.2) {
    e.moveForward = dist > 2.2 ? 1 : 0;
    e.sprinting = false;
    if (e.ticksSinceSwing >= 6) {
      var hit = rayBlock(e, 4.6);
      if (hit && getBlock(hit.x, hit.y, hit.z) === foeIsle.bedBlock) {
        editBlock(hit.x, hit.y, hit.z, 0);
        e.swingArm(); Snd.breakBlock();
        burstBlock(hit.x + 0.5, hit.y + 0.5, hit.z + 0.5, T.BED_R_SIDE, 8);
      } else if (hit && BLOCKS[getBlock(hit.x, hit.y, hit.z)].breakable) {
        editBlock(hit.x, hit.y, hit.z, 0);      // 앞을 막은 방어벽 제거
        e.swingArm(); Snd.breakBlock();
      } else e.swingArm();
    }
    return true;
  }

  /* 이동 : 앞이 허공이면 블록을 놓아 다리를 만든다 */
  e.moveForward = 1;
  e.sprinting = e.food > 6;
  var aheadX = e.x + tox * 1.1, aheadZ = e.z + toz * 1.1;
  var footY = Math.floor(e.y - 0.2);
  if (e.onGround && !isSolidAt(Math.floor(aheadX), footY, Math.floor(aheadZ))) {
    /* 발 밑 앞칸이 비었다 → 다리 놓기 */
    if (e.blocks > 0) {
      if (editBlock(Math.floor(aheadX), footY, Math.floor(aheadZ), myIsle.wool)) {
        e.blocks--; e.swingArm(); Snd.place();
      }
    } else {
      /* 블록이 없으면 가장자리에서 멈춘다 (자살 방지) */
      e.moveForward = 0; e.sprinting = false;
    }
  }
  /* 한 칸 높은 턱은 점프로 넘는다 */
  if (e.onGround && isSolidAt(Math.floor(aheadX), Math.floor(e.y + 0.6), Math.floor(aheadZ)))
    e.jumping = true;
  return true;
};

BotAI.prototype.safe = function (x, y, z) {
  if (octDist(x - CX, z - CZ) > 16.6) return false;
  return groundBelow(x, y - 0.1, z, 3);
};

Render.resize = function (cv) {

function lerpAngle(a, b, t) { return a + wrapDeg(b - a) * t; }

Render.setupCamera = function (p, alpha) {
  /* --- K.O. 시네마틱 카메라 --- */
  var ko = Game.koCam;
  if (ko && ko.active && ko.target) {
    var t = ko.target;
    var kx = lerp(t.px, t.x, alpha), ky = lerp(t.py, t.y, alpha), kz = lerp(t.pz, t.z, alpha);
    var prog = clamp(ko.t / ko.dur, 0, 1);
    var ang = ko.baseAng + prog * 1.5;
    var dist = lerp(2.0, 4.4, prog), hgt = lerp(1.5, 2.5, prog);
    this.camX = kx + Math.cos(ang) * dist;
    this.camY = ky + hgt;
    this.camZ = kz + Math.sin(ang) * dist;
    var ddx = kx - this.camX, ddy = (ky + 1.0) - this.camY, ddz = kz - this.camZ;
    this.camYaw = Math.atan2(-ddx, ddz) / DEG;
    this.camPitch = -Math.atan2(ddy, Math.sqrt(ddx * ddx + ddz * ddz)) / DEG;
    this.camRoll = Math.sin(prog * Math.PI) * 4;
    var ka = this.scratch[0], kb = this.scratch[1], kc = this.scratch[2], kd = this.scratch[3];
    M4.rotZ(ka, this.camRoll * DEG); M4.rotX(kb, this.camPitch * DEG); M4.mul(kc, ka, kb);
    M4.rotY(ka, (this.camYaw + 180) * DEG); M4.mul(kd, kc, ka);
    M4.transV(ka, -this.camX, -this.camY, -this.camZ); M4.mul(this.view, kd, ka);
    M4.persp(this.proj, lerp(58, 74, prog) * DEG, this.W / this.H, 0.05, 900);
    return;
  }
  var eyeY = p.sneaking ? 1.54 : 1.62;
  var x = lerp(p.px, p.x, alpha), y = lerp(p.py, p.y, alpha), z = lerp(p.pz, p.z, alpha);
  this.camYaw = p === Game.player ? p.yaw : lerpAngle(p.pYaw, p.yaw, alpha);
  this.camPitch = p === Game.player ? p.pitch : lerpAngle(p.pPitch, p.pitch, alpha);
  var cy = y + eyeY;

  /* 시야 흔들림 */
  var bobX = 0, bobY = 0, roll = 0;
  if (Game.settings.bob && !this.thirdPerson) {
    var lsa = lerp(p.pLimbSwingAmount, p.limbSwingAmount, alpha) * 0.9;
    var f1 = -(p.distWalked * 2.2 + alpha * 0.02);
    bobX = Math.sin(f1 * Math.PI) * lsa * 0.28;
    bobY = -Math.abs(Math.cos(f1 * Math.PI) * lsa) * 0.22;
    roll += Math.sin(f1 * Math.PI) * lsa * 3.2;
  }
  /* 피격 흔들림 */
  var ht = p.hurtTime - alpha;
  var _hcM = modsFor(p);
  if (_hcM && _hcM.noHurtCam) ht = 0;
  if (ht > 0 && p.maxHurtTime > 0) {
    var f = ht / p.maxHurtTime; f = Math.sin(f * f * f * f * Math.PI);
    roll += -f * 14 * Math.cos(p.attackedAtYaw * DEG);
    this.camPitch += f * 6 * Math.sin(p.attackedAtYaw * DEG);
  }
  if (p.dead) {
    var dt = p.deathTicks + alpha;
    roll += 40 - 8000 / (dt * 6 + 200);
    cy -= Math.min(1.0, dt * 0.05);
  }
  /* 화면 흔들림 */
  if (Game.shake > 0.001) {
    var sh = Game.shake;
    this.camYaw += (Math.random() - 0.5) * sh * 2.6;
    this.camPitch += (Math.random() - 0.5) * sh * 2.0;
    roll += (Math.random() - 0.5) * sh * 3.4;
  }
  /* 격노 중엔 시야가 살짝 넓어진다 */
  this.camRoll = roll;

  var camX = x, camZ = z;
  if (this.thirdPerson) {
    var dist = 3.6 * this.thirdPerson;
    var lv = [-Math.sin(this.camYaw * DEG) * Math.cos(this.camPitch * DEG),
    -Math.sin(this.camPitch * DEG), Math.cos(this.camYaw * DEG) * Math.cos(this.camPitch * DEG)];
    var back = dist;
    for (var s = 0; s < 12; s++) {
      var t = dist * s / 12;
      if (isOpaqueAt(Math.floor(x - lv[0] * t), Math.floor(cy - lv[1] * t), Math.floor(z - lv[2] * t))) { back = Math.max(0.6, t - 0.35); break; }
    }
    camX = x - lv[0] * back; cy = cy - lv[1] * back; camZ = z - lv[2] * back;
  } else {
    camX += bobX * Math.cos(this.camYaw * DEG); camZ += bobX * Math.sin(this.camYaw * DEG);
    cy += bobY;
  }
  this.camX = camX; this.camY = cy; this.camZ = camZ;

  var a = this.scratch[0], b = this.scratch[1], c = this.scratch[2], d = this.scratch[3];
  M4.rotZ(a, this.camRoll * DEG);
  M4.rotX(b, this.camPitch * DEG);
  M4.mul(c, a, b);
  M4.rotY(a, (this.camYaw + 180) * DEG);
  M4.mul(d, c, a);
  M4.transV(a, -camX, -cy, -camZ);
  M4.mul(this.view, d, a);

  var fov = this.fov * (p.sprinting ? 1.11 : 1) * (p.rageTicks > 0 ? 1.06 : 1) * (Game.fovMul || 1);
  M4.persp(this.proj, fov * DEG, this.W / this.H, 0.05, 900);
};

Render.setFog = function (near, far, col) {
  gl.uniform1f(U.uFogNear, near); gl.uniform1f(U.uFogFar, far);
  gl.uniform3f(U.uFogColor, col[0], col[1], col[2]);
};

var FOG_COL = [0.42, 0.16, 0.10];
Render.rebuildMap = function () {
  this.skyMesh = buildSkyDome();
  this.lavaMesh = buildLavaSea();
  this.sunMesh = buildSunMesh();
};

Render.frame = function (alpha) {
  var p = Game.camTarget();
  this.setupCamera(p, alpha);
  this.time += 1 / 60;

  gl.viewport(0, 0, this.W, this.H);
  var FC = curMap.fog;
  gl.clearColor(FC[0], FC[1], FC[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(prog);
  gl.uniformMatrix4fv(U.uProj, false, this.proj);
  gl.uniformMatrix4fv(U.uView, false, this.view);
  gl.uniform4f(U.uTint, 0, 0, 0, 0);
  gl.uniform1f(U.uAlpha, 1);
  var _fbM = modsFor(Game.player);
  gl.uniform1f(U.uBright, (_fbM && _fbM.fullbright) ? 1.0 : 0);
  gl.uniform1f(U.uCut, 0.35);
  gl.activeTexture(gl.TEXTURE0);

  /* ---- 용암 바다 ---- */
  this.setFog(Game.settings.render * 1.4, Game.settings.render * 3.4, curMap.sea.fog);
  gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
  gl.disable(gl.CULL_FACE);
  this.ms.identity().translate(0, LAVA_Y, 0);
  gl.uniformMatrix4fv(U.uModel, false, this.ms.cur);
  if (this.lavaMesh) this.lavaMesh.draw();
  gl.enable(gl.CULL_FACE);

  /* ---- 월드 ---- */
  this.setFog(Game.settings.render * 0.55, Game.settings.render, FC);
  gl.uniformMatrix4fv(U.uModel, false, this.ident);
  M4.mul(this.vp, this.proj, this.view);
  this.updateFrustum(this.vp);
  this.drawn = 0; this.chunks = 0;
  if (this.worldMesh) {
    for (var ci = 0; ci < this.worldMesh.length; ci++) {
      var ch = this.worldMesh[ci]; this.chunks++;
      if (!this.boxInFrustum(ch.bb)) continue;
      ch.mesh.draw(); this.drawn++;
    }
  }
  /* 바닥 그림자 */
  if (Game.settings.shadows && !Game.settings.lowFx) this.drawShadows(alpha);

  /* ---- 하늘 (월드 뒤에 그려 오버드로우를 줄인다) ---- */
  /* ---- 하늘 ---- */
  gl.disable(gl.CULL_FACE); gl.depthMask(false);
  this.setFog(1e8, 1e9, FC);
  gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
  this.ms.identity().translate(this.camX, this.camY, this.camZ);
  gl.uniformMatrix4fv(U.uModel, false, this.ms.cur);
  this.skyMesh.draw();
  /* 해 */
  this.ms.identity().translate(this.camX, this.camY, this.camZ).rotY(curMap.sun.yaw * DEG).rotX(curMap.sun.pitch * DEG);
  gl.uniformMatrix4fv(U.uModel, false, this.ms.cur);
  this.sunMesh.draw();
  /* 구름 */
  if (!Game.settings.lowFx) {
  gl.enable(gl.BLEND);
  gl.bindTexture(gl.TEXTURE_2D, this.texCloud);
  gl.uniform4f(U.uTint, curMap.cloudCol[0], curMap.cloudCol[1], curMap.cloudCol[2], 1);
  gl.uniform1f(U.uAlpha, curMap.cloudA === undefined ? 0.7 : curMap.cloudA);
  this.ms.identity().translate(this.camX + this.time * 0.9, SURF + curMap.cloudY, this.camZ);
  gl.uniformMatrix4fv(U.uModel, false, this.ms.cur);
  this.cloudMesh.draw();
  gl.uniform4f(U.uTint, 0, 0, 0, 0); gl.uniform1f(U.uAlpha, 1);
  gl.disable(gl.BLEND);
  }
  gl.depthMask(true); gl.enable(gl.CULL_FACE);


  /* ---- 엔티티 ---- */
  for (var i = 0; i < Game.entities.length; i++) {
    var e = Game.entities[i];
    if (e === Game.player && !this.thirdPerson) continue;
    this.drawEntity(e, alpha);
  }

  /* ---- Chams : 벽 너머로 상대 실루엣을 한 번 더 그린다 ---- */
  var _cM = modsFor(Game.player);
  if (_cM && _cM.chams && Game.bot && !Game.bot.dead && Game.state === 'play') {
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND); gl.uniform1f(U.uAlpha, 0.55);
    var _cp = Math.sin(Game.now * 0.006) * 0.12;
    gl.uniform4f(U.uTint, 1, 0.25, 0.85, 0.72 + _cp);
    this.drawEntity(Game.bot, alpha);
    gl.uniform4f(U.uTint, 0, 0, 0, 0); gl.uniform1f(U.uAlpha, 1);
    gl.disable(gl.BLEND); gl.enable(gl.DEPTH_TEST);
  }

  /* ---- 검기 / 진주 / 충격파 / 파티클 ---- */
  this.drawBeams(alpha);
  this.drawPearls(alpha);
  this.drawWinds(alpha);
  this.drawParticles(alpha);
  this.drawRings(alpha);

  /* ---- 블록을 들고 있으면 조준 중인 칸을 표시 ---- */
  if (Game.state === 'play' && Game.player && !Game.player.dead && invAt(Game.player.slot) === 'blocks')
    this.drawBlockCursor();

  /* ---- 1인칭 손 ---- */
  if (!this.thirdPerson && !Game.player.dead) this.drawHand(alpha);
};

/* ---------------- 엔티티 ---------------- */
Render.drawEntity = function (e, alpha) {
  var ms = this.ms;
  var x = lerp(e.px, e.x, alpha), y = lerp(e.py, e.y, alpha), z = lerp(e.pz, e.z, alpha);
  var bodyYaw = lerpAngle(e.pBodyYaw, e.bodyYaw, alpha);
  var headYaw = lerpAngle(e.pYaw, e.yaw, alpha);
  var pitch = lerpAngle(e.pPitch, e.pitch, alpha);
  var swing = lerp(e.pSwingProgress, e.swingProgress, alpha);
  if (e.swinging && e.swingTicks < 0) swing = 0;
  var lsAmt = lerp(e.pLimbSwingAmount, e.limbSwingAmount, alpha);
  var ls = e.limbSwing;
  var P = PlayerModel.parts;

  var hurt = e.hurtTime > 0;
  if (hurt) gl.uniform4f(U.uTint, 1, 0.15, 0.15, 0.42);
  else if (e.rageTicks > 0) gl.uniform4f(U.uTint, 1, 0.35, 0.08, 0.20 + Math.sin(Game.now * 0.012) * 0.07);
  else gl.uniform4f(U.uTint, 0, 0, 0, 0);

  var deathRoll = e.dead ? Math.min(1, e.deathTicks / 15) * 90 : 0;

  ms.identity().translate(x, y, z);
  if (deathRoll) { ms.translate(0, 0.15, 0).rotZ(deathRoll * DEG); }
  ms.rotY(-bodyYaw * DEG);
  if (e.sneaking) ms.translate(0, -0.135, 0);
  ms.scale(MSCALE, MSCALE, MSCALE);

  var sneakLean = e.sneaking ? 0.5 : 0;
  var legR = Math.cos(ls * 0.6662) * 1.4 * lsAmt;
  var legL = Math.cos(ls * 0.6662 + Math.PI) * 1.4 * lsAmt;
  var armRx = Math.cos(ls * 0.6662 + Math.PI) * 1.0 * lsAmt;
  var armLx = Math.cos(ls * 0.6662) * 1.0 * lsAmt;

  /* 공격 스윙 */
  var bodySwingY = 0;
  if (swing > 0) {
    var f1 = 1 - swing; f1 = 1 - f1 * f1 * f1;
    bodySwingY = Math.sin(Math.sqrt(swing) * Math.PI * 2) * 0.2;
    armRx -= (Math.sin(f1 * Math.PI) * 1.25 + Math.sin(swing * Math.PI) * (0.7 - pitch * DEG) * 0.6);
  }
  /* 방패 들기 */
  var blockLift = e.blocking ? 1 : 0;
  var eatLift = e.eating ? 1 : 0;

  gl.bindTexture(gl.TEXTURE_2D, this.texSkin[e.skinIdx]);
  var M = PlayerModel.mesh;

  function part(pt, fn) {
    ms.push(); ms.translate(pt.p[0], pt.p[1], pt.p[2]);
    if (fn) fn();
    gl.uniformMatrix4fv(U.uModel, false, ms.cur);
    M.drawRange(pt.start, pt.count);
    ms.pop();
  }
  /* 머리 */
  var headRot = function () {
    ms.rotY(-wrapDeg(headYaw - bodyYaw) * DEG);
    ms.rotX(pitch * DEG);
    if (sneakLean) ms.translate(0, 0, 0);
  };
  if (e.sneaking) { ms.push(); ms.translate(0, -3, 4); }
  part(P.head, headRot); part(P.hat, headRot);
  if (e.sneaking) ms.pop();

  /* 몸통 */
  part(P.body, function () { ms.rotY(bodySwingY); ms.rotX(sneakLean); });

  /* 팔 */
  var armR = function () {
    ms.rotY(bodySwingY * 2);
    if (sneakLean) { ms.translate(0, -1, 3.6); ms.rotX(sneakLean * 0.7); }
    if (eatLift) { ms.rotX(-1.55 + Math.sin(Game.tickCount * 0.9) * 0.06); ms.rotY(0.35); }
    else if (blockLift && COMBAT.mode === 18) { ms.rotX(-0.9); ms.rotY(0.5); }
    else ms.rotX(armRx);
  };
  var armL = function () {
    ms.rotY(-bodySwingY * 2);
    if (sneakLean) { ms.translate(0, -1, 3.6); ms.rotX(sneakLean * 0.7); }
    if (blockLift && COMBAT.mode === 19) { ms.rotX(-1.15); ms.rotY(-0.55); }
    else ms.rotX(armLx);
  };
  part(P.armR, armR); part(P.armL, armL);
  /* 다리 */
  part(P.legR, function () { if (sneakLean) ms.translate(0, 0, 1); ms.rotX(legR); });
  part(P.legL, function () { if (sneakLean) ms.translate(0, 0, 1); ms.rotX(legL); });

  /* 겉날개 : 등에 붙은 날개 한 쌍 (활공 중엔 활짝 펼친다) */
  if (e.hasElytra && ItemMeshes.elytra) {
    gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
    var open = e.gliding ? 1 : 0;
    var flap = e.gliding ? Math.sin(Game.now * 0.004) * 4 : 0;
    for (var wi = 0; wi < 2; wi++) {
      var sgn = wi ? 1 : -1;
      ms.push();
      ms.translate(sgn * 2.0, 22.0, 2.4);
      ms.rotY(bodySwingY);
      ms.rotZ(sgn * (open ? 74 + flap : 12) * DEG);
      ms.rotX((open ? -6 : 4) * DEG);
      ms.rotY(sgn * (open ? 6 : -18) * DEG);
      ms.scale(12, 12, 12);
      ms.translate(sgn * 0.34, -0.42, 0);
      gl.uniformMatrix4fv(U.uModel, false, ms.cur);
      ItemMeshes.elytra.draw();
      ms.pop();
    }
  }

  /* 갑옷 */
  var AM = Inv.armor ? ArmorModels[e.kit.armorTile] : null;
  if (AM) {
    gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
    var AP = AM.parts, AMesh = AM.mesh;
    function apart(pt, fn) {
      ms.push(); ms.translate(pt.p[0], pt.p[1], pt.p[2]);
      if (fn) fn();
      gl.uniformMatrix4fv(U.uModel, false, ms.cur);
      AMesh.drawRange(pt.start, pt.count);
      ms.pop();
    }
    if (e.sneaking) { ms.push(); ms.translate(0, -3, 4); }
    apart(AP.helm, headRot); apart(AP.helmBand, headRot);
    if (e.sneaking) ms.pop();
    apart(AP.chest, function () { ms.rotY(bodySwingY); ms.rotX(sneakLean); });
    apart(AP.shR, armR); apart(AP.shL, armL);
    apart(AP.legR, function () { if (sneakLean) ms.translate(0, 0, 1); ms.rotX(legR); });
    apart(AP.legL, function () { if (sneakLean) ms.translate(0, 0, 1); ms.rotX(legL); });
    apart(AP.bootR, function () { if (sneakLean) ms.translate(0, 0, 1); ms.rotX(legR); });
    apart(AP.bootL, function () { if (sneakLean) ms.translate(0, 0, 1); ms.rotX(legL); });
  }

  /* 손에 든 아이템 */
  gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
  var itemKey = heldIcon(e);
  var im = ItemMeshes[itemKey];
  if (im) {
    ms.push();
    ms.translate(P.armR.p[0], P.armR.p[1], P.armR.p[2]);
    armR();
    ms.translate(-0.6, -10.2, 0.6);
    var ek = invAt(e.slot);
    var longItem = (ek === 'sword' || ek === 'mace');
    if (!longItem) { ms.rotY(-0.4); ms.scale(9, 9, 9); }
    else { ms.rotX(72 * DEG); ms.rotZ(45 * DEG); ms.scale(ek === 'mace' ? 17 : 15, ek === 'mace' ? 17 : 15, 15); ms.translate(0, 0.3, 0); }
    gl.uniformMatrix4fv(U.uModel, false, ms.cur);
    im.draw();
    /* 검격 잔상 */
    if (longItem) {
      if (!e._trail) e._trail = new Trail(11, [0.75, 0.99, 1]);
      e._trail.col = e.rageTicks > 0 ? [1, 0.5, 0.16] : [0.7, 0.97, 1];
      if (swing > 0.02 && swing < 0.96) e._trail.push(xform4(ms.cur, [0, 0.72, 0]), xform4(ms.cur, [0, -0.40, 0]));
      else e._trail.fade();
    }
    ms.pop();
  }
  /* 방패 (왼손) */
  if (e.blocking && COMBAT.mode === 19 && ItemMeshes.shield) {
    ms.push();
    ms.translate(P.armL.p[0], P.armL.p[1], P.armL.p[2]);
    armL();
    ms.translate(1.6, -8.5, 2.2);
    ms.rotY(-15 * DEG);
    ms.scale(15, 15, 15);
    gl.uniformMatrix4fv(U.uModel, false, ms.cur);
    ItemMeshes.shield.draw();
    ms.pop();
  }
  gl.uniform4f(U.uTint, 0, 0, 0, 0);
  if (e._trail && !Game.settings.lowFx) this.drawTrail(e._trail, false);
};

/* ---------------- 파티클 (일반 + 가산합성 2패스) ---------------- */
Render.drawParticles = function (alpha) {
  if (!particles.length) return;
  var v = this.view;
  var rx = v[0], ry = v[4], rz = v[8];
  var ux = v[1], uy = v[5], uz = v[9];
  gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
  gl.uniformMatrix4fv(U.uModel, false, this.ident);
  gl.disable(gl.CULL_FACE);
  gl.depthMask(false);
  gl.enable(gl.BLEND);

  for (var pass = 0; pass < 2; pass++) {
    var pm = this.particleMesh; pm.reset();
    var any = false;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (!!p.add !== (pass === 1)) continue;
      var x = lerp(p.px, p.x, alpha), y = lerp(p.py, p.y, alpha), z = lerp(p.pz, p.z, alpha);
      var ddx = x - this.camX, ddy = y - this.camY, ddz = z - this.camZ;
      if (ddx * ddx + ddy * ddy + ddz * ddz < 0.30) continue;
      var k = p.life / p.max;
      var s = p.size * (k > 0.25 ? 1 : k * 4);
      var f = pass === 1 ? clamp(k * 1.4, 0, 1) : 1;
      var uv = tileUV(p.tile);
      var ax = rx * s, ay = ry * s, az = rz * s, bx = ux * s, by = uy * s, bz = uz * s;
      pm.pushQuad(
        [x - ax - bx, y - ay - by, z - az - bz],
        [x + ax - bx, y + ay - by, z + az - bz],
        [x + ax + bx, y + ay + by, z + az + bz],
        [x - ax + bx, y - ay + by, z - az + bz],
        uv[0], uv[1], uv[2], uv[3], 1, p.col[0] * f, p.col[1] * f, p.col[2] * f);
      any = true;
    }
    if (!any) continue;
    if (pass === 1) { gl.blendFunc(gl.SRC_ALPHA, gl.ONE); gl.uniform1f(U.uCut, 0.02); }
    else { gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.uniform1f(U.uCut, 0.35); }
    pm.flush();
  }
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.uniform1f(U.uCut, 0.35);
  gl.depthMask(true); gl.disable(gl.BLEND); gl.enable(gl.CULL_FACE);
};

/* ---------------- 충격파 링 ---------------- */
Render.drawRings = function (alpha) {
  if (!rings.length) return;
  gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
  gl.disable(gl.CULL_FACE); gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE); gl.uniform1f(U.uCut, 0.02);
  for (var i = 0; i < rings.length; i++) {
    var g = rings[i];
    var r = lerp(g.pr, g.r, alpha), k = clamp(g.life / g.max, 0, 1);
    var a = k * k;
    gl.uniform4f(U.uTint, 0, 0, 0, 0);
    this.ms.identity().translate(g.x, g.y + 0.06, g.z);
    if (g.vert) { this.ms.rotY(g.yaw).rotX(90 * DEG); }
    this.ms.scale(r * 2, 1, r * 2);
    gl.uniformMatrix4fv(U.uModel, false, this.ms.cur);
    gl.uniform1f(U.uAlpha, a);
    var m = this.ringMesh;
    /* 정점색으로 밝기 조절 */
    gl.uniform4f(U.uTint, g.col[0], g.col[1], g.col[2], 0.85);
    m.draw();
  }
  gl.uniform1f(U.uAlpha, 1); gl.uniform4f(U.uTint, 0, 0, 0, 0);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.uniform1f(U.uCut, 0.35);
  gl.depthMask(true); gl.disable(gl.BLEND); gl.enable(gl.CULL_FACE);
};

/* ---------------- 검기 ---------------- */
Render.drawBeams = function (alpha) {
  if (!beams.length) return;
  gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
  gl.disable(gl.CULL_FACE); gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE); gl.uniform1f(U.uCut, 0.02);
  for (var i = 0; i < beams.length; i++) {
    var b = beams[i];
    var x = lerp(b.px, b.x, alpha), y = lerp(b.py, b.y, alpha), z = lerp(b.pz, b.z, alpha);
    var col = b.rage ? [1, 0.45, 0.14] : [0.55, 0.92, 1];
    var pulse = 1 + Math.sin(Game.now * 0.03) * 0.08;
    gl.uniform4f(U.uTint, col[0], col[1], col[2], 0.9);
    for (var k = 0; k < 2; k++) {
      this.ms.identity().translate(x, y, z).rotY(-b.yaw).rotZ((k ? -18 : 18) * DEG);
      this.ms.scale(b.size * pulse * (k ? 0.72 : 1), b.size * pulse * (k ? 0.72 : 1), 1);
      gl.uniformMatrix4fv(U.uModel, false, this.ms.cur);
      gl.uniform1f(U.uAlpha, k ? 0.55 : 1);
      this.beamMesh.draw();
    }
  }
  gl.uniform1f(U.uAlpha, 1); gl.uniform4f(U.uTint, 0, 0, 0, 0);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.uniform1f(U.uCut, 0.35);
  gl.depthMask(true); gl.disable(gl.BLEND); gl.enable(gl.CULL_FACE);
};

/* ---------------- 검격 잔상 ---------------- */
Render.drawTrail = function (trail, viewSpace) {
  if (!trail || trail.pts.length < 2) return;
  var dm = this.trailMesh; dm.reset();
  trail.emit(dm, 1.0);
  if (!dm.n) return;
  gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
  gl.uniformMatrix4fv(U.uModel, false, this.ident);
  if (viewSpace) gl.uniformMatrix4fv(U.uView, false, this.ident);
  gl.disable(gl.CULL_FACE); gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE); gl.uniform1f(U.uCut, 0.02);
  dm.flush();
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.uniform1f(U.uCut, 0.35);
  gl.depthMask(true); gl.disable(gl.BLEND); gl.enable(gl.CULL_FACE);
  if (viewSpace) gl.uniformMatrix4fv(U.uView, false, this.view);
};

/* ---------------- 1인칭 손 ---------------- */
Render.drawHand = function (alpha) {
  var p = Game.player, ms = this.msH;
  gl.clear(gl.DEPTH_BUFFER_BIT);
  var proj = M4.make();
  M4.persp(proj, 72 * DEG, this.W / this.H, 0.01, 12);
  gl.uniformMatrix4fv(U.uProj, false, proj);
  gl.uniformMatrix4fv(U.uView, false, this.ident);
  this.setFog(1e8, 1e9, FOG_COL);

  var swing = lerp(p.pSwingProgress, p.swingProgress, alpha);
  if (!p.swinging) swing = 0;
  var f = Math.sin(swing * Math.PI);
  var sq = Math.sin(Math.sqrt(swing) * Math.PI);
  var eq = p.eating ? Math.min(1, (p.eatTicks + alpha) / 6) : 0;

function makeIcon(map, fill, hi, half) {
  var W = map[0].length, H = map.length, S = 1;
  var cv = document.createElement('canvas'); cv.width = W + 2; cv.height = H + 2;
  var c = cv.getContext('2d');
  function at(x, y) { return (y >= 0 && y < H && x >= 0 && x < W) ? map[y][x] === 'X' : false; }

  c.fillStyle = 'rgba(0,0,0,0.85)';
  for (var y = -1; y <= H; y++) for (var x = -1; x <= W; x++) {
    if (at(x, y)) continue;
    if (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1) || at(x - 1, y - 1) || at(x + 1, y + 1) || at(x - 1, y + 1) || at(x + 1, y - 1))
      c.fillRect(x + 1, y + 1, S, S);
  }
  for (var y2 = 0; y2 < H; y2++) for (var x2 = 0; x2 < W; x2++) {
    if (!at(x2, y2)) continue;
    if (half && x2 >= Math.ceil(W / 2)) continue;
    var col = fill;
    if (hi && ((x2 === 2 && y2 === 1) || (x2 === 3 && y2 === 1) || (x2 === 2 && y2 === 2))) col = hi;

  var c = this.ctx, W = this.W, H = this.H, S = this.S, p = Game.player;
  var cx = Math.round(W / 2), cy = Math.round(H / 2);
  c.save();
  c.globalCompositeOperation = 'difference';
  c.fillStyle = '#fff';
  var len = 5 * S, th = Math.max(1, S - 1);
  c.fillRect(cx - len, cy - th / 2, len * 2, th);
  c.fillRect(cx - th / 2, cy - len, th, len * 2);
  c.restore();

  if (this.hitMark > 0) {
    var a = this.hitMark / 8;
    c.save(); c.strokeStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')'; c.lineWidth = Math.max(2, S);
    var r0 = 4 * S, r1 = 8 * S;
    for (var i = 0; i < 4; i++) {
      var sx = (i & 1) ? 1 : -1, sy = (i & 2) ? 1 : -1;
      c.beginPath(); c.moveTo(cx + sx * r0, cy + sy * r0); c.lineTo(cx + sx * r1, cy + sy * r1); c.stroke();
    }
    c.restore();
  }

  /* 아이템 사용(먹기) 진행 링 */
  if (p.eating) {
    var ep = clamp((p.eatTicks + alpha) / 32, 0, 1);
    c.save();
    c.strokeStyle = 'rgba(0,0,0,0.55)'; c.lineWidth = 3.2 * S;
    c.beginPath(); c.arc(cx, cy, 11 * S, 0, TAU); c.stroke();
    c.strokeStyle = '#ffd93d'; c.lineWidth = 2.4 * S;
    c.beginPath(); c.arc(cx, cy, 11 * S, -Math.PI / 2, -Math.PI / 2 + TAU * ep); c.stroke();
    c.restore();
    txt(c, '먹는 중 ' + Math.round(ep * 100) + '%', cx, cy + 20 * S, 5.4 * S, '#ffd93d', 'center');
  } else if (Game.state === 'play') {
    var hk = invAt(p.slot);
    if (hk === 'gapple' && p.gapples > 0)
      txt(c, '우클릭을 꾹 누르세요 (1.6초)', cx, cy + 20 * S, 5.2 * S, 'rgba(255,217,61,0.75)', 'center');
    else if (hk === 'pearl' && p.pearls > 0)
      txt(c, '우클릭 = 엔더 진주 투척', cx, cy + 20 * S, 5.2 * S, 'rgba(95,232,208,0.8)', 'center');
    else if (hk === 'anchor' && p.anchorCharges > 0) {
      txt(c, '우클릭 = 리스폰 위치 설정 (' + p.anchorCharges + '회)', cx, cy + 20 * S, 5.2 * S, 'rgba(95,232,208,0.9)', 'center');
      if (p.anchorPos) txt(c, '● 정박기 설치됨', cx, cy + 32 * S, 4.8 * S, 'rgba(95,232,208,0.7)', 'center');
    } else if (hk === 'wind' && p.winds > 0)
      txt(c, '우클릭 = 바람 충전기 (발밑에 쏘면 점프)', cx, cy + 20 * S, 5.2 * S, 'rgba(140,255,240,0.8)', 'center');
    else if (hk === 'firework' && p.fireworks > 0)
      txt(c, p.gliding ? '우클릭 = 부스트!' : '활공 중에 우클릭하면 가속합니다',
        cx, cy + 20 * S, 5.2 * S, 'rgba(255,190,120,0.8)', 'center');
    else if (hk === 'mace') {
      var sm = maceSmashBonus(p.fallDistance);
      if (sm > 0) txt(c, '⚡ 스매시 +' + sm.toFixed(0) + ' — 지금 내리쳐!', cx, cy + 20 * S, 6 * S, '#ffd93d', 'center');
      else txt(c, '높은 곳에서 뛰어내리며 좌클릭', cx, cy + 20 * S, 5.2 * S, 'rgba(255,190,120,0.75)', 'center');
    }
    /* 활공 상태 표시 */
    if (p.gliding) {
      var spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy + p.vz * p.vz) * 20;
      txt(c, '🪽 활공 중  ' + spd.toFixed(1) + ' m/s', cx, cy - 26 * S, 6 * S, '#bfe9ff', 'center');
    } else if (p.hasElytra && !p.onGround) {
      txt(c, '점프 키 = 겉날개 펼치기', cx, cy - 26 * S, 5.2 * S, 'rgba(191,233,255,0.7)', 'center');
    }
  }

  /* 공격 쿨다운 인디케이터 (1.9+) */
  if (COMBAT.mode === 19 && Game.settings.indicator) {
    var str = clamp((p.ticksSinceSwing + alpha) / p.cooldownPeriod(), 0, 1);
    if (str < 1) {
      var bw = 17 * S, bh = 3 * S, bx = cx - bw / 2, by = cy + 8 * S;
      c.fillStyle = 'rgba(0,0,0,0.65)'; c.fillRect(bx - S, by - S, bw + 2 * S, bh + 2 * S);
      c.fillStyle = '#4a4a4a'; c.fillRect(bx, by, bw, bh);
      c.fillStyle = str >= 1 ? '#ffffff' : '#c8c8c8';
      c.fillRect(bx, by, Math.round(bw * str), bh);
      if (str >= 1) { c.fillStyle = 'rgba(255,255,255,0.9)'; c.fillRect(bx, by - S, bw, S); }
    }
  }
};

HUD.drawNameplate = function (e, alpha) {
  if (!e || e.dead) return;
  var c = this.ctx, S = this.S;
  var x = lerp(e.px, e.x, alpha), y = lerp(e.py, e.y, alpha), z = lerp(e.pz, e.z, alpha);
  var pr = Render.project(x, y + 2.25, z);
  if (!pr || pr.d > 60) return;
  var sc = clamp(1.6 - pr.d * 0.03, 0.62, 1.15) * S;
  var name = e.name;
  var fs = Math.round(7 * sc);
  c.font = '700 ' + fs + 'px "Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
  var tw = c.measureText(name).width;
  var pad = 3 * sc, bw = tw + pad * 2, bh = fs + pad * 1.6;
  c.fillStyle = 'rgba(0,0,0,0.34)';
  c.fillRect(pr.x - bw / 2, pr.y - bh, bw, bh);
  txt(c, name, pr.x, pr.y - pad * 0.8, fs, '#ffffff', 'center');
  /* 체력바 */
  var hw = Math.max(bw, 44 * sc), hh = 2.4 * sc, hy = pr.y + 1.5 * sc;
  c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(pr.x - hw / 2 - 1, hy - 1, hw + 2, hh + 2);
  c.fillStyle = '#3a1414'; c.fillRect(pr.x - hw / 2, hy, hw, hh);
  var frac = clamp(e.health / e.maxHealth, 0, 1);
  c.fillStyle = frac > 0.5 ? '#3ddc60' : (frac > 0.25 ? '#ffd93d' : '#ff4d4d');
  c.fillRect(pr.x - hw / 2, hy, hw * frac, hh);
  if (e.absorption > 0) {
    c.fillStyle = '#ffd93d';
    c.fillRect(pr.x - hw / 2, hy - hh - 1, hw * clamp(e.absorption / 8, 0, 1), hh * 0.7);
  }
};

HUD.drawDamageTexts = function (alpha) {
  var c = this.ctx;
  for (var i = this.dmgTexts.length - 1; i >= 0; i--) {
    var d = this.dmgTexts[i];
    d.t += 1 / 60;
    if (d.t > d.life) { this.dmgTexts.splice(i, 1); continue; }
    if (!Game.settings.dmgNum) continue;
    var k = d.t / d.life;
    var pr = Render.project(d.x, d.y + k * 1.3, d.z);
    if (!pr) continue;
    var sc = clamp(1.5 - pr.d * 0.03, 0.6, 1.2) * this.S;
    var fs = Math.round((d.crit ? 11 : 9) * sc);
    c.globalAlpha = clamp((1 - k) * 2.2, 0, 1);
    txt(c, d.s, pr.x, pr.y, fs, d.col, 'center');
    c.globalAlpha = 1;
  }
};

HUD.drawStatus = function () {
  var c = this.ctx, W = this.W, H = this.H, S = this.S, p = Game.player;
  var barW = 182 * S, bx = Math.round((W - barW) / 2), by = H - 24 * S;

  /* ---- 핫바 (터치 모드에선 화면 하단 슬롯 버튼이 대신 그린다) ---- */
  if (!TouchIn.on) {
    c.fillStyle = 'rgba(0,0,0,0.62)';
    c.fillRect(bx - S, by - S, barW + 2 * S, 22 * S + 2 * S);
    c.fillStyle = 'rgba(255,255,255,0.10)'; c.fillRect(bx - S, by - S, barW + 2 * S, S);
    for (var i = 0; i < 9; i++) {
      var sx = bx + i * 20 * S + S;
      c.strokeStyle = 'rgba(255,255,255,0.10)'; c.lineWidth = 1;
      c.strokeRect(sx + 0.5, by + S + 0.5, 20 * S - 1, 20 * S - 1);
    }
    var items = Game.hotbar();
    for (var j = 0; j < items.length; j++) {
      var it = items[j]; if (!it) continue;
      var ix = bx + j * 20 * S + 3 * S, iy = by + 3 * S;
      var cvs = this.itemCv[it.icon];
      if (cvs) c.drawImage(cvs, ix, iy, 16 * S, 16 * S);
      if (it.count > 1) txt(c, '' + it.count, ix + 16 * S, iy + 16 * S - S, 6 * S, '#ffffff', 'right');
      if (it.cd !== undefined && it.cd < 1) {
        c.fillStyle = 'rgba(255,255,255,0.30)';
        c.fillRect(ix, iy + 16 * S * it.cd, 16 * S, 16 * S * (1 - it.cd));
      }
    }
    /* 선택 슬롯 */
    var selx = bx + p.slot * 20 * S - S;
    c.strokeStyle = '#ffffff'; c.lineWidth = 2 * S;
    c.strokeRect(selx + S, by, 22 * S - 2 * S, 22 * S);
    c.strokeStyle = 'rgba(0,0,0,0.6)'; c.lineWidth = S;
    c.strokeRect(selx + S - S * 1.5, by - S * 1.5, 22 * S, 22 * S + S);
  }

  /* ---- 체력 ---- */
  var hx = bx, hy = by - 12 * S;
  var shake = (p.health <= 4 && !p.dead) ? Math.sin(Game.now * 0.02) * S * 0.6 : 0;
  var hp = Math.max(0, p.health);
  for (var h = 0; h < 10; h++) {
    var ix2 = hx + h * 8 * S, iy2 = hy + ((p.health <= 4 && (h % 2 === 0)) ? shake : 0);
    this.icon('heartBg', ix2, iy2, S);
    var v = hp - h * 2;
    if (v >= 2) this.icon('heart', ix2, iy2, S);
    else if (v >= 1) this.icon('heartHalf', ix2, iy2, S);
  }
  /* 흡수 하트 */
  if (p.absorption > 0) {
    var ab = p.absorption;
    for (var k2 = 0; k2 < 10 && ab > 0; k2++) {
      var ax = hx + k2 * 8 * S, ay = hy - 9 * S;
      if (ab >= 2) this.icon('heartGold', ax, ay, S);
      else this.icon('heartGoldHalf', ax, ay, S);
      ab -= 2;
    }
  }
  /* ---- 방어구 ---- */
  if (p.kit.armor > 0) {
    var ar = p.kit.armor, ay2 = hy - (p.absorption > 0 ? 18 : 9) * S;
    for (var a2 = 0; a2 < 10; a2++) {
      var axx = hx + a2 * 8 * S;
      this.icon('armorBg', axx, ay2, S);
      var av = ar - a2 * 2;
      if (av >= 2) this.icon('armor', axx, ay2, S);
      else if (av >= 1) this.icon('armorHalf', axx, ay2, S);
    }
  }
  /* ---- 배고픔 ---- */
  var fx = bx + barW - 9 * S, fy = hy;
  for (var f = 0; f < 10; f++) {
    var fxx = fx - f * 8 * S;
    this.icon('foodBg', fxx, fy, S);
    var fv = p.food - f * 2;
    if (fv >= 2) this.icon('food', fxx, fy, S);
    else if (fv >= 1) this.icon('foodHalf', fxx, fy, S);
  }
  /* 아이템 이름 */
  if (Game.itemNameTime > 0) {
    var nm = (Game.hotbar()[p.slot] || {}).name || '';
    var a3 = clamp(Game.itemNameTime / 30, 0, 1);
    c.globalAlpha = a3;
    txt(c, nm, W / 2, by - (p.kit.armor > 0 ? 24 : 16) * S - (p.absorption > 0 ? 9 * S : 0), 6.4 * S, '#ffffff', 'center');
    c.globalAlpha = 1;
  }
};

/* 궁극 게이지 */
/* =====================================================================
   핵 클라이언트 오버레이 : 워터마크 / ArrayList / ESP / 트레이서 / 타겟HUD
   ===================================================================== */
var CLIENT_NAME = 'RAVEN';
/* 활성 모듈 이름 목록 (ArrayList 용) */
function activeModuleNames(set) {
  var out = [];
  for (var i = 0; i < HACK_MODULES.length; i++) {
    var m = HACK_MODULES[i];
    if (m.k === 'arrayList' || m.k === 'watermark') continue;
    if (!set[m.k]) continue;
    var lbl = m.n;
    if (m.s && m.s.length) {
      var v = set[m.s[0].k];
      lbl += ' §' + (m.s[0].st < 1 ? (+v).toFixed(1) : Math.round(v)) + (m.s[0].u || '');
    }
    out.push(lbl);
  }
  return out;
}
/* 무지개 그라디언트 색 (index 기준) */
function railColor(i, t) {
  var h = ((i * 26 + t * 0.06) % 360) / 360;
  var f = function (n) { var k = (n + h * 6) % 6; return Math.round(255 * clamp(Math.min(k, 4 - k, 1), 0, 1) * 0.75 + 64); };
  return 'rgb(' + f(5) + ',' + f(3) + ',' + f(1) + ')';
}

HUD.drawMurder = function () {

HUD.drawBedwars = function () {

  }

  /* ---------- AI 에게 끼워준 핵 (좌상단, 워터마크 아래) ---------- */

  }

  /* ---------- 월드 시각 모드 ---------- */
  var o = Game.bot;
  if (!M || !o || o.dead || Game.state !== 'play') return;
  var dist = Math.sqrt((o.x - Game.player.x) * (o.x - Game.player.x) +
                       (o.z - Game.player.z) * (o.z - Game.player.z));

  /* ESP 박스 : 히트박스 8 꼭짓점을 투영해 화면 AABB 를 구한다 */
  var box = null;
  if (M.esp || M.nametags || M.tracers) {
    var hw = o.width / 2, minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9, ok = false;
    for (var xi = 0; xi < 2; xi++) for (var yi = 0; yi < 2; yi++) for (var zi = 0; zi < 2; zi++) {
      var pr = Render.project(o.x + (xi ? hw : -hw), o.y + (yi ? o.height : 0), o.z + (zi ? hw : -hw));
      if (!pr) continue;
      ok = true;
      if (pr.x < minX) minX = pr.x; if (pr.x > maxX) maxX = pr.x;
      if (pr.y < minY) minY = pr.y; if (pr.y > maxY) maxY = pr.y;
    }
    if (ok) box = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }

  if (M.esp && box) {
    var ec = o.health > 12 ? '#4affa0' : (o.health > 6 ? '#ffd93d' : '#ff4a4a');
    c.save();
    c.lineWidth = Math.max(1, S * 0.5);
    /* 모서리만 그리는 코너 박스 (실제 클라이언트 스타일) */

    for (var pass = 0; pass < 2; pass++) {
      if (pass === 1) { c.strokeStyle = ec; c.lineWidth = Math.max(1, S * 0.45); }
      c.beginPath();
      c.moveTo(box.x, box.y + cl); c.lineTo(box.x, box.y); c.lineTo(box.x + cl, box.y);
      c.moveTo(box.x + box.w - cl, box.y); c.lineTo(box.x + box.w, box.y); c.lineTo(box.x + box.w, box.y + cl);
      c.moveTo(box.x, box.y + box.h - cl); c.lineTo(box.x, box.y + box.h); c.lineTo(box.x + cl, box.y + box.h);
      c.moveTo(box.x + box.w - cl, box.y + box.h); c.lineTo(box.x + box.w, box.y + box.h); c.lineTo(box.x + box.w, box.y + box.h - cl);
      c.stroke();
    }
    /* 좌측 체력 바 */
    var hpf = clamp((o.health + o.absorption) / (o.maxHealth || 20), 0, 1);
    c.fillStyle = 'rgba(0,0,0,0.7)'; c.fillRect(box.x - 4 * S, box.y, 2 * S, box.h);
    c.fillStyle = ec; c.fillRect(box.x - 4 * S, box.y + box.h * (1 - hpf), 2 * S, box.h * hpf);
    c.restore();
  }

  if (M.nametags && box) {
    var lbl = o.name + '  ' + (o.health + o.absorption).toFixed(1) + '❤  ' + dist.toFixed(1) + 'm';
    c.font = '800 ' + (6 * S) + 'px "Malgun Gothic",system-ui,sans-serif';
    var lw = c.measureText(lbl).width;
    c.fillStyle = 'rgba(8,6,16,0.78)';
    c.fillRect(box.x + box.w / 2 - lw / 2 - 3 * S, box.y - 12 * S, lw + 6 * S, 10 * S);
    txt(c, lbl, box.x + box.w / 2, box.y - 4.5 * S, 6 * S, '#ffffff', 'center');
  }

  if (M.tracers && box) {
    c.save();
    c.strokeStyle = 'rgba(255,45,85,0.85)'; c.lineWidth = Math.max(1, S * 0.4);
    c.beginPath(); c.moveTo(W / 2, H); c.lineTo(box.x + box.w / 2, box.y + box.h / 2); c.stroke();
    c.restore();
  }

  if (M.targetHud) {
    var tw2 = 76 * S, th2 = 26 * S, tx = W / 2 + 30 * S, ty = H / 2 - 6 * S;
    c.fillStyle = 'rgba(8,6,16,0.86)'; c.fillRect(tx, ty, tw2, th2);
    c.fillStyle = '#ff2d55'; c.fillRect(tx, ty, tw2, 1.4 * S);
    txt(c, o.name, tx + 4 * S, ty + 9 * S, 6.4 * S, '#ffffff', 'left');
    txt(c, dist.toFixed(1) + 'm', tx + tw2 - 4 * S, ty + 9 * S, 5.6 * S, '#8a8aaa', 'right');
    var hf = clamp((o.health + o.absorption) / (o.maxHealth || 20), 0, 1);
    c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect(tx + 4 * S, ty + 13 * S, tw2 - 8 * S, 3.4 * S);
    c.fillStyle = hf > 0.6 ? '#4affa0' : (hf > 0.3 ? '#ffd93d' : '#ff4a4a');
    c.fillRect(tx + 4 * S, ty + 13 * S, (tw2 - 8 * S) * hf, 3.4 * S);
    txt(c, (o.health + o.absorption).toFixed(1) + ' ❤   사과 ' + o.gapples + '   진주 ' + o.pearls,
      tx + 4 * S, ty + 23 * S, 5.4 * S, '#a0a0c0', 'left');
  }
};

HUD.drawCombo = function () {

    this.comboN = p.stats.combo;

  if (this.comboT <= 0 || this.comboN < 2) { this.comboT = Math.max(0, this.comboT - 0.02); return; }
  this.comboT = Math.max(0, this.comboT - 0.012);
  var c = this.ctx, S = this.S, W = this.W, H = this.H;
  var pop = 1 + Math.max(0, this.comboT - 0.86) * 3.2;

  var x = W - 22 * S, y = H * 0.42;
  txt(c, this.comboN + '', x, y, Math.round(26 * S * pop), '#ffd93d', 'right');

/* 콜아웃 */
HUD.drawCallouts = function () {
  var c = this.ctx, W = this.W, H = this.H, S = this.S;
  for (var i = this.callouts.length - 1; i >= 0; i--) {
    var o = this.callouts[i];
    o.t += 1 / 60;
    if (o.t > o.life) { this.callouts.splice(i, 1); continue; }
    var k = o.t / o.life;
    var pop = k < 0.14 ? (k / 0.14) : 1;
    var sc = 0.6 + pop * 0.4 + (1 - pop) * 0;
    var a = k > 0.72 ? (1 - (k - 0.72) / 0.28) : 1;
    var y = H * 0.26 - i * 9 * S + (1 - pop) * 6 * S;
    c.save(); c.globalAlpha = clamp(a, 0, 1);
    c.shadowColor = o.col; c.shadowBlur = 26;
    txt(c, o.s, W / 2, y, Math.round(o.big * S * sc), o.col, 'center');
    c.shadowBlur = 0;
    if (o.sub) txt(c, o.sub, W / 2, y + 7 * S, 5.4 * S, '#c8c8c8', 'center');
    c.restore();
  }
};

HUD.drawRageEdge = function () {

/* VS 인트로 / K.O. 시네마틱 */
HUD.drawCinematic = function () {
  var c = this.ctx, W = this.W, H = this.H, S = this.S;
  var cin = Game.cinema;
  if (!cin || cin.mode === 0) return;
  var k = clamp(cin.t / cin.dur, 0, 1);
  /* 레터박스 */
  var open = Math.min(1, (cin.mode === 1 ? k * 5 : k * 6));
  var close = cin.mode === 1 ? clamp((k - 0.82) / 0.18, 0, 1) : clamp((k - 0.88) / 0.12, 0, 1);
  var bar = H * 0.115 * (open - close);
  if (bar > 0) { c.fillStyle = '#000'; c.fillRect(0, 0, W, bar); c.fillRect(0, H - bar, W, bar); }

  if (cin.mode === 1) {
    /* --- VS 인트로 --- */
    var slide = Math.min(1, k * 3.2);
    var ease = 1 - Math.pow(1 - slide, 3);
    var fade = clamp((0.9 - k) / 0.18, 0, 1);
    c.save(); c.globalAlpha = fade;
    var cy = H * 0.44;
    var offL = (1 - ease) * W * 0.5, offR = (1 - ease) * W * 0.5;
    /* 왼쪽 카드 */
    c.fillStyle = 'rgba(20,40,70,0.72)';
    c.fillRect(-offL, cy - 13 * S, W * 0.46, 26 * S);
    c.fillStyle = '#6fd0ff'; c.fillRect(W * 0.46 - offL - 2 * S, cy - 13 * S, 2 * S, 26 * S);
    txt(c, Game.player.name, W * 0.40 - offL, cy + 1 * S, 15 * S, '#ffffff', 'right');
    txt(c, Game.kit.name + ' 킷', W * 0.40 - offL, cy + 9 * S, 5.6 * S, '#9fd8ff', 'right');
    /* 오른쪽 카드 */
    c.fillStyle = 'rgba(70,20,20,0.72)';
    c.fillRect(W * 0.54 + offR, cy - 13 * S, W * 0.46, 26 * S);
    c.fillStyle = '#ff7a7a'; c.fillRect(W * 0.54 + offR, cy - 13 * S, 2 * S, 26 * S);
    txt(c, Game.bot.name, W * 0.60 + offR, cy + 1 * S, 15 * S, '#ffffff', 'left');
    txt(c, Game.diff.name + ' · ' + Game.diff.tag, W * 0.60 + offR, cy + 9 * S, 5.6 * S, '#ffb3b3', 'left');
    /* VS */
    var vp = 1 + Math.max(0, 0.35 - k) * 2.2;
    c.shadowColor = '#ff6a2b'; c.shadowBlur = 34;
    txt(c, 'VS', W / 2, cy + 5 * S, Math.round(24 * S * vp), '#ffd93d', 'center');
    c.shadowBlur = 0;
    txt(c, 'ROUND ' + Game.round, W / 2, cy - 20 * S, 7 * S, '#ffffff', 'center');
    c.restore();
  } else if (cin.mode === 2) {
    /* --- K.O. --- */
    var kp = clamp(k / 0.16, 0, 1);
    var sc2 = 1 + (1 - kp) * 2.6;
    var a2 = clamp((1 - k) * 2.4, 0, 1);
    c.save(); c.globalAlpha = a2;
    c.shadowColor = '#ff2b1a'; c.shadowBlur = 50;
    txt(c, cin.text || 'K.O.', W / 2, H * 0.46, Math.round(40 * S * sc2), '#ff4a2b', 'center');
    c.shadowBlur = 0;
    if (cin.sub) txt(c, cin.sub, W / 2, H * 0.46 + 12 * S, 7 * S, '#ffd08a', 'center');
    c.restore();
  }
};
/* =====================================================================
   온라인 1 vs 1
   - 모드 A : P2P 직접 연결 (WebRTC DataChannel, 서버 불필요, 코드 교환)
   - 모드 B : 서버 접속 (WebSocket 중계, 방 코드 4자리)
   동기화 : 각자 자기 캐릭터를 완전 시뮬레이션하고 상태를 20Hz 로 전송.
            피격 판정은 "맞은 쪽"이 바닐라 무적시간 규칙으로 최종 결정한다.
   ===================================================================== */
var Net = {
  active: false, mode: '', isHost: false, connected: false, ready: false,
  peer: null, conn: null, ws: null, room: '',
  myCode: '', status: '', err: '',
  ping: 0, lastPingSent: 0, lastRecv: 0, sendAcc: 0,
  remoteName: '상대', remoteReady: false,
  onStatus: null
};

Net.setStatus = function (s) { this.status = s; if (this.onStatus) this.onStatus(s); };

/* ---------------- 공통 ---------------- */
Net.reset = function () {
  try { if (this.conn) this.conn.close(); } catch (e) { }
  try { if (this.peer) this.peer.destroy(); } catch (e) { }
  try { if (this.ws) this.ws.close(); } catch (e) { }
  this.peer = null; this.conn = null; this.ws = null;
  this.active = false; this.connected = false; this.ready = false;
  this.remoteReady = false; this.myCode = ''; this.err = '';
};
Net.send = function (o) {
  try {
    if (this.mode === 'p2p') { if (this.conn && this.conn.open) this.conn.send(o); }
    else if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o));
  } catch (e) { }
};
Net.onOpen = function () {
  this.connected = true;
  this.setStatus('연결됨');
  this.send({ t: 'i', name: Game.myName || '상대', host: this.isHost });
  this.lastRecv = performance.now();
  Game.onNetConnected();
};
Net.onClose = function (why) {
  if (!this.active) return;
  this.connected = false;
  this.setStatus('연결 끊김' + (why ? ' (' + why + ')' : ''));
  Game.onNetLost();
};

/* ---------------- 모드 A : PeerJS P2P (코드 한 번만 교환) ---------------- */
Net.peerCreate = function () {
  var self = this;
  this.reset(); this.active = true; this.mode = 'p2p'; this.isHost = true;
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for (var i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  this.myCode = code;
  this.setStatus('코드 생성 중...');
  var peer = new Peer('mcpvp-' + code, { host: '0.peerjs.com', port: 443, secure: true, path: '/' });
  this.peer = peer;
  peer.on('open', function () { self.setStatus('대기 중'); });
  peer.on('connection', function (conn) {
    if (self.connected) { conn.close(); return; }
    self.conn = conn; self._wirePeer(conn);
  });
  peer.on('error', function (e) { self.err = e.type; self.setStatus('오류: ' + e.type); });
  return code;
};
Net.peerJoin = function (code) {
  var self = this;
  code = (code || '').toUpperCase().replace(/\s+/g, '');
  if (!code) { this.setStatus('코드를 입력하세요'); return; }
  this.reset(); this.active = true; this.mode = 'p2p'; this.isHost = false;
  this.setStatus('연결 중...');
  var peer = new Peer({ host: '0.peerjs.com', port: 443, secure: true, path: '/' });
  this.peer = peer;
  peer.on('open', function () {
    var conn = peer.connect('mcpvp-' + code, { reliable: false, serialization: 'json' });
    self.conn = conn; self._wirePeer(conn);
  });
  peer.on('error', function (e) { self.err = e.type; self.setStatus('오류: ' + e.type); });
};
Net._wirePeer = function (conn) {
  var self = this;
  conn.on('open', function () { self.onOpen(); });
  conn.on('close', function () { self.onClose(); });
  conn.on('error', function (e) { self.err = String(e); });
  conn.on('data', function (data) { self.handle(data); });
};

/* ---------------- 모드 B : WebSocket 서버 ---------------- */
Net.wsConnect = function (url, room, asHost) {
  var self = this;
  this.reset(); this.active = true; this.mode = 'ws'; this.isHost = !!asHost; this.room = room;
  this.setStatus('서버 접속 중...');
  return new Promise(function (res, rej) {
    var ws;
    try { ws = new WebSocket(url); } catch (e) { rej(e); return; }
    self.ws = ws;
    var settled = false;
    ws.onopen = function () {
      ws.send(JSON.stringify({ t: 'join', room: room, name: Game.myName || '플레이어' }));
      self.setStatus('방 ' + room + ' — 상대 기다리는 중...');
      if (!settled) { settled = true; res(); }
    };
    ws.onmessage = function (e) {
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.t === 'joined') { self.isHost = !!m.host; self.setStatus('방 ' + room + ' — ' + (m.host ? '방장' : '참가자')); return; }
      if (m.t === 'peer') { self.onOpen(); return; }
      if (m.t === 'left') { self.onClose('상대 퇴장'); return; }
      if (m.t === 'full') { self.err = '방이 가득 찼습니다'; self.setStatus('방이 가득 찼습니다'); return; }
      self.handle(e.data);
    };
    ws.onclose = function () { self.onClose('서버 연결 종료'); if (!settled) { settled = true; rej(new Error('서버에 접속할 수 없습니다')); } };
    ws.onerror = function () { if (!settled) { settled = true; rej(new Error('서버에 접속할 수 없습니다')); } };
  });
};

/* ---------------- 수신 처리 ---------------- */
Net.handle = function (raw) {
  var m; try { m = (typeof raw === 'object' && raw !== null) ? raw : JSON.parse(raw); } catch (e) { return; }
  this.lastRecv = performance.now();
  var r = Game.bot;                        // 원격 플레이어는 bot 슬롯을 재사용
  switch (m.t) {
    case 'i':
      this.remoteName = (m.name || '상대').slice(0, 12);
      if (r) r.name = this.remoteName;
      break;
    case 'ready': this.remoteReady = true; break;
    case 's':                              // 상태 스냅샷
      if (r) {
        r.netQueue.push(m);
        if (r.netQueue.length > 4) r.netQueue.shift();
      }
      break;
    case 'h': Game.netTakeHit(m); break;   // 상대가 나를 때렸다
    case 'd': Game.netRemoteDied(m); break;
    case 'b': Game.netRemoteBeam(m); break;
    case 'p': Game.netRemotePearl(m); break;
    case 'w': Game.netRemoteWind(m); break;
    case 'blk': Game.netRemoteBlock(m); break;
    case 'msg': Game.log('<' + (Net.remoteName || '상대') + '> ' + String(m.m || '').slice(0, 160), '#bfe9ff'); break;
    case 'g': Game.netRemoteRage(m); break;
    case 'r': Game.netRound(m); break;     // 방장의 라운드 제어
    case 'confuse': if (r) r.yaw = wrapDeg(r.yaw + rnd(-50, 50)); break;
    case 'drain': if (r && !r.dead) { r.health = Math.max(0.5, r.health - 1); if (r.health <= 0.5) r.die(Game.player, 'hack'); } break;
    case 'ping': this.send({ t: 'pong', v: m.v }); break;
    case 'pong': this.ping = Math.round(performance.now() - m.v); break;
  }
};

/* ---------------- 송신 ---------------- */
Net.tick = function () {
  if (!this.connected) return;
  var p = Game.player;
  this.send({
    t: 's', x: +p.x.toFixed(3), y: +p.y.toFixed(3), z: +p.z.toFixed(3),
    vx: +p.vx.toFixed(3), vy: +p.vy.toFixed(3), vz: +p.vz.toFixed(3),
    ya: Math.round(p.yaw * 10) / 10, pi: Math.round(p.pitch * 10) / 10,
    by: Math.round(p.bodyYaw * 10) / 10,
    hp: +p.health.toFixed(2), ab: +p.absorption.toFixed(2), ul: Math.round(p.ult),
    sl: p.slot, ga: p.gapples, pe: p.pearls, ls: +p.limbSwing.toFixed(2), la: +p.limbSwingAmount.toFixed(2),
    sw: p.swinging ? p.swingTicks : -1,
    f: (p.sneaking ? 1 : 0) | (p.sprinting ? 2 : 0) | (p.blocking ? 4 : 0) |
       (p.eating ? 8 : 0) | (p.dead ? 16 : 0) | (p.rageTicks > 0 ? 32 : 0) | (p.hurtTime > 0 ? 64 : 0),
    og: p.onGround ? 1 : 0
  });
  /* 핑 측정 */
  var now = performance.now();
  if (now - this.lastPingSent > 1000) { this.lastPingSent = now; this.send({ t: 'ping', v: now }); }
  /* 타임아웃 */
  if (now - this.lastRecv > 8000) this.onClose('응답 없음');
};

/* ---------------- 원격 엔티티 보간 ---------------- */
Entity.prototype.netTick = function () {
  this.px = this.x; this.py = this.y; this.pz = this.z;
  this.pYaw = this.yaw; this.pPitch = this.pitch; this.pBodyYaw = this.bodyYaw;
  this.pSwingProgress = this.swingProgress;
  this.pLimbSwingAmount = this.limbSwingAmount;
  if (this.hurtTime > 0) this.hurtTime--;
  if (this.rageTicks > 0) this.rageTicks--;

  var q = this.netQueue;
  if (q.length) {
    if (q.length > 3) q.shift();            // 밀렸으면 따라잡기
    var m = q.shift();
    this.x = m.x; this.y = m.y; this.z = m.z;
    this.vx = m.vx; this.vy = m.vy; this.vz = m.vz;
    this.yaw = m.ya; this.pitch = m.pi; this.bodyYaw = m.by;
    this.health = m.hp; this.absorption = m.ab; this.ult = m.ul;
    this.slot = m.sl; this.gapples = m.ga; this.pearls = m.pe;
    this.limbSwing = m.ls; this.limbSwingAmount = m.la;
    this.onGround = !!m.og;
    this.sneaking = !!(m.f & 1); this.sprinting = !!(m.f & 2);
    this.blocking = !!(m.f & 4); this.eating = !!(m.f & 8);
    this.dead = !!(m.f & 16);
    if ((m.f & 32) && this.rageTicks <= 0) this.rageTicks = 20;
    if ((m.f & 64) && this.hurtTime <= 0) this.hurtTime = 8;
    if (m.sw >= 0) { this.swinging = true; this.swingTicks = m.sw; }
    else { this.swinging = false; this.swingTicks = -1; }
    if (this.dead) this.deathTicks++;
  } else {
    /* 패킷 공백 : 마지막 속도로 짧게 외삽 */
    this.x += this.vx * 0.5; this.y += this.vy * 0.5; this.z += this.vz * 0.5;
  }
  this.swingProgress = this.swinging ? (this.swingTicks + 1) / 6 : 0;
};

Game.log = function (s, c) {

Game.center = function (msg, sub, big, col, ticks) {

Game.hotbar = function () {
