  .modrow{display:grid;grid-template-columns:18px 1fr;gap:3px 10px;align-items:center;text-align:left;

  .modrow.on{background:linear-gradient(90deg,#ff5c1a22,transparent);border-left-color:#ff8f1a}
  .modrow input{width:15px;height:15px;accent-color:#ff8f1a;cursor:pointer;grid-row:span 2}

  .modrow .md{font-size:11px;color:#7a7f92;grid-column:2;line-height:1.5}

    font-family:inherit;font-size:11px;color:#ffd93d;margin-left:6px;font-weight:700}
  .modset{padding:6px 12px 8px 40px;margin:-4px 0 5px;background:#ffffff05;border-left:2px solid #ff8f1a44}

<script>
'use strict';
/* =====================================================================
   Minecraft PvP Duel  —  1 vs 1
   바닐라 마인크레프트 전투 판정을 그대로 옮긴 단일 HTML 게임
   - 20 TPS 고정 틱 + 프레임 보간
   - 1.8 / 1.9+ 전투 시스템 (공격 쿨다운, 데미지 스케일링, 쓸기 공격)
   - 무적시간(iframe) 판정, 콤보 판정, 넉백/스프린트 넉백, 크리티컬
   - 방어구 감소 공식, 인챈트, 황금사과(재생/흡수), 배고픔/자연회복
   ===================================================================== */

var DEG = Math.PI / 180, TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function sign(v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); }
function wrapDeg(a) { a %= 360; if (a >= 180) a -= 360; if (a < -180) a += 360; return a; }
function approachDeg(cur, tgt, max) { var d = wrapDeg(tgt - cur); return cur + clamp(d, -max, max); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function rndInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function gauss() { var u = 1 - Math.random(), v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ---------- 시드 난수 (텍스처/월드 결정론) ---------- */
function Rng(seed) { this.s = seed >>> 0 || 1; }
Rng.prototype.next = function () {
  var x = this.s; x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; this.s = x;
  return x / 4294967296;
};
Rng.prototype.range = function (a, b) { return a + this.next() * (b - a); };
Rng.prototype.int = function (a, b) { return Math.floor(a + this.next() * (b - a + 1)); };

/* ---------- mat4 (열 우선 / column-major) ---------- */
var M4 = {
  make: function () { var m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  ident: function (o) { o.fill(0); o[0] = o[5] = o[10] = o[15] = 1; return o; },
  copy: function (o, a) { o.set(a); return o; },
  mul: function (o, a, b) { // o = a * b
    var a0 = a[0], a1 = a[1], a2 = a[2], a3 = a[3], a4 = a[4], a5 = a[5], a6 = a[6], a7 = a[7],
      a8 = a[8], a9 = a[9], a10 = a[10], a11 = a[11], a12 = a[12], a13 = a[13], a14 = a[14], a15 = a[15];
    for (var i = 0; i < 4; i++) {
      var b0 = b[i * 4], b1 = b[i * 4 + 1], b2 = b[i * 4 + 2], b3 = b[i * 4 + 3];
      o[i * 4] = a0 * b0 + a4 * b1 + a8 * b2 + a12 * b3;
      o[i * 4 + 1] = a1 * b0 + a5 * b1 + a9 * b2 + a13 * b3;
      o[i * 4 + 2] = a2 * b0 + a6 * b1 + a10 * b2 + a14 * b3;
      o[i * 4 + 3] = a3 * b0 + a7 * b1 + a11 * b2 + a15 * b3;
    }
    return o;
  },
  persp: function (o, fovy, asp, n, f) {
    var t = 1 / Math.tan(fovy / 2); o.fill(0);
    o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f); return o;
  },
  transV: function (o, x, y, z) { M4.ident(o); o[12] = x; o[13] = y; o[14] = z; return o; },
  scaleV: function (o, x, y, z) { M4.ident(o); o[0] = x; o[5] = y; o[10] = z; return o; },
  rotX: function (o, a) { var c = Math.cos(a), s = Math.sin(a); M4.ident(o); o[5] = c; o[6] = s; o[9] = -s; o[10] = c; return o; },
  rotY: function (o, a) { var c = Math.cos(a), s = Math.sin(a); M4.ident(o); o[0] = c; o[2] = -s; o[8] = s; o[10] = c; return o; },
  rotZ: function (o, a) { var c = Math.cos(a), s = Math.sin(a); M4.ident(o); o[0] = c; o[1] = s; o[4] = -s; o[5] = c; return o; }
};

/* 행렬 스택 : cur = cur * op (OpenGL 방식) */
function MatStack() {
  this.st = []; this.cur = M4.make(); this.tmp = M4.make(); this.op = M4.make();
  for (var i = 0; i < 24; i++) this.st.push(M4.make());
  this.depth = 0;
}
MatStack.prototype.load = function (m) { this.cur.set(m); return this; };
MatStack.prototype.identity = function () { M4.ident(this.cur); return this; };
MatStack.prototype.push = function () { this.st[this.depth++].set(this.cur); return this; };
MatStack.prototype.pop = function () { this.cur.set(this.st[--this.depth]); return this; };
MatStack.prototype.apply = function () { M4.mul(this.tmp, this.cur, this.op); this.cur.set(this.tmp); return this; };
MatStack.prototype.translate = function (x, y, z) { M4.transV(this.op, x, y, z); return this.apply(); };
MatStack.prototype.scale = function (x, y, z) { M4.scaleV(this.op, x, y, z === undefined ? x : z); return this.apply(); };

function idx(x, y, z) { return (y * WZ + z) * WX + x; }
function getBlock(x, y, z) {
  if (x < 0 || y < 0 || z < 0 || x >= WX || y >= WY || z >= WZ) return 0;

}

  world[idx(x, y, z)] = v;

/* 팔각형 거리 */
function octDist(dx, dz) {
  var ax = Math.abs(dx), az = Math.abs(dz);
  return Math.max(ax, az, (ax + az) * 0.7071);
}

function generateArena(seed, map) {
  curMap = map || curMap;
  var M = curMap.mat, rg = new Rng(seed || 20250816);
  VOID_Y = curMap.deathY; LAVA_Y = curMap.sea.y;
  world.fill(0); SPAWNS.length = 0;
  var R = 16.6;
  var layerR = [R, R, R - 0.3, R - 1.2, R - 2.6, R - 4.4, R - 6.6, R - 9.2, R - 12.0, R - 14.4, R - 16.0];

  for (var z = 0; z < WZ; z++) for (var x = 0; x < WX; x++) {
    var dx = x - CX + 0.5, dz = z - CZ + 0.5;
    var d = octDist(dx, dz), rr = Math.sqrt(dx * dx + dz * dz);
    for (var li = 0; li < layerR.length; li++) {
      var y = SURF - li, lr = layerR[li] + (rg.next() - 0.5) * 0.8;
      if (d > lr) continue;
      var blk;
      if (li === 0) {
        if (rr < 1.6) blk = M.center;
        else if (rr < 3.4) blk = M.ring1;
        else if (rr < 4.4) blk = M.ring2;
        else if (rr > 8.4 && rr < 9.6) blk = M.rune;
        else if (d > 14.6) blk = (rg.next() > .93) ? M.floorC : M.rim;
        else { var t = rg.next(); blk = t > .95 ? M.floorC : (t > .58 ? M.floorA : M.floorB); }
      } else if (li <= 2) blk = rg.next() > .78 ? M.deep : M.sub;
      else { var s2 = rg.next(); blk = s2 > .94 ? M.deepAlt : (s2 > .72 ? M.deep : M.sub); }
      setBlock(x, y, z, blk);
    }
  }
  /* 아래로 늘어진 종유석 */
  for (var i = 0; i < 30; i++) {
    var a = rg.next() * TAU, rad = rg.range(1, 12);
    var px = Math.round(CX + Math.cos(a) * rad), pz = Math.round(CZ + Math.sin(a) * rad);
    var h = rg.int(3, 9), y0 = SURF - 10;
    for (var k = 0; k < h; k++) {
      var yy = y0 - k; if (yy < 2) break;
      var w = (k < h - 3) ? 1 : 0;
      for (var ax2 = -w; ax2 <= w; ax2++) for (var az2 = -w; az2 <= w; az2++)
        if (getBlock(px + ax2, yy, pz + az2) === 0 && octDist(px + ax2 - CX, pz + az2 - CZ) < 14)
          setBlock(px + ax2, yy, pz + az2, rg.next() > .88 ? M.deepAlt : M.deep);
    }
  }
  /* 거대 기둥 4개 */
  var pil = [[-10, -10], [10, -10], [-10, 10], [10, 10]];
  for (var p = 0; p < pil.length; p++) {
    var bx = CX + pil[p][0], bz = CZ + pil[p][1];
    for (var yy2 = 1; yy2 <= 7; yy2++) {
      for (var a2 = -1; a2 <= 1; a2++) for (var b2 = -1; b2 <= 1; b2++) {
        if (yy2 > 5 && (Math.abs(a2) + Math.abs(b2)) === 2) continue;
        setBlock(bx + a2, SURF + yy2, bz + b2, (yy2 === 7) ? M.glow : (rg.next() > .78 ? M.pillarAlt : M.pillar));
      }
    }
    setBlock(bx, SURF + 8, bz, M.glow);
  }
  /* 난간 + 화로 */
  for (var ang = 0; ang < 360; ang += 2) {
    var ra = ang * DEG;
    for (var rr2 = 15.4; rr2 <= 16.8; rr2 += 0.4) {
      var wx3 = Math.round(CX + Math.cos(ra) * rr2), wz3 = Math.round(CZ + Math.sin(ra) * rr2);
      if (!isSolidAt(wx3, SURF, wz3)) continue;
      var am = ((ang % 90) + 90) % 90;
      if (Math.abs(am - 45) < 9) continue;
      if (getBlock(wx3, SURF + 1, wz3) === 0)
        setBlock(wx3, SURF + 1, wz3, (ang % 30 < 2) ? M.floorC : M.rim);
    }
  }
  for (var b3 = 0; b3 < 8; b3++) {
    var ba = b3 * 45 * DEG + 22.5 * DEG;
    var fx = Math.round(CX + Math.cos(ba) * 14.2), fz = Math.round(CZ + Math.sin(ba) * 14.2);
    if (!isSolidAt(fx, SURF, fz)) continue;
    setBlock(fx, SURF + 1, fz, M.rim);
    setBlock(fx, SURF + 2, fz, M.floorC);
    setBlock(fx, SURF + 3, fz, M.glow);
  }
  /* 스폰 단상 */
  var sp = [[0, -11], [0, 11]];
  for (var s3 = 0; s3 < 2; s3++) {
    var sx = CX + sp[s3][0], sz = CZ + sp[s3][1], back = s3 === 0 ? -1 : 1;
    for (var ox = -3; ox <= 3; ox++) for (var oz = -3; oz <= 3; oz++) {
      if (Math.abs(ox) === 3 && Math.abs(oz) === 3) continue;
      setBlock(sx + ox, SURF, sz + oz, (Math.abs(ox) === 3 || Math.abs(oz) === 3) ? M.padEdge : M.pad);
    }
    setBlock(sx, SURF, sz, M.ring1);
    for (var c2 = -1; c2 <= 1; c2 += 2) {
      var cx2 = sx + c2 * 3, cz2 = sz + back * 3;
      setBlock(cx2, SURF + 1, cz2, M.post);
      setBlock(cx2, SURF + 2, cz2, M.pillarAlt);
      setBlock(cx2, SURF + 3, cz2, M.glow);
    }
    SPAWNS.push({ x: sx + 0.5, y: SURF + 1, z: sz + 0.5, yaw: s3 === 0 ? 0 : 180 });
  }
  /* 맵별 장식 */
  var deco = curMap.deco;
  if (deco === 'arch') {
    for (var side = -1; side <= 1; side += 2) {
      var axx = CX + side * 13;
      for (var az3 = -4; az3 <= 4; az3++) {
        var hgt = 6 - Math.round(Math.abs(az3) * 0.55);
        if (Math.abs(az3) === 4) for (var yv = 1; yv <= hgt; yv++)
          setBlock(axx, SURF + yv, CZ + az3, yv === hgt ? M.floorC : M.rim);
        if (Math.abs(az3) < 4) setBlock(axx, SURF + hgt, CZ + az3, (Math.abs(az3) < 2) ? M.floorC : M.rim);
      }
    }
  } else if (deco === 'tree') {
    var trees = [[-13, 12], [13, -12], [12, 12], [-12, -12]];
    for (var t2 = 0; t2 < trees.length; t2++) {
      var tx = CX + trees[t2][0], tz = CZ + trees[t2][1], th = 4 + rg.int(0, 1);
      for (var y3 = 1; y3 <= th; y3++) setBlock(tx, SURF + y3, tz, B.LOG);
      for (var ly = -1; ly <= 2; ly++) {
        var rad2 = ly <= 1 ? 2 : 1;
        for (var lx = -rad2; lx <= rad2; lx++) for (var lz = -rad2; lz <= rad2; lz++) {
          if (lx * lx + lz * lz > rad2 * rad2 + 1) continue;
          if (lx === 0 && lz === 0 && ly < 2) continue;
          if (Math.abs(lx) === rad2 && Math.abs(lz) === rad2 && rg.next() > .4) continue;
          if (getBlock(tx + lx, SURF + th + ly, tz + lz) === 0) setBlock(tx + lx, SURF + th + ly, tz + lz, B.LEAVES);
        }
      }
    }
  } else if (deco === 'spike') {
    for (var sk = 0; sk < 10; sk++) {
      var sa = sk * 36 * DEG + 0.3, srad = rg.range(11, 14.5);
      var kx = Math.round(CX + Math.cos(sa) * srad), kz = Math.round(CZ + Math.sin(sa) * srad);
      if (!isSolidAt(kx, SURF, kz)) continue;
      var kh = rg.int(4, 9);
      for (var ky = 1; ky <= kh; ky++) {
        var w2 = ky < kh * 0.4 ? 1 : 0;
        for (var mx = -w2; mx <= w2; mx++) for (var mz = -w2; mz <= w2; mz++)
          setBlock(kx + mx, SURF + ky, kz + mz, ky > kh - 2 ? B.BICE : (rg.next() > .5 ? B.ICE : B.PICE));
      }
    }
  } else if (deco === 'column') {
    for (var cc = 0; cc < 8; cc++) {
      var ca = cc * 45 * DEG, crad = 12.6;
      var qx = Math.round(CX + Math.cos(ca) * crad), qz = Math.round(CZ + Math.sin(ca) * crad);
      if (!isSolidAt(qx, SURF, qz)) continue;
      var qh = rg.int(5, 8);
      for (var qy = 1; qy <= qh; qy++) setBlock(qx, SURF + qy, qz, qy === qh ? M.floorC : M.pillar);
      if (rg.next() > .4) setBlock(qx, SURF + qh + 1, qz, M.glow);
    }
  }

  for (var hz = 0; hz < WZ; hz++) for (var hx2 = 0; hx2 < WX; hx2++) {
    var top = -1;
    for (var hy = WY - 1; hy >= 0; hy--) if (isOpaqueAt(hx2, hy, hz)) { top = hy; break; }
    heightMap[hz * WX + hx2] = top;
  }
}

/* ---------- AO 메셔 ---------- */
var CHUNK = 16;
function buildWorldMesh() {
  /* 16x16 청크로 나눠 프러스텀 컬링이 가능하게 한다 */
  var nx = Math.ceil(WX / CHUNK), nz = Math.ceil(WZ / CHUNK), out = [];
  for (var ci = 0; ci < nx; ci++) for (var cj = 0; cj < nz; cj++) {
    var m = buildChunkMesh(ci * CHUNK, cj * CHUNK, CHUNK);
    if (m) out.push(m);
  }
  return out;
}
function buildChunkMesh(ox, oz, size) {
  var mb = new MB();
  var minY = WY, maxY = 0, found = false;
  var aoSolid = function (x, y, z) { var b = getBlock(x, y, z); return b !== 0 && !BLOCKS[b].cut; };
  for (var y = 0; y < WY; y++) for (var z = oz; z < Math.min(WZ, oz + size); z++) for (var x = ox; x < Math.min(WX, ox + size); x++) {
    var id = world[idx(x, y, z)]; if (!id) continue;
    if (y < minY) minY = y; if (y > maxY) maxY = y; found = true;
    var def = BLOCKS[id];
    for (var f = 0; f < 6; f++) {
      var F = FACES[f], nx = x + F.n[0], ny = y + F.n[1], nz = z + F.n[2];
      var nid = getBlock(nx, ny, nz);
      if (nid !== 0) {
        var ndef = BLOCKS[nid];
        if (!ndef.cut) continue;                       // 불투명 이웃 → 컬링
        if (nid === id && id !== B.LEAVES) continue;   // 같은 투명 블록끼리 컬링(유리)
      }
      var tile = f === 2 ? def.top : (f === 3 ? def.bottom : def.side);
      var uv = tileUV(tile);
      /* 스카이라이트(그림자) */
      var occl = (heightMap[nz * WX + nx] > ny) ? 0.76 : 1.0;
      var shade = (0.62 + F.sh * 0.38) * occl;
      var base = def.emit ? Math.max(shade, def.emit) : shade;
      /* 위치 기반 미세 색상 변화 */
      var h = ((x * 73856093) ^ (y * 19349663) ^ (z * 83492791)) >>> 0;
      var vary = def.emit >= 0.7 ? 1 : 0.94 + ((h % 100) / 100) * 0.12;
      var na = F.n[0] !== 0 ? 0 : (F.n[1] !== 0 ? 1 : 2);
      var t1 = (na + 1) % 3, t2 = (na + 2) % 3;
      var lite = [0, 0, 0, 0], p = [];
      for (var i = 0; i < 4; i++) {
        var vv = F.v[i];
        p.push([x + vv[0], y + vv[1], z + vv[2]]);
        var ao = 3;
        if (def.emit < 0.7) {
          var c1 = [nx, ny, nz], c2 = [nx, ny, nz], cc = [nx, ny, nz];
          var d1 = vv[t1] ? 1 : -1, d2 = vv[t2] ? 1 : -1;
          c1[t1] += d1; c2[t2] += d2; cc[t1] += d1; cc[t2] += d2;
          var s1 = aoSolid(c1[0], c1[1], c1[2]) ? 1 : 0;
          var s2 = aoSolid(c2[0], c2[1], c2[2]) ? 1 : 0;
          var sc = aoSolid(cc[0], cc[1], cc[2]) ? 1 : 0;
          ao = (s1 && s2) ? 0 : 3 - (s1 + s2 + sc);
        }
        lite[i] = base * (0.55 + (ao / 3) * 0.45);
      }
      var flip = (lite[0] + lite[2]) > (lite[1] + lite[3]);
      mb.quad(p[0], p[1], p[2], p[3], uv[0], uv[1], uv[2], uv[3],
        lite[0], lite[1], lite[2], lite[3], vary, vary, vary, flip);
    }
  }
  if (!found || !mb.count()) return null;
  return {
    mesh: mb.build(),
    bb: [ox, minY, oz, Math.min(WX, ox + size), maxY + 1, Math.min(WZ, oz + size)]
  };
}

/* ---------- 하늘 돔 / 구름 ---------- */
function buildSkyDome() {
  var mb = new MB(), uv = tileUV(T.WHITE), SEG = 20, RINGS = 9, R = 380;
  var sk = curMap.sky;
  var topC = sk.top, horC = sk.hor, botC = sk.bot, midBot = sk.mid;
  function colAt(t) { // t: 1=천정, 0=수평, -1=바닥
    if (t >= 0) { var k2 = Math.pow(t, 0.48); return [lerp(horC[0], topC[0], k2), lerp(horC[1], topC[1], k2), lerp(horC[2], topC[2], k2)]; }
    var k = -t;
    var a = [lerp(horC[0], midBot[0], Math.min(1, k * 3.0)), lerp(horC[1], midBot[1], Math.min(1, k * 3.0)), lerp(horC[2], midBot[2], Math.min(1, k * 3.0))];
    return [lerp(a[0], botC[0], k), lerp(a[1], botC[1], k), lerp(a[2], botC[2], k)];
  }
  for (var r = 0; r < RINGS; r++) {
    var p0 = -1 + (2 * r) / RINGS, p1 = -1 + (2 * (r + 1)) / RINGS;
    var y0 = Math.sin(p0 * Math.PI / 2) * R, y1 = Math.sin(p1 * Math.PI / 2) * R;
    var r0 = Math.cos(p0 * Math.PI / 2) * R, r1 = Math.cos(p1 * Math.PI / 2) * R;
    var c0 = colAt(p0), c1 = colAt(p1);
    for (var s = 0; s < SEG; s++) {
      var a0 = (s / SEG) * TAU, a1 = ((s + 1) / SEG) * TAU;
      var A = [Math.cos(a0) * r0, y0, Math.sin(a0) * r0], Bv = [Math.cos(a1) * r0, y0, Math.sin(a1) * r0];
      var C = [Math.cos(a1) * r1, y1, Math.sin(a1) * r1], Dv = [Math.cos(a0) * r1, y1, Math.sin(a0) * r1];
      /* 컬링을 끄고 그리므로 winding 은 무관. 정점 색만 링별로 지정 */
      mb.quad(A, Bv, C, Dv, uv[0], uv[1], uv[2], uv[3], 1, 1, 1, 1, 1, 1, 1, false);
      var m = mb.a, n = m.length, order = [c0, c0, c1, c0, c1, c1];
      for (var k2 = 0; k2 < 6; k2++) {
        var o = n - (6 - k2) * FSTRIDE, cc2 = order[k2];
        m[o + 6] = cc2[0]; m[o + 7] = cc2[1]; m[o + 8] = cc2[2];
      }
    }
  }
  return mb.build();
}

function buildCloudMesh() {
  var mb = new MB(), S = 420, REP = 14;
  mb.quad([-S, 0, S], [S, 0, S], [S, 0, -S], [-S, 0, -S], 0, 0, REP, REP, 1, 1, 1, 1, 1, 1, 1, false);
  return mb.build();
}

function buildSunMesh() {
  var mb = new MB(), uv = tileUV(T.GLOWORB), S = curMap.sun.size, D = 300, sc = curMap.sun.col;
  mb.quad([-S, -S, -D], [S, -S, -D], [S, S, -D], [-S, S, -D], uv[0], uv[1], uv[2], uv[3], 1, 1, 1, 1, sc[0], sc[1], sc[2], false);
  return mb.build();
}

/* ---------- 용암 바다 (아레나 아래) ---------- */
function buildLavaSea() {
  /* 아틀라스 타일 하나를 반복해야 하므로 격자 쿼드로 만든다 */
  var mb = new MB(), uv = tileUV(curMap.sea.tile), N = 15, CELL = 22, H = N * CELL / 2;
  for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) {
    var x0 = -H + i * CELL, z0 = -H + j * CELL, x1 = x0 + CELL, z1 = z0 + CELL;
    var f = 0.82 + ((i * 7 + j * 13) % 5) * 0.06, sc = curMap.sea.col;

/* =====================================================================

var MSCALE = 0.9375 / 16;   // 마인크래프트 플레이어 렌더 스케일

var PlayerModel = null, ArmorModels = {}, ItemMeshes = {};

/* ---------- 아이템 2D 스프라이트 → 3D 압출 메시 ----------
   흰색 타일 + 정점 컬러 사용 (텍스처 스왑 불필요) */
function buildItemMesh(sprite, thickness) {
  var mb = new MB(), uv = tileUV(T.WHITE), TH = thickness || (1 / 16);

    q([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], 1.0);           // +Z

};

Entity.prototype.applyPhysics = function (strafe, fwd) {
  var slip = this.onGround ? SLIP_GROUND : SLIP_AIR;

    this.vx += s * cy - f * sy;
    this.vz += f * cy + s * sy;

  this.vy -= GRAVITY; this.vy *= DRAG;
  this.vx *= slip; this.vz *= slip;

/* ---------------- 넉백 ---------------- */
Entity.prototype.knockBack = function (fromX, fromZ, strength) {

/* ---------------- 피해 처리 ---------------- */
Entity.prototype.canBlockDamage = function (attacker) {

  if (!attacker) return false;
  var lv = this.lookVec(), lx = lv[0], lz = lv[2];

/* 방어구/인챈트 감소 */

/* 마인크래프트 attackEntityFrom 규칙 그대로 */

/* 레이캐스트 : 눈 → 시선, reach 이내 상대 히트박스 */

Entity.prototype.performAttack = function (target, cooled) {

/* ---------------- 검기 발사체 ---------------- */

Render.resize = function (cv) {

function lerpAngle(a, b, t) { return a + wrapDeg(b - a) * t; }

Render.setupCamera = function (p, alpha) {
  /* --- K.O. 시네마틱 카메라 --- */
  var ko = Game.koCam;
  if (ko && ko.active && ko.target) {
    var t = ko.target;
    var kx = lerp(t.px, t.x, alpha), ky = lerp(t.py, t.y, alpha), kz = lerp(t.pz, t.z, alpha);
    var prog = clamp(ko.t / ko.dur, 0, 1);
    var ang = ko.baseAng + prog * 1.5;
    var dist = lerp(2.0, 4.4, prog), hgt = lerp(1.5, 2.5, prog);
    this.camX = kx + Math.cos(ang) * dist;
    this.camY = ky + hgt;
    this.camZ = kz + Math.sin(ang) * dist;
    var ddx = kx - this.camX, ddy = (ky + 1.0) - this.camY, ddz = kz - this.camZ;
    this.camYaw = Math.atan2(-ddx, ddz) / DEG;
    this.camPitch = -Math.atan2(ddy, Math.sqrt(ddx * ddx + ddz * ddz)) / DEG;
    this.camRoll = Math.sin(prog * Math.PI) * 4;
    var ka = this.scratch[0], kb = this.scratch[1], kc = this.scratch[2], kd = this.scratch[3];
    M4.rotZ(ka, this.camRoll * DEG); M4.rotX(kb, this.camPitch * DEG); M4.mul(kc, ka, kb);
    M4.rotY(ka, (this.camYaw + 180) * DEG); M4.mul(kd, kc, ka);
    M4.transV(ka, -this.camX, -this.camY, -this.camZ); M4.mul(this.view, kd, ka);
    M4.persp(this.proj, lerp(58, 74, prog) * DEG, this.W / this.H, 0.05, 900);
    return;
  }
  var eyeY = p.sneaking ? 1.54 : 1.62;
  var x = lerp(p.px, p.x, alpha), y = lerp(p.py, p.y, alpha), z = lerp(p.pz, p.z, alpha);
  this.camYaw = p === Game.player ? p.yaw : lerpAngle(p.pYaw, p.yaw, alpha);
  this.camPitch = p === Game.player ? p.pitch : lerpAngle(p.pPitch, p.pitch, alpha);
  var cy = y + eyeY;

  /* 시야 흔들림 */
  var bobX = 0, bobY = 0, roll = 0;
  if (Game.settings.bob && !this.thirdPerson) {
    var lsa = lerp(p.pLimbSwingAmount, p.limbSwingAmount, alpha) * 0.9;
    var f1 = -(p.distWalked * 2.2 + alpha * 0.02);
    bobX = Math.sin(f1 * Math.PI) * lsa * 0.28;
    bobY = -Math.abs(Math.cos(f1 * Math.PI) * lsa) * 0.22;
    roll += Math.sin(f1 * Math.PI) * lsa * 3.2;
  }
  /* 피격 흔들림 */
  var ht = p.hurtTime - alpha;
  var _hcM = modsFor(p);
  if (_hcM && _hcM.noHurtCam) ht = 0;
  if (ht > 0 && p.maxHurtTime > 0) {
    var f = ht / p.maxHurtTime; f = Math.sin(f * f * f * f * Math.PI);
    roll += -f * 14 * Math.cos(p.attackedAtYaw * DEG);
    this.camPitch += f * 6 * Math.sin(p.attackedAtYaw * DEG);
  }
  if (p.dead) {
    var dt = p.deathTicks + alpha;
    roll += 40 - 8000 / (dt * 6 + 200);
    cy -= Math.min(1.0, dt * 0.05);
  }
  /* 화면 흔들림 */
  if (Game.shake > 0.001) {
    var sh = Game.shake;
    this.camYaw += (Math.random() - 0.5) * sh * 2.6;
    this.camPitch += (Math.random() - 0.5) * sh * 2.0;
    roll += (Math.random() - 0.5) * sh * 3.4;
  }
  /* 격노 중엔 시야가 살짝 넓어진다 */
  this.camRoll = roll;

  var camX = x, camZ = z;
  if (this.thirdPerson) {
    var dist = 3.6 * this.thirdPerson;
    var lv = [-Math.sin(this.camYaw * DEG) * Math.cos(this.camPitch * DEG),
    -Math.sin(this.camPitch * DEG), Math.cos(this.camYaw * DEG) * Math.cos(this.camPitch * DEG)];
    var back = dist;
    for (var s = 0; s < 12; s++) {
      var t = dist * s / 12;
      if (isOpaqueAt(Math.floor(x - lv[0] * t), Math.floor(cy - lv[1] * t), Math.floor(z - lv[2] * t))) { back = Math.max(0.6, t - 0.35); break; }
    }
    camX = x - lv[0] * back; cy = cy - lv[1] * back; camZ = z - lv[2] * back;
  } else {
    camX += bobX * Math.cos(this.camYaw * DEG); camZ += bobX * Math.sin(this.camYaw * DEG);
    cy += bobY;
  }
  this.camX = camX; this.camY = cy; this.camZ = camZ;

  var a = this.scratch[0], b = this.scratch[1], c = this.scratch[2], d = this.scratch[3];
  M4.rotZ(a, this.camRoll * DEG);
  M4.rotX(b, this.camPitch * DEG);
  M4.mul(c, a, b);
  M4.rotY(a, (this.camYaw + 180) * DEG);
  M4.mul(d, c, a);
  M4.transV(a, -camX, -cy, -camZ);
  M4.mul(this.view, d, a);

  var fov = this.fov * (p.sprinting ? 1.11 : 1) * (p.rageTicks > 0 ? 1.06 : 1) * (Game.fovMul || 1);
  M4.persp(this.proj, fov * DEG, this.W / this.H, 0.05, 900);
};

Render.setFog = function (near, far, col) {
  gl.uniform1f(U.uFogNear, near); gl.uniform1f(U.uFogFar, far);
  gl.uniform3f(U.uFogColor, col[0], col[1], col[2]);
};

var FOG_COL = [0.42, 0.16, 0.10];
Render.rebuildMap = function () {
  this.skyMesh = buildSkyDome();
  this.lavaMesh = buildLavaSea();
  this.sunMesh = buildSunMesh();
};

Render.frame = function (alpha) {
  var p = Game.camTarget();
  this.setupCamera(p, alpha);
  this.time += 1 / 60;

  gl.viewport(0, 0, this.W, this.H);
  var FC = curMap.fog;
  gl.clearColor(FC[0], FC[1], FC[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(prog);
  gl.uniformMatrix4fv(U.uProj, false, this.proj);
  gl.uniformMatrix4fv(U.uView, false, this.view);
  gl.uniform4f(U.uTint, 0, 0, 0, 0);
  gl.uniform1f(U.uAlpha, 1);
  var _fbM = modsFor(Game.player);
  gl.uniform1f(U.uBright, (_fbM && _fbM.fullbright) ? 1.0 : 0);
  gl.uniform1f(U.uCut, 0.35);
  gl.activeTexture(gl.TEXTURE0);

  /* ---- 용암 바다 ---- */
  this.setFog(Game.settings.render * 1.4, Game.settings.render * 3.4, curMap.sea.fog);
  gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
  gl.disable(gl.CULL_FACE);
  this.ms.identity().translate(0, LAVA_Y, 0);
  gl.uniformMatrix4fv(U.uModel, false, this.ms.cur);
  if (this.lavaMesh) this.lavaMesh.draw();
  gl.enable(gl.CULL_FACE);

  /* ---- 월드 ---- */
  this.setFog(Game.settings.render * 0.55, Game.settings.render, FC);
  gl.uniformMatrix4fv(U.uModel, false, this.ident);
  M4.mul(this.vp, this.proj, this.view);
  this.updateFrustum(this.vp);
  this.drawn = 0; this.chunks = 0;
  if (this.worldMesh) {
    for (var ci = 0; ci < this.worldMesh.length; ci++) {
      var ch = this.worldMesh[ci]; this.chunks++;
      if (!this.boxInFrustum(ch.bb)) continue;
      ch.mesh.draw(); this.drawn++;
    }
  }
  /* 바닥 그림자 */
  if (Game.settings.shadows && !Game.settings.lowFx) this.drawShadows(alpha);

  /* ---- 하늘 (월드 뒤에 그려 오버드로우를 줄인다) ---- */
  /* ---- 하늘 ---- */
  gl.disable(gl.CULL_FACE); gl.depthMask(false);
  this.setFog(1e8, 1e9, FC);
  gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
  this.ms.identity().translate(this.camX, this.camY, this.camZ);
  gl.uniformMatrix4fv(U.uModel, false, this.ms.cur);
  this.skyMesh.draw();
  /* 해 */
  this.ms.identity().translate(this.camX, this.camY, this.camZ).rotY(curMap.sun.yaw * DEG).rotX(curMap.sun.pitch * DEG);
  gl.uniformMatrix4fv(U.uModel, false, this.ms.cur);
  this.sunMesh.draw();
  /* 구름 */
  if (!Game.settings.lowFx) {
  gl.enable(gl.BLEND);
  gl.bindTexture(gl.TEXTURE_2D, this.texCloud);
  gl.uniform4f(U.uTint, curMap.cloudCol[0], curMap.cloudCol[1], curMap.cloudCol[2], 1);
  gl.uniform1f(U.uAlpha, curMap.cloudA === undefined ? 0.7 : curMap.cloudA);
  this.ms.identity().translate(this.camX + this.time * 0.9, SURF + curMap.cloudY, this.camZ);
  gl.uniformMatrix4fv(U.uModel, false, this.ms.cur);
  this.cloudMesh.draw();
  gl.uniform4f(U.uTint, 0, 0, 0, 0); gl.uniform1f(U.uAlpha, 1);
  gl.disable(gl.BLEND);
  }
  gl.depthMask(true); gl.enable(gl.CULL_FACE);


  /* ---- 엔티티 ---- */
  for (var i = 0; i < Game.entities.length; i++) {
    var e = Game.entities[i];
    if (e === Game.player && !this.thirdPerson) continue;
    this.drawEntity(e, alpha);
  }

  /* ---- Chams : 벽 너머로 상대 실루엣을 한 번 더 그린다 ---- */
  var _cM = modsFor(Game.player);
  if (_cM && _cM.chams && Game.bot && !Game.bot.dead && Game.state === 'play') {
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND); gl.uniform1f(U.uAlpha, 0.55);
    var _cp = Math.sin(Game.now * 0.006) * 0.12;
    gl.uniform4f(U.uTint, 1, 0.25, 0.85, 0.72 + _cp);
    this.drawEntity(Game.bot, alpha);
    gl.uniform4f(U.uTint, 0, 0, 0, 0); gl.uniform1f(U.uAlpha, 1);
    gl.disable(gl.BLEND); gl.enable(gl.DEPTH_TEST);
  }

  /* ---- 검기 / 진주 / 충격파 / 파티클 ---- */
  this.drawBeams(alpha);
  this.drawPearls(alpha);
  this.drawParticles(alpha);
  this.drawRings(alpha);

  /* ---- 1인칭 손 ---- */
  if (!this.thirdPerson && !Game.player.dead) this.drawHand(alpha);
};

/* ---------------- 엔티티 ---------------- */
Render.drawEntity = function (e, alpha) {
  var ms = this.ms;
  var x = lerp(e.px, e.x, alpha), y = lerp(e.py, e.y, alpha), z = lerp(e.pz, e.z, alpha);
  var bodyYaw = lerpAngle(e.pBodyYaw, e.bodyYaw, alpha);
  var headYaw = lerpAngle(e.pYaw, e.yaw, alpha);
  var pitch = lerpAngle(e.pPitch, e.pitch, alpha);
  var swing = lerp(e.pSwingProgress, e.swingProgress, alpha);
  if (e.swinging && e.swingTicks < 0) swing = 0;
  var lsAmt = lerp(e.pLimbSwingAmount, e.limbSwingAmount, alpha);
  var ls = e.limbSwing;
  var P = PlayerModel.parts;

  var hurt = e.hurtTime > 0;
  if (hurt) gl.uniform4f(U.uTint, 1, 0.15, 0.15, 0.42);
  else if (e.rageTicks > 0) gl.uniform4f(U.uTint, 1, 0.35, 0.08, 0.20 + Math.sin(Game.now * 0.012) * 0.07);
  else gl.uniform4f(U.uTint, 0, 0, 0, 0);

  var deathRoll = e.dead ? Math.min(1, e.deathTicks / 15) * 90 : 0;

  ms.identity().translate(x, y, z);
  if (deathRoll) { ms.translate(0, 0.15, 0).rotZ(deathRoll * DEG); }
  ms.rotY(-bodyYaw * DEG);
  if (e.sneaking) ms.translate(0, -0.135, 0);
  ms.scale(MSCALE, MSCALE, MSCALE);

  var sneakLean = e.sneaking ? 0.5 : 0;
  var legR = Math.cos(ls * 0.6662) * 1.4 * lsAmt;
  var legL = Math.cos(ls * 0.6662 + Math.PI) * 1.4 * lsAmt;
  var armRx = Math.cos(ls * 0.6662 + Math.PI) * 1.0 * lsAmt;
  var armLx = Math.cos(ls * 0.6662) * 1.0 * lsAmt;

  /* 공격 스윙 */
  var bodySwingY = 0;
  if (swing > 0) {
    var f1 = 1 - swing; f1 = 1 - f1 * f1 * f1;
    bodySwingY = Math.sin(Math.sqrt(swing) * Math.PI * 2) * 0.2;
    armRx -= (Math.sin(f1 * Math.PI) * 1.25 + Math.sin(swing * Math.PI) * (0.7 - pitch * DEG) * 0.6);
  }
  /* 방패 들기 */
  var blockLift = e.blocking ? 1 : 0;
  var eatLift = e.eating ? 1 : 0;

  gl.bindTexture(gl.TEXTURE_2D, this.texSkin[e.skinIdx]);
  var M = PlayerModel.mesh;

  function part(pt, fn) {
    ms.push(); ms.translate(pt.p[0], pt.p[1], pt.p[2]);
    if (fn) fn();
    gl.uniformMatrix4fv(U.uModel, false, ms.cur);
    M.drawRange(pt.start, pt.count);
    ms.pop();
  }
  /* 머리 */
  var headRot = function () {
    ms.rotY(-wrapDeg(headYaw - bodyYaw) * DEG);
    ms.rotX(pitch * DEG);
    if (sneakLean) ms.translate(0, 0, 0);
  };
  if (e.sneaking) { ms.push(); ms.translate(0, -3, 4); }
  part(P.head, headRot); part(P.hat, headRot);
  if (e.sneaking) ms.pop();

  /* 몸통 */
  part(P.body, function () { ms.rotY(bodySwingY); ms.rotX(sneakLean); });

  /* 팔 */
  var armR = function () {
    ms.rotY(bodySwingY * 2);
    if (sneakLean) { ms.translate(0, -1, 3.6); ms.rotX(sneakLean * 0.7); }
    if (eatLift) { ms.rotX(-1.55 + Math.sin(Game.tickCount * 0.9) * 0.06); ms.rotY(0.35); }
    else if (blockLift && COMBAT.mode === 18) { ms.rotX(-0.9); ms.rotY(0.5); }
    else ms.rotX(armRx);
  };
  var armL = function () {
    ms.rotY(-bodySwingY * 2);
    if (sneakLean) { ms.translate(0, -1, 3.6); ms.rotX(sneakLean * 0.7); }
    if (blockLift && COMBAT.mode === 19) { ms.rotX(-1.15); ms.rotY(-0.55); }
    else ms.rotX(armLx);
  };
  part(P.armR, armR); part(P.armL, armL);
  /* 다리 */
  part(P.legR, function () { if (sneakLean) ms.translate(0, 0, 1); ms.rotX(legR); });
  part(P.legL, function () { if (sneakLean) ms.translate(0, 0, 1); ms.rotX(legL); });

  /* 갑옷 */
  var AM = ArmorModels[e.kit.armorTile];
  if (AM) {
    gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
    var AP = AM.parts, AMesh = AM.mesh;
    function apart(pt, fn) {
      ms.push(); ms.translate(pt.p[0], pt.p[1], pt.p[2]);
      if (fn) fn();
      gl.uniformMatrix4fv(U.uModel, false, ms.cur);
      AMesh.drawRange(pt.start, pt.count);
      ms.pop();
    }
    if (e.sneaking) { ms.push(); ms.translate(0, -3, 4); }
    apart(AP.helm, headRot); apart(AP.helmBand, headRot);
    if (e.sneaking) ms.pop();
    apart(AP.chest, function () { ms.rotY(bodySwingY); ms.rotX(sneakLean); });
    apart(AP.shR, armR); apart(AP.shL, armL);
    apart(AP.legR, function () { if (sneakLean) ms.translate(0, 0, 1); ms.rotX(legR); });
    apart(AP.legL, function () { if (sneakLean) ms.translate(0, 0, 1); ms.rotX(legL); });
    apart(AP.bootR, function () { if (sneakLean) ms.translate(0, 0, 1); ms.rotX(legR); });
    apart(AP.bootL, function () { if (sneakLean) ms.translate(0, 0, 1); ms.rotX(legL); });
  }

  /* 손에 든 아이템 */
  gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
  var itemKey = e.slot === 1 ? 'golden_apple' : e.kit.item;
  var im = ItemMeshes[itemKey];
  if (im) {
    ms.push();
    ms.translate(P.armR.p[0], P.armR.p[1], P.armR.p[2]);
    armR();
    ms.translate(-0.6, -10.2, 0.6);
    if (e.slot === 1) { ms.rotY(-0.4); ms.scale(9, 9, 9); }
    else { ms.rotX(72 * DEG); ms.rotZ(45 * DEG); ms.scale(15, 15, 15); ms.translate(0, 0.3, 0); }
    gl.uniformMatrix4fv(U.uModel, false, ms.cur);
    im.draw();
    /* 검격 잔상 */
    if (e.slot !== 1) {
      if (!e._trail) e._trail = new Trail(11, [0.75, 0.99, 1]);
      e._trail.col = e.rageTicks > 0 ? [1, 0.5, 0.16] : [0.7, 0.97, 1];
      if (swing > 0.02 && swing < 0.96) e._trail.push(xform4(ms.cur, [0, 0.72, 0]), xform4(ms.cur, [0, -0.40, 0]));
      else e._trail.fade();
    }
    ms.pop();
  }
  /* 방패 (왼손) */
  if (e.blocking && COMBAT.mode === 19 && ItemMeshes.shield) {
    ms.push();
    ms.translate(P.armL.p[0], P.armL.p[1], P.armL.p[2]);
    armL();
    ms.translate(1.6, -8.5, 2.2);
    ms.rotY(-15 * DEG);
    ms.scale(15, 15, 15);
    gl.uniformMatrix4fv(U.uModel, false, ms.cur);
    ItemMeshes.shield.draw();
    ms.pop();
  }
  gl.uniform4f(U.uTint, 0, 0, 0, 0);
  if (e._trail && !Game.settings.lowFx) this.drawTrail(e._trail, false);
};

/* ---------------- 파티클 (일반 + 가산합성 2패스) ---------------- */
Render.drawParticles = function (alpha) {
  if (!particles.length) return;
  var v = this.view;
  var rx = v[0], ry = v[4], rz = v[8];
  var ux = v[1], uy = v[5], uz = v[9];
  gl.bindTexture(gl.TEXTURE_2D, this.texAtlas);
  gl.uniformMatrix4fv(U.uModel, false, this.ident);
  gl.disable(gl.CULL_FACE);
  gl.depthMask(false);
  gl.enable(gl.BLEND);

  for (var pass = 0; pass < 2; pass++) {
    var pm = this.particleMesh; pm.reset();
    var any = false;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (!!p.add !== (pass === 1)) continue;
      var x = lerp(p.px, p.x, alpha), y = lerp(p.py, p.y, alpha), z = lerp(p.pz, p.z, alpha);
      var ddx = x - this.camX, ddy = y - this.camY, ddz = z - this.camZ;

      var uv = tileUV(p.tile);

        [x + ax - bx, y + ay - by, z + az - bz],
        [x + ax + bx, y + ay + by, z + az + bz],
        [x - ax + bx, y - ay + by, z - az + bz],
        uv[0], uv[1], uv[2], uv[3], 1, p.col[0] * f, p.col[1] * f, p.col[2] * f);
      any = true;

    if (!any) continue;
    if (pass === 1) { gl.blendFunc(gl.SRC_ALPHA, gl.ONE); gl.uniform1f(U.uCut, 0.02); }
    else { gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.uniform1f(U.uCut, 0.35); }
    pm.flush();
  }
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.uniform1f(U.uCut, 0.35);
  gl.depthMask(true); gl.disable(gl.BLEND); gl.enable(gl.CULL_FACE);
};

    gl.uniformMatrix4fv(U.uModel, false, ms.cur);

/* 월드 좌표 → 화면 좌표 */
Render.project = function (x, y, z) {
  var v = this.view, pr = this.proj;
  var ex = v[0] * x + v[4] * y + v[8] * z + v[12];
  var ey = v[1] * x + v[5] * y + v[9] * z + v[13];
  var ez = v[2] * x + v[6] * y + v[10] * z + v[14];
  if (ez > -0.1) return null;
  var cx = pr[0] * ex, cy = pr[5] * ey, cw = -ez;
  return { x: (cx / cw * 0.5 + 0.5) * this.W / this.dpr, y: (0.5 - cy / cw * 0.5) * this.H / this.dpr, d: cw };
};

  function row(i) { return [m[i], m[4 + i], m[8 + i], m[12 + i]]; }

  var defs = [[r3, r0, 1], [r3, r0, -1], [r3, r1, 1], [r3, r1, -1], [r3, r2, 1], [r3, r2, -1]];

    p[0] = a[0] + sgn * b[0]; p[1] = a[1] + sgn * b[1]; p[2] = a[2] + sgn * b[2]; p[3] = a[3] + sgn * b[3];
    var l = Math.sqrt(p[0] * p[0] + p[1] * p[1] + p[2] * p[2]) || 1;

/* FPS 기반 동적 해상도 */

  else if (avg > 70 && this.resScale < 1) this.resScale = Math.min(1, this.resScale + 0.05);

function makeIcon(map, fill, hi, half) {
  var W = map[0].length, H = map.length, S = 1;
  var cv = document.createElement('canvas'); cv.width = W + 2; cv.height = H + 2;
  var c = cv.getContext('2d');
  function at(x, y) { return (y >= 0 && y < H && x >= 0 && x < W) ? map[y][x] === 'X' : false; }
  /* 외곽선 */
  c.fillStyle = 'rgba(0,0,0,0.85)';
  for (var y = -1; y <= H; y++) for (var x = -1; x <= W; x++) {
    if (at(x, y)) continue;
    if (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1) || at(x - 1, y - 1) || at(x + 1, y + 1) || at(x - 1, y + 1) || at(x + 1, y - 1))
      c.fillRect(x + 1, y + 1, S, S);
  }
  for (var y2 = 0; y2 < H; y2++) for (var x2 = 0; x2 < W; x2++) {
    if (!at(x2, y2)) continue;
    if (half && x2 >= Math.ceil(W / 2)) continue;
    var col = fill;
    if (hi && ((x2 === 2 && y2 === 1) || (x2 === 3 && y2 === 1) || (x2 === 2 && y2 === 2))) col = hi;

}

  /* ---- 디버그 ---- */
  if (Game.settings.debug) this.drawDebug();

  /* ---- 온라인 상태 ---- */
  if (Game.online) {
    var pg = Net.ping;
    var pc = pg < 60 ? '#7dff9b' : (pg < 140 ? '#ffd93d' : '#ff8f6a');
    txt(c, (Net.connected ? '● 온라인' : '○ 끊김') + '  ' + pg + 'ms  ' + (Net.isHost ? '방장' : '참가자'),
      8 * S, 10 * S, 5.2 * S, Net.connected ? pc : '#ff5c5c', 'left');
  }
  /* ---- 핵 클라이언트 오버레이 ---- */
  this.drawClientOverlay();

  /* ---- 2.0 : 궁극 게이지 / 콤보 / 콜아웃 ---- */
  this.drawUlt();
  this.drawCombo();
  this.drawCallouts();
  this.drawRageEdge();

  /* ---- 라운드 안내 / 카운트다운 ---- */
  this.drawCenterMsg();

  /* ---- 시네마틱 (VS 인트로 / K.O.) ---- */
  this.drawCinematic();
  this.drawFlash();
};

HUD.vig = function (rgbPrefix) {
  var key = rgbPrefix + this.W + 'x' + this.H;
  if (this._vigKey === key) return this._vig;
  var c = this.ctx, W = this.W, H = this.H;
  var g = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.24, W / 2, H / 2, Math.max(W, H) * 0.66);
  g.addColorStop(0, rgbPrefix + '0)'); g.addColorStop(1, rgbPrefix + '1)');
  this._vigKey = key; this._vig = g;
  return g;
};
HUD.drawCrosshair = function (alpha) {
  var c = this.ctx, W = this.W, H = this.H, S = this.S, p = Game.player;
  var cx = Math.round(W / 2), cy = Math.round(H / 2);
  c.save();
  c.globalCompositeOperation = 'difference';
  c.fillStyle = '#fff';
  var len = 5 * S, th = Math.max(1, S - 1);
  c.fillRect(cx - len, cy - th / 2, len * 2, th);
  c.fillRect(cx - th / 2, cy - len, th, len * 2);
  c.restore();

  if (this.hitMark > 0) {
    var a = this.hitMark / 8;
    c.save(); c.strokeStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')'; c.lineWidth = Math.max(2, S);
    var r0 = 4 * S, r1 = 8 * S;
    for (var i = 0; i < 4; i++) {
      var sx = (i & 1) ? 1 : -1, sy = (i & 2) ? 1 : -1;
      c.beginPath(); c.moveTo(cx + sx * r0, cy + sy * r0); c.lineTo(cx + sx * r1, cy + sy * r1); c.stroke();
    }
    c.restore();
  }

  /* 아이템 사용(먹기) 진행 링 */
  if (p.eating) {
    var ep = clamp((p.eatTicks + alpha) / 32, 0, 1);
    c.save();
    c.strokeStyle = 'rgba(0,0,0,0.55)'; c.lineWidth = 3.2 * S;
    c.beginPath(); c.arc(cx, cy, 11 * S, 0, TAU); c.stroke();
    c.strokeStyle = '#ffd93d'; c.lineWidth = 2.4 * S;
    c.beginPath(); c.arc(cx, cy, 11 * S, -Math.PI / 2, -Math.PI / 2 + TAU * ep); c.stroke();
    c.restore();
    txt(c, '먹는 중 ' + Math.round(ep * 100) + '%', cx, cy + 20 * S, 5.4 * S, '#ffd93d', 'center');
  } else if (p.slot === 1 && p.gapples > 0 && Game.state === 'play') {
    txt(c, '우클릭을 꾹 누르세요 (1.6초)', cx, cy + 20 * S, 5.2 * S, 'rgba(255,217,61,0.75)', 'center');
  } else if (p.slot === 2 && p.pearls > 0 && Game.state === 'play') {
    txt(c, '우클릭 = 엔더 진주 투척', cx, cy + 20 * S, 5.2 * S, 'rgba(95,232,208,0.8)', 'center');
  } else if (p.slot === 3 && p.anchorCharges > 0 && Game.state === 'play') {
    txt(c, '우클릭 = 리스폰 위치 설정 (' + p.anchorCharges + '회)', cx, cy + 20 * S, 5.2 * S, 'rgba(95,232,208,0.9)', 'center');
    if (p.anchorPos) txt(c, '● 정박기 설치됨', cx, cy + 32 * S, 4.8 * S, 'rgba(95,232,208,0.7)', 'center');
  }

  /* 공격 쿨다운 인디케이터 (1.9+) */
  if (COMBAT.mode === 19 && Game.settings.indicator) {
    var str = clamp((p.ticksSinceSwing + alpha) / p.cooldownPeriod(), 0, 1);
    if (str < 1) {
      var bw = 17 * S, bh = 3 * S, bx = cx - bw / 2, by = cy + 8 * S;
      c.fillStyle = 'rgba(0,0,0,0.65)'; c.fillRect(bx - S, by - S, bw + 2 * S, bh + 2 * S);
      c.fillStyle = '#4a4a4a'; c.fillRect(bx, by, bw, bh);
      c.fillStyle = str >= 1 ? '#ffffff' : '#c8c8c8';
      c.fillRect(bx, by, Math.round(bw * str), bh);
      if (str >= 1) { c.fillStyle = 'rgba(255,255,255,0.9)'; c.fillRect(bx, by - S, bw, S); }
    }
  }
};

HUD.drawNameplate = function (e, alpha) {
  if (!e || e.dead) return;
  var c = this.ctx, S = this.S;
  var x = lerp(e.px, e.x, alpha), y = lerp(e.py, e.y, alpha), z = lerp(e.pz, e.z, alpha);
  var pr = Render.project(x, y + 2.25, z);
  if (!pr || pr.d > 60) return;
  var sc = clamp(1.6 - pr.d * 0.03, 0.62, 1.15) * S;
  var name = e.name;
  var fs = Math.round(7 * sc);
  c.font = '700 ' + fs + 'px "Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
  var tw = c.measureText(name).width;
  var pad = 3 * sc, bw = tw + pad * 2, bh = fs + pad * 1.6;
  c.fillStyle = 'rgba(0,0,0,0.34)';
  c.fillRect(pr.x - bw / 2, pr.y - bh, bw, bh);
  txt(c, name, pr.x, pr.y - pad * 0.8, fs, '#ffffff', 'center');
  /* 체력바 */
  var hw = Math.max(bw, 44 * sc), hh = 2.4 * sc, hy = pr.y + 1.5 * sc;
  c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(pr.x - hw / 2 - 1, hy - 1, hw + 2, hh + 2);
  c.fillStyle = '#3a1414'; c.fillRect(pr.x - hw / 2, hy, hw, hh);
  var frac = clamp(e.health / e.maxHealth, 0, 1);
  c.fillStyle = frac > 0.5 ? '#3ddc60' : (frac > 0.25 ? '#ffd93d' : '#ff4d4d');
  c.fillRect(pr.x - hw / 2, hy, hw * frac, hh);
  if (e.absorption > 0) {
    c.fillStyle = '#ffd93d';
    c.fillRect(pr.x - hw / 2, hy - hh - 1, hw * clamp(e.absorption / 8, 0, 1), hh * 0.7);
  }
};

HUD.drawDamageTexts = function (alpha) {
  var c = this.ctx;
  for (var i = this.dmgTexts.length - 1; i >= 0; i--) {
    var d = this.dmgTexts[i];
    d.t += 1 / 60;
    if (d.t > d.life) { this.dmgTexts.splice(i, 1); continue; }
    if (!Game.settings.dmgNum) continue;
    var k = d.t / d.life;
    var pr = Render.project(d.x, d.y + k * 1.3, d.z);
    if (!pr) continue;
    var sc = clamp(1.5 - pr.d * 0.03, 0.6, 1.2) * this.S;
    var fs = Math.round((d.crit ? 11 : 9) * sc);
    c.globalAlpha = clamp((1 - k) * 2.2, 0, 1);
    txt(c, d.s, pr.x, pr.y, fs, d.col, 'center');
    c.globalAlpha = 1;
  }
};

HUD.drawTop = function () {
  var c = this.ctx, W = this.W, S = this.S;
  var y = 8 * S;
  var sc = Game.score[0] + ' : ' + Game.score[1];
  txt(c, 'ROUND ' + Game.round + '  /  ' + Game.settings.bo + '선승', W / 2, y + 5 * S, 5.2 * S, '#c8b09a', 'center');
  txt(c, sc, W / 2, y + 16 * S, 9 * S, '#ffffff', 'center');
  var t = Math.max(0, Math.ceil(Game.roundTime / 20));
  var mm = (t / 60) | 0, ss = t % 60;
  txt(c, mm + ':' + (ss < 10 ? '0' : '') + ss, W / 2, y + 25 * S, 5 * S, t <= 10 ? '#ff6b6b' : '#9aa4b8', 'center');

HUD.drawEnemyBar = function () {
  var c = this.ctx, W = this.W, S = this.S, o = Game.bot;
  var bw = 120 * S, bh = 4 * S, bx = (W - bw) / 2, by = 32 * S;
  c.fillStyle = 'rgba(0,0,0,0.55)'; c.fillRect(bx - S, by - S, bw + 2 * S, bh + 2 * S);
  c.fillStyle = '#2a1414'; c.fillRect(bx, by, bw, bh);
  var frac = clamp(o.health / o.maxHealth, 0, 1);
  var grd = c.createLinearGradient(bx, 0, bx + bw, 0);
  grd.addColorStop(0, '#ff5c5c'); grd.addColorStop(1, '#ff9d5c');
  c.fillStyle = grd; c.fillRect(bx, by, bw * frac, bh);
  if (o.absorption > 0) {
    c.fillStyle = 'rgba(255,217,61,0.92)';
    c.fillRect(bx, by, bw * clamp(o.absorption / 8, 0, 1) * 0.35, bh * 0.45);
  }
  c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(bx, by, bw * frac, bh * 0.35);
  txt(c, o.name + '  ' + o.health.toFixed(1) + ' / 20', W / 2, by - 2 * S, 5 * S, '#ffd9d9', 'center');
};

HUD.drawStatus = function () {
  var c = this.ctx, W = this.W, H = this.H, S = this.S, p = Game.player;
  var barW = 182 * S, bx = Math.round((W - barW) / 2), by = H - 24 * S;

  /* ---- 핫바 ---- */
  c.fillStyle = 'rgba(0,0,0,0.62)';
  c.fillRect(bx - S, by - S, barW + 2 * S, 22 * S + 2 * S);
  c.fillStyle = 'rgba(255,255,255,0.10)'; c.fillRect(bx - S, by - S, barW + 2 * S, S);
  for (var i = 0; i < 9; i++) {
    var sx = bx + i * 20 * S + S;
    c.strokeStyle = 'rgba(255,255,255,0.10)'; c.lineWidth = 1;
    c.strokeRect(sx + 0.5, by + S + 0.5, 20 * S - 1, 20 * S - 1);
  }
  var items = Game.hotbar();
  for (var j = 0; j < items.length; j++) {
    var it = items[j]; if (!it) continue;
    var ix = bx + j * 20 * S + 3 * S, iy = by + 3 * S;
    var cvs = this.itemCv[it.icon];
    if (cvs) c.drawImage(cvs, ix, iy, 16 * S, 16 * S);
    if (it.count > 1) txt(c, '' + it.count, ix + 16 * S, iy + 16 * S - S, 6 * S, '#ffffff', 'right');
    if (it.cd !== undefined && it.cd < 1) {
      c.fillStyle = 'rgba(255,255,255,0.30)';
      c.fillRect(ix, iy + 16 * S * it.cd, 16 * S, 16 * S * (1 - it.cd));
    }
  }
  /* 선택 슬롯 */
  var selx = bx + p.slot * 20 * S - S;
  c.strokeStyle = '#ffffff'; c.lineWidth = 2 * S;
  c.strokeRect(selx + S, by, 22 * S - 2 * S, 22 * S);
  c.strokeStyle = 'rgba(0,0,0,0.6)'; c.lineWidth = S;
  c.strokeRect(selx + S - S * 1.5, by - S * 1.5, 22 * S, 22 * S + S);

  /* ---- 체력 ---- */
  var hx = bx, hy = by - 12 * S;
  var shake = (p.health <= 4 && !p.dead) ? Math.sin(Game.now * 0.02) * S * 0.6 : 0;
  var hp = Math.max(0, p.health);
  for (var h = 0; h < 10; h++) {
    var ix2 = hx + h * 8 * S, iy2 = hy + ((p.health <= 4 && (h % 2 === 0)) ? shake : 0);
    this.icon('heartBg', ix2, iy2, S);
    var v = hp - h * 2;
    if (v >= 2) this.icon('heart', ix2, iy2, S);
    else if (v >= 1) this.icon('heartHalf', ix2, iy2, S);
  }
  /* 흡수 하트 */
  if (p.absorption > 0) {
    var ab = p.absorption;
    for (var k2 = 0; k2 < 10 && ab > 0; k2++) {
      var ax = hx + k2 * 8 * S, ay = hy - 9 * S;
      if (ab >= 2) this.icon('heartGold', ax, ay, S);
      else this.icon('heartGoldHalf', ax, ay, S);
      ab -= 2;
    }
  }
  /* ---- 방어구 ---- */
  if (p.kit.armor > 0) {
    var ar = p.kit.armor, ay2 = hy - (p.absorption > 0 ? 18 : 9) * S;
    for (var a2 = 0; a2 < 10; a2++) {
      var axx = hx + a2 * 8 * S;
      this.icon('armorBg', axx, ay2, S);
      var av = ar - a2 * 2;
      if (av >= 2) this.icon('armor', axx, ay2, S);
      else if (av >= 1) this.icon('armorHalf', axx, ay2, S);
    }
  }
  /* ---- 배고픔 ---- */
  var fx = bx + barW - 9 * S, fy = hy;
  for (var f = 0; f < 10; f++) {
    var fxx = fx - f * 8 * S;
    this.icon('foodBg', fxx, fy, S);
    var fv = p.food - f * 2;
    if (fv >= 2) this.icon('food', fxx, fy, S);
    else if (fv >= 1) this.icon('foodHalf', fxx, fy, S);
  }
  /* 아이템 이름 */
  if (Game.itemNameTime > 0) {
    var nm = (Game.hotbar()[p.slot] || {}).name || '';
    var a3 = clamp(Game.itemNameTime / 30, 0, 1);
    c.globalAlpha = a3;
    txt(c, nm, W / 2, by - (p.kit.armor > 0 ? 24 : 16) * S - (p.absorption > 0 ? 9 * S : 0), 6.4 * S, '#ffffff', 'center');
    c.globalAlpha = 1;
  }
};

HUD.icon = function (name, x, y, S) {

HUD.drawLog = function () {
  var c = this.ctx, S = this.S, H = this.H;
  var y = H - 34 * S;
  for (var i = Game.logLines.length - 1; i >= 0; i--) {
    var L = Game.logLines[i];
    var age = Game.now - L.t;
    if (age > 7000) continue;
    var a = age > 6000 ? 1 - (age - 6000) / 1000 : 1;
    c.globalAlpha = clamp(a, 0, 1);
    c.fillStyle = 'rgba(0,0,0,0.4)';
    c.font = '700 ' + (5.4 * S) + 'px "Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
    var w = c.measureText(L.s).width;
    c.fillRect(6 * S, y - 5.4 * S, w + 4 * S, 7.4 * S);
    txt(c, L.s, 8 * S, y, 5.4 * S, L.c, 'left');
    y -= 8 * S;
    c.globalAlpha = 1;
    if (y < H * 0.42) break;
  }
};

HUD.addCallout = function (text, sub, col, big) {
  this.callouts.push({ s: text, sub: sub || '', col: col || '#ffd93d', t: 0, life: 1.5, big: big || 22 });

HUD.drawFlash = function () {

  c.fillStyle = 'rgba(' + this.flashCol[0] + ',' + this.flashCol[1] + ',' + this.flashCol[2] + ',' + this.flash.toFixed(3) + ')';

/* 궁극 게이지 */
/* =====================================================================
   핵 클라이언트 오버레이 : 워터마크 / ArrayList / ESP / 트레이서 / 타겟HUD
   ===================================================================== */
var CLIENT_NAME = 'RAVEN';
/* 활성 모듈 이름 목록 (ArrayList 용) */
function activeModuleNames(set) {
  var out = [];
  for (var i = 0; i < HACK_MODULES.length; i++) {
    var m = HACK_MODULES[i];
    if (m.k === 'arrayList' || m.k === 'watermark') continue;
    if (!set[m.k]) continue;
    var lbl = m.n;
    if (m.s && m.s.length) {
      var v = set[m.s[0].k];
      lbl += ' §' + (m.s[0].st < 1 ? (+v).toFixed(1) : Math.round(v)) + (m.s[0].u || '');
    }
    out.push(lbl);
  }
  return out;
}
/* 무지개 그라디언트 색 (index 기준) */
function railColor(i, t) {
  var h = ((i * 26 + t * 0.06) % 360) / 360;
  var f = function (n) { var k = (n + h * 6) % 6; return Math.round(255 * clamp(Math.min(k, 4 - k, 1), 0, 1) * 0.75 + 64); };
  return 'rgb(' + f(5) + ',' + f(3) + ',' + f(1) + ')';
}

HUD.drawClientOverlay = function () {
  var c = this.ctx, W = this.W, H = this.H, S = this.S;
  var M = modsFor(Game.player);
  var t = Game.now || 0;

  /* ---------- 워터마크 (좌상단) ---------- */
  var wy = Game.online ? 22 * S : 10 * S;
  if (M && M.watermark) {
    var fps = Game.fps || 0;
    c.save();
    var wtxt = CLIENT_NAME + ' 2.0';
    c.font = '800 ' + (7 * S) + 'px "Malgun Gothic",system-ui,sans-serif';
    var ww = c.measureText(wtxt).width;
    c.fillStyle = 'rgba(8,6,16,0.72)'; c.fillRect(6 * S, wy - 7 * S, ww + 10 * S, 11 * S);
    c.fillStyle = '#ff2d55'; c.fillRect(6 * S, wy - 7 * S, 1.6 * S, 11 * S);
    c.restore();
    txt(c, wtxt, 10 * S, wy + 1.5 * S, 7 * S, '#ffffff', 'left');
    txt(c, fps + ' FPS  |  ' + (Game.online ? Net.ping + 'ms' : keyOf(DIFFS, Game.diff)),
      10 * S + c.measureText(wtxt).width + 4 * S, wy + 1.2 * S, 5 * S, '#ff2d55', 'left');
    wy += 15 * S;
  } else if (RoomCfg.allowHack) {
    txt(c, '[Z] 핵쓰기  [X] 해커', 8 * S, wy, 5 * S, '#4a3a4a', 'left');
    wy += 11 * S;
  }

  /* ---------- ArrayList (우상단) ---------- */
  if (M && M.arrayList) {
    var names = activeModuleNames(Hacks);
    c.font = '800 ' + (6.2 * S) + 'px "Malgun Gothic",system-ui,sans-serif';
    /* 실제 클라이언트처럼 글자 폭 내림차순 정렬 */
    names.sort(function (a, b) { return c.measureText(b).width - c.measureText(a).width; });
    var ay = 8 * S;
    for (var i = 0; i < names.length; i++) {
      var nm = names[i].replace('§', ' ');
      var tw = c.measureText(nm).width;
      c.fillStyle = 'rgba(8,6,16,0.62)';
      c.fillRect(W - tw - 9 * S, ay, tw + 9 * S, 9.4 * S);
      c.fillStyle = railColor(i, t);
      c.fillRect(W - 1.6 * S, ay, 1.6 * S, 9.4 * S);
      txt(c, nm, W - 4 * S, ay + 7 * S, 6.2 * S, railColor(i, t), 'right');
      ay += 9.4 * S;
    }
  }

  /* ---------- AI 에게 끼워준 핵 (좌상단, 워터마크 아래) ---------- */
  if (!Game.online && BotMods.on) {
    var bn = activeModuleNames(BotMods);
    txt(c, '☠ AI: ' + (bn.length ? bn.join(' ').replace(/§/g, '') : '없음'),
      8 * S, wy + 4 * S, 5.4 * S, '#ff8f1a', 'left');
    wy += 11 * S;
  }
  if (Hacker.on && RoomCfg.allowHacker) {
    var hrt = [];
    if (Hacker.drainHP) hrt.push('DRAIN');
    if (Hacker.confuse) hrt.push('CONFUSE');
    if (Hacker.forceSwitch) hrt.push('SWITCH');
    txt(c, '👁 HACKER: ' + (hrt.length ? hrt.join(' ') : '대기'), 8 * S, wy + 4 * S, 5.4 * S, '#4aff9c', 'left');
  }

  /* ---------- 월드 시각 모드 ---------- */
  var o = Game.bot;
  if (!M || !o || o.dead || Game.state !== 'play') return;
  var dist = Math.sqrt((o.x - Game.player.x) * (o.x - Game.player.x) +
                       (o.z - Game.player.z) * (o.z - Game.player.z));

  /* ESP 박스 : 히트박스 8 꼭짓점을 투영해 화면 AABB 를 구한다 */
  var box = null;
  if (M.esp || M.nametags || M.tracers) {
    var hw = o.width / 2, minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9, ok = false;
    for (var xi = 0; xi < 2; xi++) for (var yi = 0; yi < 2; yi++) for (var zi = 0; zi < 2; zi++) {
      var pr = Render.project(o.x + (xi ? hw : -hw), o.y + (yi ? o.height : 0), o.z + (zi ? hw : -hw));
      if (!pr) continue;
      ok = true;
      if (pr.x < minX) minX = pr.x; if (pr.x > maxX) maxX = pr.x;
      if (pr.y < minY) minY = pr.y; if (pr.y > maxY) maxY = pr.y;
    }
    if (ok) box = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }

  if (M.esp && box) {
    var ec = o.health > 12 ? '#4affa0' : (o.health > 6 ? '#ffd93d' : '#ff4a4a');
    c.save();
    c.lineWidth = Math.max(1, S * 0.5);
    /* 모서리만 그리는 코너 박스 (실제 클라이언트 스타일) */
    var cl = Math.min(box.w, box.h) * 0.28;
    c.strokeStyle = 'rgba(0,0,0,0.8)'; c.lineWidth = Math.max(2, S * 0.9);
    for (var pass = 0; pass < 2; pass++) {
      if (pass === 1) { c.strokeStyle = ec; c.lineWidth = Math.max(1, S * 0.45); }
      c.beginPath();
      c.moveTo(box.x, box.y + cl); c.lineTo(box.x, box.y); c.lineTo(box.x + cl, box.y);
      c.moveTo(box.x + box.w - cl, box.y); c.lineTo(box.x + box.w, box.y); c.lineTo(box.x + box.w, box.y + cl);
      c.moveTo(box.x, box.y + box.h - cl); c.lineTo(box.x, box.y + box.h); c.lineTo(box.x + cl, box.y + box.h);
      c.moveTo(box.x + box.w - cl, box.y + box.h); c.lineTo(box.x + box.w, box.y + box.h); c.lineTo(box.x + box.w, box.y + box.h - cl);
      c.stroke();
    }
    /* 좌측 체력 바 */
    var hpf = clamp((o.health + o.absorption) / (o.maxHealth || 20), 0, 1);
    c.fillStyle = 'rgba(0,0,0,0.7)'; c.fillRect(box.x - 4 * S, box.y, 2 * S, box.h);
    c.fillStyle = ec; c.fillRect(box.x - 4 * S, box.y + box.h * (1 - hpf), 2 * S, box.h * hpf);
    c.restore();
  }

  if (M.nametags && box) {
    var lbl = o.name + '  ' + (o.health + o.absorption).toFixed(1) + '❤  ' + dist.toFixed(1) + 'm';
    c.font = '800 ' + (6 * S) + 'px "Malgun Gothic",system-ui,sans-serif';
    var lw = c.measureText(lbl).width;
    c.fillStyle = 'rgba(8,6,16,0.78)';
    c.fillRect(box.x + box.w / 2 - lw / 2 - 3 * S, box.y - 12 * S, lw + 6 * S, 10 * S);
    txt(c, lbl, box.x + box.w / 2, box.y - 4.5 * S, 6 * S, '#ffffff', 'center');
  }

  if (M.tracers && box) {
    c.save();
    c.strokeStyle = 'rgba(255,45,85,0.85)'; c.lineWidth = Math.max(1, S * 0.4);
    c.beginPath(); c.moveTo(W / 2, H); c.lineTo(box.x + box.w / 2, box.y + box.h / 2); c.stroke();
    c.restore();
  }

  if (M.targetHud) {
    var tw2 = 76 * S, th2 = 26 * S, tx = W / 2 + 30 * S, ty = H / 2 - 6 * S;
    c.fillStyle = 'rgba(8,6,16,0.86)'; c.fillRect(tx, ty, tw2, th2);
    c.fillStyle = '#ff2d55'; c.fillRect(tx, ty, tw2, 1.4 * S);
    txt(c, o.name, tx + 4 * S, ty + 9 * S, 6.4 * S, '#ffffff', 'left');
    txt(c, dist.toFixed(1) + 'm', tx + tw2 - 4 * S, ty + 9 * S, 5.6 * S, '#8a8aaa', 'right');
    var hf = clamp((o.health + o.absorption) / (o.maxHealth || 20), 0, 1);
    c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect(tx + 4 * S, ty + 13 * S, tw2 - 8 * S, 3.4 * S);
    c.fillStyle = hf > 0.6 ? '#4affa0' : (hf > 0.3 ? '#ffd93d' : '#ff4a4a');
    c.fillRect(tx + 4 * S, ty + 13 * S, (tw2 - 8 * S) * hf, 3.4 * S);
    txt(c, (o.health + o.absorption).toFixed(1) + ' ❤   사과 ' + o.gapples + '   진주 ' + o.pearls,
      tx + 4 * S, ty + 23 * S, 5.4 * S, '#a0a0c0', 'left');
  }
};

HUD.drawCallouts = function () {
  var c = this.ctx, W = this.W, H = this.H, S = this.S;
  for (var i = this.callouts.length - 1; i >= 0; i--) {
    var o = this.callouts[i];
    o.t += 1 / 60;
    if (o.t > o.life) { this.callouts.splice(i, 1); continue; }
    var k = o.t / o.life;
    var pop = k < 0.14 ? (k / 0.14) : 1;
    var sc = 0.6 + pop * 0.4 + (1 - pop) * 0;
    var a = k > 0.72 ? (1 - (k - 0.72) / 0.28) : 1;
    var y = H * 0.26 - i * 9 * S + (1 - pop) * 6 * S;
    c.save(); c.globalAlpha = clamp(a, 0, 1);
    c.shadowColor = o.col; c.shadowBlur = 26;
    txt(c, o.s, W / 2, y, Math.round(o.big * S * sc), o.col, 'center');
    c.shadowBlur = 0;

};

/* VS 인트로 / K.O. 시네마틱 */
HUD.drawCinematic = function () {
  var c = this.ctx, W = this.W, H = this.H, S = this.S;
  var cin = Game.cinema;
  if (!cin || cin.mode === 0) return;
  var k = clamp(cin.t / cin.dur, 0, 1);
  /* 레터박스 */
  var open = Math.min(1, (cin.mode === 1 ? k * 5 : k * 6));
  var close = cin.mode === 1 ? clamp((k - 0.82) / 0.18, 0, 1) : clamp((k - 0.88) / 0.12, 0, 1);
  var bar = H * 0.115 * (open - close);
  if (bar > 0) { c.fillStyle = '#000'; c.fillRect(0, 0, W, bar); c.fillRect(0, H - bar, W, bar); }

  if (cin.mode === 1) {
    /* --- VS 인트로 --- */
    var slide = Math.min(1, k * 3.2);
    var ease = 1 - Math.pow(1 - slide, 3);
    var fade = clamp((0.9 - k) / 0.18, 0, 1);
    c.save(); c.globalAlpha = fade;
    var cy = H * 0.44;
    var offL = (1 - ease) * W * 0.5, offR = (1 - ease) * W * 0.5;

    txt(c, Game.player.name, W * 0.40 - offL, cy + 1 * S, 15 * S, '#ffffff', 'right');
    txt(c, Game.kit.name + ' 킷', W * 0.40 - offL, cy + 9 * S, 5.6 * S, '#9fd8ff', 'right');
    /* 오른쪽 카드 */
    c.fillStyle = 'rgba(70,20,20,0.72)';
    c.fillRect(W * 0.54 + offR, cy - 13 * S, W * 0.46, 26 * S);
    c.fillStyle = '#ff7a7a'; c.fillRect(W * 0.54 + offR, cy - 13 * S, 2 * S, 26 * S);
    txt(c, Game.bot.name, W * 0.60 + offR, cy + 1 * S, 15 * S, '#ffffff', 'left');
    txt(c, Game.diff.name + ' · ' + Game.diff.tag, W * 0.60 + offR, cy + 9 * S, 5.6 * S, '#ffb3b3', 'left');
    /* VS */
    var vp = 1 + Math.max(0, 0.35 - k) * 2.2;
    c.shadowColor = '#ff6a2b'; c.shadowBlur = 34;
    txt(c, 'VS', W / 2, cy + 5 * S, Math.round(24 * S * vp), '#ffd93d', 'center');
    c.shadowBlur = 0;
    txt(c, 'ROUND ' + Game.round, W / 2, cy - 20 * S, 7 * S, '#ffffff', 'center');
    c.restore();
  } else if (cin.mode === 2) {
    /* --- K.O. --- */
    var kp = clamp(k / 0.16, 0, 1);
    var sc2 = 1 + (1 - kp) * 2.6;
    var a2 = clamp((1 - k) * 2.4, 0, 1);
    c.save(); c.globalAlpha = a2;
    c.shadowColor = '#ff2b1a'; c.shadowBlur = 50;
    txt(c, cin.text || 'K.O.', W / 2, H * 0.46, Math.round(40 * S * sc2), '#ff4a2b', 'center');
    c.shadowBlur = 0;
    if (cin.sub) txt(c, cin.sub, W / 2, H * 0.46 + 12 * S, 7 * S, '#ffd08a', 'center');
    c.restore();
  }
};
/* =====================================================================
   온라인 1 vs 1
   - 모드 A : P2P 직접 연결 (WebRTC DataChannel, 서버 불필요, 코드 교환)
   - 모드 B : 서버 접속 (WebSocket 중계, 방 코드 4자리)
   동기화 : 각자 자기 캐릭터를 완전 시뮬레이션하고 상태를 20Hz 로 전송.
            피격 판정은 "맞은 쪽"이 바닐라 무적시간 규칙으로 최종 결정한다.
   ===================================================================== */
var Net = {
  active: false, mode: '', isHost: false, connected: false, ready: false,
  peer: null, conn: null, ws: null, room: '',
  myCode: '', status: '', err: '',
  ping: 0, lastPingSent: 0, lastRecv: 0, sendAcc: 0,
  remoteName: '상대', remoteReady: false,
  onStatus: null
};

Net.setStatus = function (s) { this.status = s; if (this.onStatus) this.onStatus(s); };

/* ---------------- 공통 ---------------- */
Net.reset = function () {
  try { if (this.conn) this.conn.close(); } catch (e) { }
  try { if (this.peer) this.peer.destroy(); } catch (e) { }
  try { if (this.ws) this.ws.close(); } catch (e) { }
  this.peer = null; this.conn = null; this.ws = null;
  this.active = false; this.connected = false; this.ready = false;
  this.remoteReady = false; this.myCode = ''; this.err = '';
};
Net.send = function (o) {
  try {
    if (this.mode === 'p2p') { if (this.conn && this.conn.open) this.conn.send(o); }
    else if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o));
  } catch (e) { }
};
Net.onOpen = function () {
  this.connected = true;
  this.setStatus('연결됨');
  this.send({ t: 'i', name: Game.myName || '상대', host: this.isHost });
  this.lastRecv = performance.now();
  Game.onNetConnected();
};
Net.onClose = function (why) {
  if (!this.active) return;
  this.connected = false;
  this.setStatus('연결 끊김' + (why ? ' (' + why + ')' : ''));
  Game.onNetLost();
};

/* ---------------- 모드 A : PeerJS P2P (코드 한 번만 교환) ---------------- */
Net.peerCreate = function () {
  var self = this;
  this.reset(); this.active = true; this.mode = 'p2p'; this.isHost = true;
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for (var i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
  this.myCode = code;
  this.setStatus('코드 생성 중...');
  var peer = new Peer('mcpvp-' + code, { host: '0.peerjs.com', port: 443, secure: true, path: '/' });
  this.peer = peer;
  peer.on('open', function () { self.setStatus('대기 중'); });
  peer.on('connection', function (conn) {
    if (self.connected) { conn.close(); return; }
    self.conn = conn; self._wirePeer(conn);
  });
  peer.on('error', function (e) { self.err = e.type; self.setStatus('오류: ' + e.type); });
  return code;
};
Net.peerJoin = function (code) {
  var self = this;
  code = (code || '').toUpperCase().replace(/\s+/g, '');
  if (!code) { this.setStatus('코드를 입력하세요'); return; }
  this.reset(); this.active = true; this.mode = 'p2p'; this.isHost = false;
  this.setStatus('연결 중...');
  var peer = new Peer({ host: '0.peerjs.com', port: 443, secure: true, path: '/' });
  this.peer = peer;
  peer.on('open', function () {
    var conn = peer.connect('mcpvp-' + code, { reliable: false, serialization: 'json' });
    self.conn = conn; self._wirePeer(conn);
  });
  peer.on('error', function (e) { self.err = e.type; self.setStatus('오류: ' + e.type); });
};
Net._wirePeer = function (conn) {
  var self = this;
  conn.on('open', function () { self.onOpen(); });
  conn.on('close', function () { self.onClose(); });
  conn.on('error', function (e) { self.err = String(e); });
  conn.on('data', function (data) { self.handle(data); });
};

/* ---------------- 모드 B : WebSocket 서버 ---------------- */
Net.wsConnect = function (url, room, asHost) {
  var self = this;
  this.reset(); this.active = true; this.mode = 'ws'; this.isHost = !!asHost; this.room = room;
  this.setStatus('서버 접속 중...');
  return new Promise(function (res, rej) {
    var ws;
    try { ws = new WebSocket(url); } catch (e) { rej(e); return; }
    self.ws = ws;
    var settled = false;
    ws.onopen = function () {
      ws.send(JSON.stringify({ t: 'join', room: room, name: Game.myName || '플레이어' }));
      self.setStatus('방 ' + room + ' — 상대 기다리는 중...');
      if (!settled) { settled = true; res(); }
    };
    ws.onmessage = function (e) {
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.t === 'joined') { self.isHost = !!m.host; self.setStatus('방 ' + room + ' — ' + (m.host ? '방장' : '참가자')); return; }
      if (m.t === 'peer') { self.onOpen(); return; }
      if (m.t === 'left') { self.onClose('상대 퇴장'); return; }
      if (m.t === 'full') { self.err = '방이 가득 찼습니다'; self.setStatus('방이 가득 찼습니다'); return; }
      self.handle(e.data);
    };
    ws.onclose = function () { self.onClose('서버 연결 종료'); if (!settled) { settled = true; rej(new Error('서버에 접속할 수 없습니다')); } };
    ws.onerror = function () { if (!settled) { settled = true; rej(new Error('서버에 접속할 수 없습니다')); } };
  });
};

/* ---------------- 수신 처리 ---------------- */
Net.handle = function (raw) {
  var m; try { m = (typeof raw === 'object' && raw !== null) ? raw : JSON.parse(raw); } catch (e) { return; }
  this.lastRecv = performance.now();
  var r = Game.bot;                        // 원격 플레이어는 bot 슬롯을 재사용
  switch (m.t) {
    case 'i':
      this.remoteName = (m.name || '상대').slice(0, 12);
      if (r) r.name = this.remoteName;
      break;
    case 'ready': this.remoteReady = true; break;
    case 's':                              // 상태 스냅샷
      if (r) {
        r.netQueue.push(m);
        if (r.netQueue.length > 4) r.netQueue.shift();
      }
      break;
    case 'h': Game.netTakeHit(m); break;   // 상대가 나를 때렸다
    case 'd': Game.netRemoteDied(m); break;
    case 'b': Game.netRemoteBeam(m); break;
    case 'p': Game.netRemotePearl(m); break;
    case 'g': Game.netRemoteRage(m); break;
    case 'r': Game.netRound(m); break;     // 방장의 라운드 제어
    case 'confuse': if (r) r.yaw = wrapDeg(r.yaw + rnd(-50, 50)); break;
    case 'drain': if (r && !r.dead) { r.health = Math.max(0.5, r.health - 1); if (r.health <= 0.5) r.die(Game.player, 'hack'); } break;
    case 'ping': this.send({ t: 'pong', v: m.v }); break;
    case 'pong': this.ping = Math.round(performance.now() - m.v); break;
  }
};

/* ---------------- 송신 ---------------- */
Net.tick = function () {
  if (!this.connected) return;
  var p = Game.player;
  this.send({
    t: 's', x: +p.x.toFixed(3), y: +p.y.toFixed(3), z: +p.z.toFixed(3),
    vx: +p.vx.toFixed(3), vy: +p.vy.toFixed(3), vz: +p.vz.toFixed(3),
    ya: Math.round(p.yaw * 10) / 10, pi: Math.round(p.pitch * 10) / 10,
    by: Math.round(p.bodyYaw * 10) / 10,
    hp: +p.health.toFixed(2), ab: +p.absorption.toFixed(2), ul: Math.round(p.ult),

    og: p.onGround ? 1 : 0
  });

  var now = performance.now();

Entity.prototype.netTick = function () {
  this.px = this.x; this.py = this.y; this.pz = this.z;
  this.pYaw = this.yaw; this.pPitch = this.pitch; this.pBodyYaw = this.bodyYaw;
  this.pSwingProgress = this.swingProgress;
  this.pLimbSwingAmount = this.limbSwingAmount;
  if (this.hurtTime > 0) this.hurtTime--;
  if (this.rageTicks > 0) this.rageTicks--;

  var q = this.netQueue;
  if (q.length) {
    if (q.length > 3) q.shift();            // 밀렸으면 따라잡기
    var m = q.shift();
    this.x = m.x; this.y = m.y; this.z = m.z;
    this.vx = m.vx; this.vy = m.vy; this.vz = m.vz;
    this.yaw = m.ya; this.pitch = m.pi; this.bodyYaw = m.by;
    this.health = m.hp; this.absorption = m.ab; this.ult = m.ul;
    this.slot = m.sl; this.gapples = m.ga; this.pearls = m.pe;
    this.limbSwing = m.ls; this.limbSwingAmount = m.la;
    this.onGround = !!m.og;
    this.sneaking = !!(m.f & 1); this.sprinting = !!(m.f & 2);
    this.blocking = !!(m.f & 4); this.eating = !!(m.f & 8);
    this.dead = !!(m.f & 16);
    if ((m.f & 32) && this.rageTicks <= 0) this.rageTicks = 20;
    if ((m.f & 64) && this.hurtTime <= 0) this.hurtTime = 8;
    if (m.sw >= 0) { this.swinging = true; this.swingTicks = m.sw; }
    else { this.swinging = false; this.swingTicks = -1; }
    if (this.dead) this.deathTicks++;
  } else {
    /* 패킷 공백 : 마지막 속도로 짧게 외삽 */
    this.x += this.vx * 0.5; this.y += this.vy * 0.5; this.z += this.vz * 0.5;
  }
  this.swingProgress = this.swinging ? (this.swingTicks + 1) / 6 : 0;
};

/* ---------------- 입력 → 플레이어 ---------------- */
Game.readInput = function () {
  var p = this.player;

    p.moveForward = 0; p.moveStrafe = 0; p.jumping = false; p.sprinting = false; p.sneaking = false;
    return;
  }

  var s = (Input.down('KeyA') ? 1 : 0) - (Input.down('KeyD') ? 1 : 0);
  p.moveForward = f; p.moveStrafe = s;
  p.jumping = Input.down('Space');
  p.sneaking = Input.down('ShiftLeft') || Input.down('ShiftRight');
  if ((Input.down('ControlLeft') || Input.sprintTap) && f > 0 && !p.sneaking && p.food > 6 && !p.eating && !p.blocking)
    p.sprinting = true;
  if (f <= 0) Input.sprintTap = false;

  var M = modsFor(p);
  if (M) {
    var b = this.bot, alive = b && !b.dead && !p.dead;
    var bd = alive ? Math.sqrt((b.x - p.x) * (b.x - p.x) + ((b.y + 0.9) - p.eyeY()) * ((b.y + 0.9) - p.eyeY()) + (b.z - p.z) * (b.z - p.z)) : 999;

    if (M.fly) {

      else Hacks._flyVy = 0;
      p.sneaking = false;
    }
    if (M.speed) p.sprinting = true;

    /* SafeWalk : 진행 방향 앞이 허공이면 그 입력을 취소 */
    if (M.safeWalk && p.onGround) {
      var yr = p.yaw * DEG, sy2 = Math.sin(yr), cy2 = Math.cos(yr);

      var wz2 = p.moveStrafe * sy2 + p.moveForward * cy2;
      var wl = Math.sqrt(wx2 * wx2 + wz2 * wz2);
      if (wl > 0.01 && !groundBelow(p.x + wx2 / wl * 0.7, p.y - 0.1, p.z + wz2 / wl * 0.7, 3))
        { p.moveForward = 0; p.moveStrafe = 0; }
    }

    /* AimAssist : 시야를 상대 쪽으로 끌어당김 */
    if (M.aimAssist && alive && bd < 7) {
      var adx = b.x - p.x, adz = b.z - p.z, adl = Math.sqrt(adx * adx + adz * adz);
      var wantY = Math.atan2(-adx, adz) / DEG;
      var wantP = -Math.atan2((b.y + 1.4) - p.eyeY(), Math.max(0.05, adl)) / DEG;
      var sp2 = clamp(M.aimSpeed / 100, 0.05, 1) * 30;
      p.yaw = approachDeg(p.yaw, wantY, sp2);
      p.pitch = clamp(approachDeg(p.pitch, wantP, sp2 * 0.8), -90, 90);
    }

    /* AutoBlock : 상대가 휘두른 직후 자동으로 막기 */
    if (M.autoBlock && alive && bd < 4.2 && !p.eating) {
      if (b.ticksSinceSwing <= 2) p._abT = 6;
      if (p._abT > 0) { p._abT--; p.blocking = true; }
    }

    /* AutoGapple */
    if (M.autoGapple && !p.eating && p.gapples > 0 && p.regenTicks < 20 &&
        (p.health + p.absorption) <= M.gappleHp) { p.slot = 1; p.startUse(); }

    /* AutoUlt */
    if (M.autoUlt && !p.eating && alive) {
      if (p.canRage()) p.castRage();

    }

    var cd19 = COMBAT.mode === 19;
    var cpsOk = cd19 ? p.attackStrength(0.5) >= 0.92 : p.ticksSinceSwing >= Math.max(1, Math.round(20 / M.cps));
    /* KillAura */
    if (M.killAura && alive && bd <= Math.max(M.reach ? M.reachDist : 3.0, M.auraRange) && cpsOk) this.doAttack();
    /* TriggerBot : 조준선에 들어왔을 때만 */
    else if (M.triggerBot && alive && cpsOk &&
             rayHitsEntity(p, b, M.reach ? M.reachDist : 3.0) >= 0 && !p.blocking && !p.eating) this.doAttack();
    /* AutoClicker */
    else if (M.autoAtk && Input.mouseDown[0] && !p.blocking && !p.eating && cpsOk) this.doAttack();
  }

  if (!M && this.settings.autoAtk && Input.mouseDown[0] && !p.blocking && !p.eating) {
    if (COMBAT.mode === 19 ? p.attackStrength(0.5) >= 0.98 : p.ticksSinceSwing >= 2) this.doAttack();
  }
};
Game.tryBeam = function () {

/* ---------------- 틱 ---------------- */
Game.tick = function () {
  this.tickCount++;
  /* 2.0 : 연출 상태 */
  if (this.shake > 0) this.shake *= 0.80;
  if (this.cinema.mode) {
    this.cinema.t += 0.05;
    if (this.cinema.t > this.cinema.dur) this.cinema.mode = 0;
  }
  if (this.koCam.active) {
    this.koCam.t++;
    if (this.koCam.t > 11) this.timeScale = 1;
    if (this.koCam.t > this.koCam.dur) { this.koCam.active = false; this.timeScale = 1; }
  }
  tickBeams(); tickPearls();
  if (this.centerTime > 0) this.centerTime--;
  if (this.itemNameTime > 0) this.itemNameTime--;
  if (this.equipAnim > 0) this.equipAnim = Math.max(0, this.equipAnim - 0.22);
  if (HUD.hitMark > 0) HUD.hitMark--;

  if (this.state === 'menu' || this.state === 'matchend') { updateParticles(); return; }

  if (this.state === 'countdown') {
    this.countdown--;
    if (this.countdown === 62) this.center('', '', 16, '#fff', 0);
    this.player.tick();
    if (this.online) { this.bot.netTick(); Net.tick(); } else this.bot.tick();
    if (this.countdown === 60) this.center('3', '', 34, '#ff6b6b', 20), this.settings.sound && Snd.count(false);
    if (this.countdown === 40) this.center('2', '', 34, '#ffd93d', 20), this.settings.sound && Snd.count(false);
    if (this.countdown === 20) this.center('1', '', 34, '#7fd6ff', 20), this.settings.sound && Snd.count(false);
    if (this.countdown <= 0) {
      this.state = 'play';
      this.center('싸워라!', '', 30, '#5ee85e', 22);
      if (this.settings.sound) Snd.count(true);
    }
    updateParticles();
    return;
  }

  if (this.state === 'play') {
    this.readInput();
    if (this.online) { this.bot.netTick(); Net.tick(); }
    else {
      this.ai.tick(this.player); this.bot.tick();

        _bt.onGround = false; _bt.fallDistance = 0;

    if (Hacker.on && this.tickCount % 40 === 0 && this.bot && !this.bot.dead) {
      if (Hacker.drainHP) {

        else { var _b = this.bot; _b.health = Math.max(0.5, _b.health - 1); if (_b.health <= 0.5) _b.die(this.player, 'hack'); }
      }
      if (Hacker.confuse) {

        else { this.bot.yaw = wrapDeg(this.bot.yaw + rnd(-50, 50)); }
      }

    if (this.roundTime <= 0 && (!this.online || Net.isHost)) {
      var ph = this.player.health + this.player.absorption, bh = this.bot.health + this.bot.absorption;
      this.log('시간 종료! 남은 체력으로 판정', '#ffd93d');
      if (Math.abs(ph - bh) < 0.05) { this.state = 'roundend'; this.endTimer = 70; this.center('무승부', '체력 동일', 20, '#cccccc', 70); }
      else this.endRound(ph > bh ? 0 : 1);
    }
  } else if (this.state === 'roundend') {
    this.player.tick();
    if (this.online) { this.bot.netTick(); Net.tick(); } else this.bot.tick();
    if (--this.endTimer <= 0) {

    }
  }

      $$('[data-g="' + group + '"]').forEach(function (e2) { e2.classList.remove('sel'); });
      el.classList.add('sel'); Snd.click(); cb(el.getAttribute('data-v'));
    };
    if (el.getAttribute('data-v') === cur) el.classList.add('sel');
  });
}

/* ---------------- 모드 설정 화면 ---------------- */
function showMods(back) {
  var rows = [], sliders = [];
  function chk(o, key, label, desc) {
    var id = 'md' + rows.length;
    rows.push({ id: id, o: o, k: key });
    return '<label for="' + id + '" class="modrow' + (o[key] ? ' on' : '') + '">' +
      '<input type="checkbox" id="' + id + '"' + (o[key] ? ' checked' : '') + '>' +
      '<span class="mt">' + label + '</span><span class="md">' + (desc || '') + '</span></label>';
  }
  /* AI 에게 줄 수 있는 모듈을 레지스트리에서 그대로 뽑아 쓴다 */
  var botHtml = '';
  for (var ci = 0; ci < HACK_CATS.length; ci++) {
    var cat = HACK_CATS[ci];
    var mods = HACK_MODULES.filter(function (m) { return m.bot && m.c === cat; });
    if (!mods.length) continue;
    botHtml += '<div class="lab" style="font-size:11px;opacity:.7">' + cat + '</div>';
    for (var mi = 0; mi < mods.length; mi++) {
      var m = mods[mi];
      botHtml += chk(BotMods, m.k, m.n, m.d);
      /* 슬라이더는 label 밖에 둔다 (label 안이면 클릭이 체크박스로 샌다) */
      if (m.s) {
        botHtml += '<div class="modset">';
        for (var si = 0; si < m.s.length; si++) {
          var s = m.s[si], sid = 'bs_' + s.k;
          sliders.push({ id: sid, k: s.k, st: s.st, u: s.u });
          botHtml += '<div class="slider" style="margin:0"><span style="font-size:10.5px">' + s.n + '</span>' +
            '<input type="range" id="' + sid + '" min="' + s.min + '" max="' + s.max + '" step="' + s.st +
            '" value="' + BotMods[s.k] + '"><span id="' + sid + '_l" style="font-size:10.5px;min-width:44px;text-align:right">' +
            (s.st < 1 ? BotMods[s.k].toFixed(2) : Math.round(BotMods[s.k])) + s.u + '</span></div>';
        }
        botHtml += '</div>';
      }
    }
  }
  var masterIdx = rows.length + 3;   // allowHack/Hacker/Anchor 다음이 BotMods.on

  var h = '<h2>모드 설정</h2>' +
    '<div class="sub">AI 대전 · 온라인 대전 모두 적용됩니다</div>' +

    '<div class="lab">내 모드 <span>사용 허용</span></div>' +
    chk(RoomCfg, 'allowHack', '핵쓰기 클라이언트 <kbd>Z</kbd>',
      HACK_MODULES.filter(function (m) { return !m.botOnly; }).length + '개 모듈 · 전투 / 이동 / 플레이어 / 시각 / 기타') +
    chk(RoomCfg, 'allowHacker', '해커 모드 <kbd>X</kbd>',
      '상대 체력 · 무기 · 아이템 훔쳐보기 / 체력 흡수 · 혼란 주기') +
    chk(RoomCfg, 'allowAnchor', '리스폰 정박기',
      '핫바 4번 · 우클릭으로 설치 · 죽으면 그 자리에서 부활 (4회)') +

    '<div class="lab">AI 모드 <span>상대에게 끼워주기</span></div>' +
    chk(BotMods, 'on', '★ AI 핵 활성화',
      '이걸 켜야 아래 항목이 AI 에게 적용됩니다 (오프라인 대전 전용)') +
    botHtml +

    '<div class="hint">AI 에게 핵을 끼워주면 <b>진짜 핵쟁이랑 붙는 기분</b>을 낼 수 있습니다.<br>' +
    '내 모드는 게임 중 <b>Z</b> (핵 클라이언트) · <b>X</b> (해커) 키로 창을 엽니다.</div>' +
    '<button class="mcbtn" id="btnModBack" style="margin-top:16px">돌아가기</button>';
  showUI(h, true);
  rows.forEach(function (r) {
    var el = document.getElementById(r.id);
    if (!el) return;
    el.onchange = function () {
      r.o[r.k] = this.checked; Snd.click();
      if (this.checked) this.parentNode.classList.add('on');
      else this.parentNode.classList.remove('on');
      /* 허용을 끄면 이미 켜져 있던 핵도 함께 끈다 */
      if (r.o === RoomCfg && !this.checked) {
        if (r.k === 'allowHack') Hacks.on = false;
        if (r.k === 'allowHacker') Hacker.on = false;
      }
      /* AI 모듈을 켜면 AI 핵 자체도 켠다 */
      if (r.o === BotMods && r.k !== 'on' && this.checked && !BotMods.on) {
        BotMods.on = true;
        var mr = rows[masterIdx];
        var master = mr && document.getElementById(mr.id);
        if (master) { master.checked = true; master.parentNode.classList.add('on'); }
      }
    };
  });
  sliders.forEach(function (s) {
    var el = document.getElementById(s.id);
    if (!el) return;
    el.oninput = function () {
      BotMods[s.k] = parseFloat(this.value);
      var l = document.getElementById(s.id + '_l');
      if (l) l.textContent = (s.st < 1 ? BotMods[s.k].toFixed(2) : Math.round(BotMods[s.k])) + s.u;
    };
  });
  $('#btnModBack').onclick = function () { Snd.click(); back(); };
}

function requestLock() {
  var cv = document.getElementById('gl');
  if (cv.requestPointerLock) cv.requestPointerLock();
}

function bindInput() {
  var cv = document.getElementById('gl');
  var lastW = 0;

  document.addEventListener('keydown', function (e) {
    if (e.code === 'F5' || e.code === 'F3' || e.code === 'Tab') e.preventDefault();
    if (Input.keys[e.code]) { return; }
    Input.keys[e.code] = true;
    if (e.code === 'Escape') {
      if (Game.state !== 'menu' && Game.state !== 'matchend') {
        if (Game.paused) resumeGame(); else showPause();
      }
      return;
    }
    if (Game.state === 'menu' || Game.state === 'matchend' || Game.paused) return;
    if (e.code === 'F3') { Game.settings.debug = !Game.settings.debug; }
    if (e.code === 'F5') { Render.thirdPerson = (Render.thirdPerson + 1) % 2; }
    if (e.code === 'KeyW') {
      var now = performance.now();
      if (now - lastW < 260) Input.sprintTap = true;
      lastW = now;
    }
    if (e.code === 'KeyR') { var pp = Game.player; if (Game.state === 'play' && !pp.dead && pp.gapples > 0) { pp.slot = 1; pp.startUse(); Game.itemNameTime = 30; } }
    if (e.code === 'KeyQ') Game.tryBeam();
    if (e.code === 'KeyF') Game.tryRage();
    if (e.code === 'KeyZ' && RoomCfg.allowHack) toggleHackPanel();
    if (e.code === 'KeyX' && RoomCfg.allowHacker) toggleHackerPanel();
    var n = e.code.match(/^Digit([1-9])$/);
    if (n) selectSlot(parseInt(n[1], 10) - 1);
  });
  document.addEventListener('keyup', function (e) {
    Input.keys[e.code] = false;
    if (e.code === 'KeyR' && Game.player && Game.player.eating) Game.player.stopUse();
  });

  cv.addEventListener('mousedown', function (e) {
    if (!Input.locked) {
      if (_hackPanelOpen || _hackerPanelOpen) {
        if (_hackPanelOpen) toggleHackPanel();
        if (_hackerPanelOpen) toggleHackerPanel();
        return;
      }
      if (Game.state !== 'menu' && !Game.paused) requestLock();
      return;
    }
    Input.mouseDown[e.button] = true;
    if (e.button === 0) Game.doAttack();
    if (e.button === 2) Game.player.startUse();
    e.preventDefault();
  });
  document.addEventListener('mouseup', function (e) {
    Input.mouseDown[e.button] = false;
    if (e.button === 2) Game.player.stopUse();
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('mousemove', function (e) {
    if (!Input.locked) return;
    var p = Game.player;
    if (!p || p.dead) return;
    var f = Game.settings.sens * 0.6 + 0.2, f1 = f * f * f * 8;
    p.yaw = wrapDeg(p.yaw + e.movementX * f1 * 0.15);
    p.pitch = clamp(p.pitch + e.movementY * f1 * 0.15 * (Game.settings.invY ? -1 : 1), -90, 90);
  });
  document.addEventListener('wheel', function (e) {
    if (!Input.locked) return;
    var d = e.deltaY > 0 ? 1 : -1;
    selectSlot((Game.player.slot + d + 9) % 9);
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('pointerlockchange', function () {
    Input.locked = (document.pointerLockElement === cv);
    if (!Input.locked) {
      Input.mouseDown[0] = Input.mouseDown[2] = false;
      if (Game.player) Game.player.stopUse();
      if (Game.state !== 'menu' && Game.state !== 'matchend' && !Game.paused &&
          !_hackPanelOpen && !_hackerPanelOpen) showPause();
    }
  });
  window.addEventListener('blur', function () {
    Input.keys = {}; Input.mouseDown = [false, false, false];
  });
  window.addEventListener('resize', function () { Render.resize(cv); HUD.resize(); });
}

function selectSlot(i) {
  var p = Game.player;
  if (p.slot === i) return;
  var maxSlot = (RoomCfg.allowAnchor && p.anchorCharges > 0) ? 3 : 2;
  if (i > maxSlot) return;
  p.slot = i; p.stopUse();
  Game.equipAnim = 1; Game.itemNameTime = 40;
  if (Game.settings.sound) Snd.pop();
}
