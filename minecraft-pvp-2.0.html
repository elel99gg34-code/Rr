/* ---------------- 전투 이벤트 ---------------- */
Game.onHit = function (a, t, res) {
  var mine = (a === this.player);
  var hx = t.x, hy = t.y + 1.1, hz = t.z;
  if (res.applied === -2) return;                 // 방패 차단은 onBlockedHit 에서 처리
  if (res.applied < 0) {
    /* 무적시간에 막힘 */
    if (this.settings.dmgNum) HUD.dmgTexts.push({ x: hx, y: hy, z: hz, s: '무적', col: '#8a8a8a', t: 0, life: 0.7, crit: false });
    if (mine) Snd.miss();
    return;
  }
  if (res.crit) {
    burstCrit(t.x, t.y + 1.0, t.z, 14);
    spawnRing(t.x, t.y + 1.0, t.z, 0.3, 2.2, 8, [1, 0.86, 0.35]);
    if (this.settings.sound) Snd.crit();
    this.addShake(mine ? 0.34 : 0.5); this.stopHit(70);
    if (mine) HUD.doFlash([255, 220, 120], 0.10);
  } else {
    burstDamage(t.x, t.y + 1.0, t.z, 7);
    if (this.settings.sound) Snd.hit();
    this.addShake(mine ? 0.14 : 0.30); this.stopHit(mine ? 28 : 38);
  }
  if (!mine) HUD.doFlash([255, 40, 30], 0.16);
  /* 첫 피 / 연타 콜아웃 */
  if (!this.firstBlood && res.applied > 0) {
    this.firstBlood = true;
    HUD.addCallout('FIRST BLOOD', mine ? '선제공격 성공' : '선제공격 당함', mine ? '#7dff9b' : '#ff5c5c', 18);
    Snd.callout(mine ? 1 : 0.7);
  }
  if (mine && a.stats.combo >= 3 && res.applied > 0) {
    if (a.stats.combo === 3) HUD.addCallout('3 COMBO', '', '#ffd93d', 16);
    else if (a.stats.combo === 5) HUD.addCallout('5 COMBO!', '완벽한 콤보', '#ff8f1a', 18);
    else if (a.stats.combo >= 7) HUD.addCallout(a.stats.combo + ' COMBO!!', '압도적', '#ff5c1a', 20);
    if (this.settings.sound) Snd.combo(a.stats.combo);
  }
  if (res.sweep) {
    if (this.settings.sound) Snd.sweep();
    /* 공격자 앞쪽 부채꼴로 휩쓸기 잔상 */
    var yr = a.yaw * DEG, fx = -Math.sin(yr), fz = Math.cos(yr);
    for (var i = 0; i < 9; i++) {
      var k = (i / 8 - 0.5) * 1.7;
      var ox = fx * 1.7 + fz * k, oz = fz * 1.7 - fx * k;
      spawnParticle(a.x + ox, a.y + 1.05, a.z + oz, ox * 0.03, 0.005, oz * 0.03,
        0.30, 5, [1, 1, 1], T.SWEEP, 0.001);
    }
  }
  var col = res.crit ? '#ffd93d' : (mine ? '#ffffff' : '#ff8f8f');
  var s = res.applied.toFixed(1) + (res.crit ? ' ✦' : '');
  if (this.settings.dmgNum) HUD.dmgTexts.push({ x: hx, y: hy, z: hz, s: s, col: col, t: 0, life: 1.0, crit: res.crit });
  if (mine) {
    HUD.hitMark = 8;
    var extra = [];
    if (res.crit) extra.push('크리티컬');
    if (res.sprintKb) extra.push('스프린트 넉백');
    if (res.sweep) extra.push('휩쓸기');
    if (COMBAT.mode === 19 && res.cooled < 0.9) extra.push('쿨다운 ' + Math.round(res.cooled * 100) + '%');
    this.log('▸ ' + res.applied.toFixed(1) + ' 피해' + (extra.length ? '  (' + extra.join(', ') + ')' : '') +
      (a.stats.combo > 1 ? '   ' + a.stats.combo + '연타' : ''), res.crit ? '#ffd93d' : '#b8f5c0');
  } else {
    this.log('◂ ' + res.applied.toFixed(1) + ' 피해를 입음' + (res.crit ? '  (크리티컬)' : ''), '#ffb3b3');
  }
};
Game.onMiss = function (a) { if (a === this.player && COMBAT.mode === 19) this.log('빗나감 — 쿨다운 초기화', '#8a8a8a'); };
Game.onBlockedHit = function (target, attacker) {
  if (target === this.player) this.log('방패로 막았다!', '#7fd6ff');
  else this.log('상대가 방패로 막았다', '#8ab4c8');
  if (this.settings.dmgNum) HUD.dmgTexts.push({ x: target.x, y: target.y + 1.2, z: target.z, s: '막힘', col: '#7fd6ff', t: 0, life: 0.8, crit: false });
};

/* =====================================================================
   머더 미스터리 (4인)
   역할 : 살인자 1 · 탐정 1 · 시민 2
   ===================================================================== */
var MM = {
  timer: 0, speedMul: 1.0,
  roles: [],            // 엔티티와 같은 순서 : 'murderer' | 'detective' | 'innocent'
  revealed: [],         // 살인자가 정체를 드러냈는지
  bowOwner: -1,         // 활을 들고 있는 엔티티 index (-1 = 바닥)
  bowDrop: null,        // { x, y, z } 떨어진 활
  over: false, winner: ''
};
var MM_NAMES = ['나', '민준', '서연', '지호'];
var MM_COLORS = ['#6fd0ff', '#ffb35c', '#c9a6ff', '#7dff9b'];

Game.mmIndexOf = function (e) { return this.entities.indexOf(e); };
Game.mmRoleOf = function (e) { var i = this.mmIndexOf(e); return i < 0 ? '' : MM.roles[i]; };
Game.mmIsMurderer = function (e) { return this.mmRoleOf(e) === 'murderer'; };
Game.mmHasBow = function (e) { return MM.bowOwner === this.mmIndexOf(e); };

Game.mmSetup = function () {
  var n = this.entities.length;
  MM.roles = new Array(n).fill('innocent');
  MM.revealed = new Array(n).fill(false);
  MM.over = false; MM.winner = '';
  MM.timer = 120 * 20;                 // 2분 생존하면 시민 승리
  /* 역할 무작위 배정 */
  var idx = [];
  for (var i = 0; i < n; i++) idx.push(i);
  for (var s = idx.length - 1; s > 0; s--) { var j = Math.floor(Math.random() * (s + 1)); var t = idx[s]; idx[s] = idx[j]; idx[j] = t; }
  MM.roles[idx[0]] = 'murderer';
  MM.roles[idx[1]] = 'detective';
  MM.bowOwner = idx[1];
  MM.bowDrop = null;
  arrows.length = 0;

  var myRole = MM.roles[0];
  var txtRole = { murderer: '살인자', detective: '탐정', innocent: '시민' }[myRole];
  var col = { murderer: '#ff5c5c', detective: '#6fd0ff', innocent: '#7dff9b' }[myRole];
  var sub = { murderer: '들키지 말고 전원을 처치하세요 (좌클릭 즉사)',
              detective: '활로 살인자를 쏘세요 (우클릭 발사)',
              innocent: '도망치세요 · 탐정이 죽으면 활을 주울 수 있습니다' }[myRole];
  this.center('당신은 ' + txtRole, sub, 26, col, 90);
  this.log('━━ 머더 미스터리 시작 ━━  당신의 역할: ' + txtRole, col);
  this.log('생존자 ' + n + '명 · 살인자 1명이 섞여 있습니다', '#b8bdcd');
};

Game.mmAlive = function (role) {
  var n = 0;
  for (var i = 0; i < this.entities.length; i++)
    if (!this.entities[i].dead && (!role || MM.roles[i] === role)) n++;
  return n;
};
/* 살인자 외 생존자 수 */
Game.mmInnocentsAlive = function () {
  var n = 0;
  for (var i = 0; i < this.entities.length; i++)
    if (!this.entities[i].dead && MM.roles[i] !== 'murderer') n++;
  return n;
};
Game.mmCheckWin = function () {
  if (MM.over || this.state !== 'play') return;
  if (this.mmAlive('murderer') === 0) { this.mmEnd('innocent'); return; }
  if (this.mmInnocentsAlive() === 0) { this.mmEnd('murderer'); return; }
  if (MM.timer > 0) {
    MM.timer--;
    if (MM.timer === 0) { this.mmEnd('innocent'); return; }
    if (MM.timer === 30 * 20) this.log('30초 남았습니다 — 버티면 시민 승리', '#ffd93d');
  }
};
Game.mmEnd = function (side) {
  MM.over = true; MM.winner = side;
  var iAmMurderer = MM.roles[0] === 'murderer';
  var iWon = (side === 'murderer') === iAmMurderer;
  this.center(side === 'murderer' ? '살인자 승리' : '시민 승리',
    iWon ? '당신의 승리입니다' : '당신은 패배했습니다',
    28, side === 'murderer' ? '#ff5c5c' : '#7dff9b', 100);
  this.log(side === 'murderer' ? '살인자가 모두를 처치했습니다' : '살인자가 처단되었습니다',
    side === 'murderer' ? '#ff5c5c' : '#7dff9b');
  if (this.settings.sound) { if (iWon) Snd.bell(1.25); else Snd.low(); }
  this.endRound(iWon ? 0 : 1);
};
/* 살인자가 공격하면 정체가 드러난다 */
Game.mmReveal = function (e) {
  var i = this.mmIndexOf(e);
  if (i < 0 || MM.revealed[i]) return;
  MM.revealed[i] = true;
  this.log('⚠ ' + e.name + ' 님이 살인자입니다!', '#ff5c5c');
  HUD.addCallout('살인자 발각', e.name, '#ff5c5c', 18);
  Snd.callout(0.6);
};

/* ---------------- 화살 ---------------- */
var arrows = [];
function Arrow(owner, x, y, z, dx, dy, dz) {
  this.o = owner;
  this.x = this.px = x; this.y = this.py = y; this.z = this.pz = z;
  var sp = 2.1;
  this.vx = dx * sp; this.vy = dy * sp; this.vz = dz * sp;
  this.life = 100; this.dead = false;
}
Arrow.prototype.tick = function () {
  this.px = this.x; this.py = this.y; this.pz = this.z;
  this.x += this.vx; this.y += this.vy; this.z += this.vz;
  this.vy -= 0.035; this.vx *= 0.995; this.vz *= 0.995;
  spawnParticle(this.x, this.y, this.z, 0, 0, 0, 0.05, 5, [1, 1, 0.85], T.GLOWORB, 0, true);
  if (isSolidAt(Math.floor(this.x), Math.floor(this.y), Math.floor(this.z))) { this.dead = true; Snd.hit(); return; }
  for (var i = 0; i < Game.entities.length; i++) {
    var t = Game.entities[i];
    if (t === this.o || t.dead) continue;
    if (segHitsAABB(this.px, this.py, this.pz, this.x - this.px, this.y - this.py, this.z - this.pz, t.bb(), 0.22)) {
      this.dead = true;
      Snd.crit();
      spawnRing(t.x, t.y + 1.0, t.z, 0.3, 2.0, 10, [1, 0.9, 0.4]);
      t.hurt(1000, this.o, { bypassArmor: true, cause: 'arrow' });
      return;
    }
  }
  if (--this.life <= 0 || this.y < VOID_Y) this.dead = true;
};
function tickArrows() {
  for (var i = arrows.length - 1; i >= 0; i--) { arrows[i].tick(); if (arrows[i].dead) arrows.splice(i, 1); }
}
Entity.prototype.shootBow = function () {
  if (this.dead || !Game.mmHasBow(this) || this.bowCool > 0) return false;
  this.bowCool = 22;
  this.swingArm();
  var lv = this.lookVec();
  arrows.push(new Arrow(this, this.x + lv[0] * 0.6, this.eyeY() - 0.1, this.z + lv[2] * 0.6, lv[0], lv[1], lv[2]));
  Snd.beam();
  return true;
};
/* 탐정이 죽으면 활을 떨군다 → 시민이 주울 수 있다 */
Game.mmDropBow = function (e) {
  var i = this.mmIndexOf(e);
  if (MM.bowOwner !== i) return;
  MM.bowOwner = -1;
  MM.bowDrop = { x: e.x, y: e.y + 0.4, z: e.z };
  this.log('활이 바닥에 떨어졌습니다 — 가까이 가면 줍습니다', '#ffd93d');
};
Game.mmTickBow = function () {
  if (!MM.bowDrop) return;
  var d = MM.bowDrop;
  spawnParticle(d.x, d.y + 0.3 + Math.sin(Game.now * 0.004) * 0.1, d.z, 0, 0.004, 0,
    0.09, 8, [1, 0.9, 0.35], T.GLOWORB, 0, true);
  for (var i = 0; i < this.entities.length; i++) {
    var e = this.entities[i];
    if (e.dead || MM.roles[i] === 'murderer') continue;
    var dx = e.x - d.x, dz = e.z - d.z, dy = e.y - d.y;
    if (dx * dx + dy * dy + dz * dz < 1.6) {
      MM.bowOwner = i; MM.bowDrop = null;
      Snd.equip();
      this.log(e.name + ' 님이 활을 주웠습니다', '#ffd93d');
      if (e === this.player) HUD.addCallout('활 획득', '우클릭으로 발사', '#ffd93d', 14);
      return;
    }
  }
};

/* =====================================================================
   배드워즈 진행
   ===================================================================== */
var BW = {
  beds: [true, true],
  res: [{ iron: 0, gold: 0, emerald: 0 }, { iron: 0, gold: 0, emerald: 0 }],
  gen: [0, 0], emGen: 0, respawn: [0, 0], upg: [{}, {}]
};
Game.bwReset = function () {
  BW.beds = [true, true];
  BW.res = [{ iron: 0, gold: 0, emerald: 0 }, { iron: 0, gold: 0, emerald: 0 }];
  BW.gen = [0, 0]; BW.emGen = 0; BW.respawn = [0, 0];
  BW.upg = [{}, {}];
};
Game.bwTeamOf = function (e) { return e === this.player ? 0 : 1; };

/* 자원 생성기 */
Game.bwTickGen = function () {
  for (var t = 0; t < 2; t++) {
    if (!BW.beds[t] && this.bwEliminated(t)) continue;
    BW.gen[t]++;
    var isle = BW_ISLE[t];
    if (BW.gen[t] % 26 === 0) {                       // 철 1.3초
      BW.res[t].iron += 1;
      if (isle) this.bwGenFx(isle, [0.85, 0.85, 0.9]);
    }
    if (BW.gen[t] % 150 === 0) {                      // 금 7.5초
      BW.res[t].gold += 1;
      if (isle) this.bwGenFx(isle, [1, 0.82, 0.25]);
    }
  }
  BW.emGen++;
  if (BW.emGen % 400 === 0) {                         // 에메랄드 20초 (가운데)
    BW.res[0].emerald += 1; BW.res[1].emerald += 1;
    spawnRing(CX + 0.5, SURF + 2, CZ + 0.5, 0.4, 3.0, 12, [0.3, 1, 0.5]);
    if (this.state === 'play') this.log('가운데 섬에서 에메랄드가 생성됐습니다', '#6cff9c');
  }
};
Game.bwGenFx = function (isle, col) {
  spawnParticle(isle.genX + 0.5, SURF + 2.6, isle.genZ + 0.5,
    rnd(-.02, .02), rnd(0.02, 0.06), rnd(-.02, .02), 0.12, 16, col, T.GLOWORB, -0.002, true);
};
Game.bwEliminated = function (t) {
  var e = (t === 0) ? this.player : this.bot;
  return !BW.beds[t] && e.dead;
};

/* 침대가 깨졌는지 검사 — 매 틱 값싸게 확인 */
Game.bwCheckBeds = function () {
  for (var t = 0; t < 2; t++) {
    if (!BW.beds[t]) continue;
    var i = BW_ISLE[t];
    if (!i) continue;
    var alive = getBlock(i.bedX, SURF + 1, i.bedZ) === i.bedBlock ||
                getBlock(i.bedX2, SURF + 1, i.bedZ) === i.bedBlock;
    if (!alive) this.bwBedBroken(t);
  }
};
Game.bwBedBroken = function (t) {
  if (!BW.beds[t]) return;
  BW.beds[t] = false;
  var i = BW_ISLE[t];
  /* 남은 침대 조각도 제거 */
  editBlock(i.bedX, SURF + 1, i.bedZ, 0);
  editBlock(i.bedX2, SURF + 1, i.bedZ, 0);
  var mine = (t === 0);
  Snd.maceSmash(2);
  HUD.doFlash(mine ? [255, 60, 60] : [120, 255, 160], 0.45);
  this.addShake(1.0);
  spawnRing(i.bedX + 0.5, SURF + 1.5, i.bedZ + 0.5, 0.5, 6, 16, mine ? [1, 0.3, 0.3] : [0.4, 1, 0.6]);
  for (var k = 0; k < 40; k++) {
    var a = Math.random() * TAU, sp = rnd(0.1, 0.35);
    spawnParticle(i.bedX + 0.5, SURF + 1.5, i.bedZ + 0.5, Math.cos(a) * sp, rnd(0.06, 0.3), Math.sin(a) * sp,
      rnd(0.1, 0.22), rndInt(12, 26), mine ? [1, 0.3, 0.3] : [0.4, 1, 0.6], T.GLOWORB, 0.01, true);
  }
  this.center(mine ? '침대 파괴됨!' : '상대 침대 파괴!',
    mine ? '이제 죽으면 부활할 수 없습니다' : '이제 상대를 죽이면 승리합니다',
    22, mine ? '#ff5c5c' : '#7dff9b', 70);
  this.log((mine ? '내' : '상대') + ' 침대가 파괴되었습니다', mine ? '#ff5c5c' : '#7dff9b');
  if (this.online && Net.connected && !mine) Net.send({ t: 'bed' });
};

/* 배드워즈 사망 처리 : 침대가 있으면 부활, 없으면 패배 */
Game.bwHandleDeath = function (e) {
  var t = this.bwTeamOf(e);
  if (BW.beds[t]) {
    BW.respawn[t] = 100;                              // 5초
    this.log(e.name + ' 님이 5초 뒤 부활합니다', '#bfe9ff');
    return true;                                      // 라운드는 계속
  }
  this.log(e.name + ' 님이 탈락했습니다 (침대 없음)', '#ff5c5c');
  return false;                                       // 최종 사망 → 승패
};
Game.bwTickRespawn = function () {
  for (var t = 0; t < 2; t++) {
    if (BW.respawn[t] <= 0) continue;
    BW.respawn[t]--;
    if (BW.respawn[t] > 0) continue;
    var e = (t === 0) ? this.player : this.bot;
    var sp = SPAWNS[t] || SPAWNS[0];
    e.reset(sp);
    /* 배드워즈는 라운드마다 인벤토리를 유지하지 않고 기본 지급 */
    e.blocks = Math.max(e.blocks, 16);
    spawnRing(e.x, e.y + 0.1, e.z, 0.3, 2.4, 10, [0.5, 0.9, 1]);
    Snd.bell(1.1);
    this.log(e.name + ' 님이 부활했습니다', '#bfe9ff');
  }
};

Game.onDeath = function (e, killer, cause) {
  var name = e.name;
  if (cause === 'lava') this.log(name + ' 님이 용암 바다에 빠졌습니다', '#ff7a2b');
  else if (cause === 'pearl') this.log(name + ' 님이 엔더 진주 반동으로 쓰러졌습니다', '#5fe8d0');
  else if (cause === 'void') this.log(name + ' 님이 세상 밖으로 떨어졌습니다', '#ff9f43');
  else if (cause === 'fall') this.log(name + ' 님이 추락사했습니다', '#ff9f43');
  else this.log(name + ' 님이 ' + (killer ? killer.name : '???') + ' 에게 죽었습니다', '#ff6b6b');
  for (var i = 0; i < 26; i++)
    spawnParticle(e.x + rnd(-.3, .3), e.y + rnd(.2, 1.6), e.z + rnd(-.3, .3),
      rnd(-.1, .1), rnd(.05, .25), rnd(-.1, .1), rnd(.1, .2), rnd(14, 26), [.75, .1, .1], T.SMOKE, 0.03);
  spawnRing(e.x, e.y + 0.1, e.z, 0.5, 6.5, 14, [1, 0.25, 0.1]);
  for (var b2 = 0; b2 < 30; b2++) {
    var ba2 = Math.random() * TAU, sp2 = rnd(0.1, 0.36);
    spawnParticle(e.x, e.y + rnd(0.2, 1.6), e.z, Math.cos(ba2) * sp2, rnd(0.05, 0.3), Math.sin(ba2) * sp2,
      rnd(0.12, 0.26), rndInt(12, 26), [1, rnd(0.2, 0.5), 0.1], T.GLOWORB, 0.012, true);
  }
  if (this.state === 'play') {
    if (this.online && e === this.player) Net.send({ t: 'd' });
    /* --- 머더 : 승패는 mmCheckWin 이 판정한다 --- */
    if (this.mode === 'murder') {
      this.mmDropBow(e);
      if (this.settings.sound) Snd.death();
      this.addShake(0.6);
      this.mmCheckWin();
      return;
    }
    /* --- 배드워즈 : 침대가 살아 있으면 부활하고 계속 --- */
    if (this.mode === 'bedwars' && this.bwHandleDeath(e)) {
      this.addShake(0.5);
      if (this.settings.sound) Snd.death();
      return;
    }
    /* --- K.O. 시네마틱 --- */
    var iWon = (e !== this.player);
    this.koCam.active = true; this.koCam.target = e; this.koCam.t = 0;
    this.koCam.baseAng = Math.random() * TAU;
    this.timeScale = 0.30;
    this.addShake(1.3);
    HUD.doFlash([255, 255, 255], 0.55);
    var flawless = iWon && this.player.health >= this.player.maxHealth - 0.01;
    this.cinema.mode = 2; this.cinema.t = 0; this.cinema.dur = 2.6;
    this.cinema.text = cause === 'lava' ? 'BURNED!' : (flawless ? 'PERFECT!' : 'K.O.');
    this.cinema.sub = iWon ? name + ' 격파' : '패배...';
    if (this.settings.sound) Snd.ko();
    this.endRound(iWon ? 0 : 1);
  }
};

/* 상대가 나를 때렸다 → 무적시간·방어구는 내가 최종 판정 */
Game.netTakeHit = function (m) {
  var p = this.player, b = this.bot;

  if (applied >= 0 && m.kb > 0) {
    var f = (m.ya || b.yaw) * DEG;
    p.vx += -Math.sin(f) * m.kb * 0.5; p.vy += 0.1; p.vz += Math.cos(f) * m.kb * 0.5;
  }
  this.onHit(b, p, { dmg: m.d, applied: applied, crit: !!m.c, sweep: !!m.sw, cooled: m.co || 1, sprintKb: m.kb > 0 });
  if (p.dead) Net.send({ t: 'd' });
};
Game.netRemoteDied = function () {

Game.netRemoteBeam = function (m) {

Game.netBroadcastRound = function (act) {
  if (!Net.connected || !Net.isHost) return;

    map: this.map.id, kit: keyOf(KITS, this.kit), cmb: COMBAT.mode, bo: this.settings.bo,
    ah: RoomCfg.allowHack ? 1 : 0, ahk: RoomCfg.allowHacker ? 1 : 0, aa: RoomCfg.allowAnchor ? 1 : 0, wn: RoomCfg.winsNeeded });
};
Game.netRound = function (m) {
  if (Net.isHost) return;
  /* 방장 설정을 그대로 따른다 */
  for (var i = 0; i < MAPS.length; i++) if (MAPS[i].id === m.map) this.map = MAPS[i];
  if (KITS[m.kit]) this.kit = KITS[m.kit];
  COMBAT.mode = m.cmb; this.settings.bo = m.bo;
  if (m.ah !== undefined) RoomCfg.allowHack = !!m.ah;
  if (m.ahk !== undefined) RoomCfg.allowHacker = !!m.ahk;
  if (m.aa !== undefined) RoomCfg.allowAnchor = !!m.aa;
  if (m.wn !== undefined) { RoomCfg.winsNeeded = m.wn; this.settings.bo = m.wn; }
  var wantM = this.mode === 'bedwars' ? 'bedwars' : this.map;
  if (this.builtMap !== wantM) {
    generateArena(20250816 + MAPS.indexOf(this.map) * 977, this.map);
    Render.worldMesh = buildWorldMesh(); Render.rebuildMap(); this.builtMap = wantM;
  }
  if (m.a === 'start') {
    this.round = m.rd; this.score = [m.s1, m.s0];    // 점수는 시점 반전
    this.startRound();
  } else if (m.a === 'end') {
    this.endMatch();
  }
};

/* ---------------- 라운드 진행 ---------------- */
Game.startMatch = function () {
  var want = this.mode === 'bedwars' ? 'bedwars' : this.map;
  if (this.builtMap !== want) {
    generateArena(20250816 + MAPS.indexOf(this.map) * 977, this.map);
    Render.worldMesh = buildWorldMesh();
    Render.rebuildMap();
    this.builtMap = want;
  }
  if (this.mode === 'bedwars') this.bwReset();
  this.score = [0, 0]; this.round = 1;
  var blank = function () { return { hits: 0, swings: 0, crits: 0, dmgDealt: 0, dmgTaken: 0, combo: 0, maxCombo: 0,
    blocked: 0, gapples: 0, beams: 0, rages: 0, beamHits: 0, pearls: 0 }; };
  this.player.stats = blank(); this.bot.stats = blank();
  this.logLines.length = 0;
  this.startRound();
};
Game.startRound = function () {
  particles.length = 0; HUD.dmgTexts.length = 0; rings.length = 0; beams.length = 0; pearls.length = 0; winds.length = 0; arrows.length = 0;
  HUD.callouts.length = 0; HUD.comboN = 0; HUD.comboT = 0;
  this.shake = 0; this.hitStop = 0; this.timeScale = 1; this.firstBlood = false;
  this.koCam.active = false; this.koCam.target = null;
  this.cinema.mode = 1; this.cinema.t = 0; this.cinema.dur = 2.5;
  if (this.player && this.player._trail) this.player._trail.clear();
  if (this.bot && this.bot._trail) this.bot._trail.clear();
  if (Render.handTrail) Render.handTrail.clear();
  var seat = this.online ? this.netSeat : 0;
  var a = SPAWNS[seat], b = SPAWNS[1 - seat];
  this.player.setKit(this.kit); this.bot.setKit(this.kit);
  this.player.reset(a); this.bot.reset(b);
  if (!this.online) this.ai.setDiff(this.diff);
  this.ai.hist.length = 0; this.ai.critPending = false; this.ai.blockTimer = 0; this.ai.healMode = false;
  this.ai.ultArmed = false; this.ai.ultTimer = 0; this.ai.beamCool = 0;
  this.bot.netQueue = [];
  if (this.mode === 'murder') {
    this.entities = [this.player, this.bot].concat(this.extraBots || []);
    this.player.name = MM_NAMES[0]; this.bot.name = MM_NAMES[1];
    /* 넓게 흩어져 시작 */
    for (var mi = 0; mi < this.entities.length; mi++) {
      var ang = (mi / this.entities.length) * TAU + 0.4;
      var rr = 10.5;
      var me2 = this.entities[mi];
      me2.setKit(this.kit);
      me2.reset({ x: CX + 0.5 + Math.cos(ang) * rr, y: SURF + 1, z: CZ + 0.5 + Math.sin(ang) * rr,
                  yaw: -ang / DEG + 90 });
      me2.gapples = 0; me2.pearls = 0; me2.blocks = 0;
      me2.winds = 0; me2.fireworks = 0; me2.hasMace = false; me2.hasElytra = false;
    }
    for (var ai2 = 0; ai2 < (this.extraAis || []).length; ai2++) this.extraAis[ai2].setDiff(this.diff);
    this.mmSetup();
  } else {
    this.entities = [this.player, this.bot];
  }
  if (this.mode === 'bedwars') {
    this.bwReset();
    this.player.blocks = Math.max(this.player.blocks, 16);
    this.bot.blocks = Math.max(this.bot.blocks, 16);
    Inv.blocks = true;
  }
  this.roundTime = 2000; this.countdown = 72;
  this.state = 'countdown';
  hideUI();
};
Game.endRound = function (winner) {
  if (this.state !== 'play') return;
  this.state = 'roundend'; this.endTimer = 96;
  this.score[winner]++;
  var win = winner === 0;
  var need = this.settings.bo;
  var mp = (this.score[0] === need - 1 || this.score[1] === need - 1) && need > 1;
  var self = this;
  setTimeout(function () {
    if (self.state !== 'roundend') return;
    self.center(win ? '라운드 승리' : '라운드 패배', self.score[0] + ' : ' + self.score[1], 20, win ? '#7dff9b' : '#ff5c5c', 60);
    if (mp && self.score[0] < need && self.score[1] < need) HUD.addCallout('MATCH POINT', '', '#ff8f1a', 18);
  }, 2400);
  if (this.settings.sound) { if (win) Snd.bell(1); else Snd.low(); }
};
Game.nextRound = function () {
  var need = this.settings.bo;
  if (this.score[0] >= need || this.score[1] >= need) { this.endMatch(); return; }
  this.round++;
  this.startRound();
  this.netBroadcastRound('start');
};
Game.endMatch = function () {
  if (this.online && Net.isHost) this.netBroadcastRound('end');
  this.state = 'matchend';
  this.menuCam.x = this.player.x; this.menuCam.z = this.player.z;
  document.exitPointerLock && document.exitPointerLock();
  showResults();
};

/* ---------------- 입력 → 플레이어 ---------------- */
Game.readInput = function () {
  var p = this.player;
  if (p.dead || this.state !== 'play') {
    p.moveForward = 0; p.moveStrafe = 0; p.jumping = false; p.sprinting = false; p.sneaking = false;
    return;
  }
  var f = (Input.down('KeyW') ? 1 : 0) - (Input.down('KeyS') ? 1 : 0);
  var s = (Input.down('KeyA') ? 1 : 0) - (Input.down('KeyD') ? 1 : 0);
  /* 터치 조이스틱 입력을 합친다 */
  if (TouchIn.on && (TouchIn.mx || TouchIn.my)) { f = TouchIn.my; s = -TouchIn.mx; }
  p.moveForward = f; p.moveStrafe = s;
  p.jumping = Input.down('Space') || TouchIn.jump;
  /* Shift/Ctrl 역할은 설정에서 바꿀 수 있다 (기본: Shift=웅크리기, Ctrl=달리기) */
  var kShift = Input.down('ShiftLeft') || Input.down('ShiftRight');
  var kCtrl = Input.down('ControlLeft') || Input.down('ControlRight');
  var wantSneak = this.settings.shiftSprint ? kCtrl : kShift;
  var wantSprint = this.settings.shiftSprint ? kShift : kCtrl;
  p.sneaking = wantSneak || TouchIn.sneak;
  if ((wantSprint || Input.sprintTap || TouchIn.sprint) && f > 0 && !p.sneaking && p.food > 6 && !p.eating && !p.blocking)
    p.sprinting = true;
  if (f <= 0) Input.sprintTap = false;

  var M = modsFor(p);
  if (M) {
    var b = this.bot, alive = b && !b.dead && !p.dead;
    var bd = alive ? Math.sqrt((b.x - p.x) * (b.x - p.x) + ((b.y + 0.9) - p.eyeY()) * ((b.y + 0.9) - p.eyeY()) + (b.z - p.z) * (b.z - p.z)) : 999;

    if (M.fly) {
      p.jumping = false;
      var fv = M.flySpeed;
      if (Input.down('Space')) Hacks._flyVy = fv;
      else if (p.sneaking) Hacks._flyVy = -fv;
      else Hacks._flyVy = 0;
      p.sneaking = false;
    }
    if (M.speed) p.sprinting = true;

    /* SafeWalk : 진행 방향 앞이 허공이면 그 입력을 취소 */
    if (M.safeWalk && p.onGround) {
      var yr = p.yaw * DEG, sy2 = Math.sin(yr), cy2 = Math.cos(yr);
      var wx2 = p.moveStrafe * cy2 + p.moveForward * -sy2;
      var wz2 = p.moveStrafe * sy2 + p.moveForward * cy2;
      var wl = Math.sqrt(wx2 * wx2 + wz2 * wz2);
      if (wl > 0.01 && !groundBelow(p.x + wx2 / wl * 0.7, p.y - 0.1, p.z + wz2 / wl * 0.7, 3))
        { p.moveForward = 0; p.moveStrafe = 0; }
    }

    /* AimAssist : 시야를 상대 쪽으로 끌어당김 */
    if (M.aimAssist && alive && bd < 7) {
      var adx = b.x - p.x, adz = b.z - p.z, adl = Math.sqrt(adx * adx + adz * adz);
      var wantY = Math.atan2(-adx, adz) / DEG;
      var wantP = -Math.atan2((b.y + 1.4) - p.eyeY(), Math.max(0.05, adl)) / DEG;
      var sp2 = clamp(M.aimSpeed / 100, 0.05, 1) * 30;
      p.yaw = approachDeg(p.yaw, wantY, sp2);
      p.pitch = clamp(approachDeg(p.pitch, wantP, sp2 * 0.8), -90, 90);
    }

    /* AutoBlock : 상대가 휘두른 직후 자동으로 막기 */
    if (M.autoBlock && alive && bd < 4.2 && !p.eating) {
      if (b.ticksSinceSwing <= 2) p._abT = 6;
      if (p._abT > 0) { p._abT--; p.blocking = true; }
    }

    /* AutoGapple */
    if (M.autoGapple && !p.eating && p.gapples > 0 && p.regenTicks < 20 &&
        (p.health + p.absorption) <= M.gappleHp) { p.slot = 1; p.startUse(); }

    /* AutoUlt */
    if (M.autoUlt && !p.eating && alive) {
      if (p.canRage()) p.castRage();
      else if (p.ult >= BEAM_COST && p.beamCool === 0 && bd < 20) p.castBeam();
    }

    var cd19 = COMBAT.mode === 19;
    var cpsOk = cd19 ? p.attackStrength(0.5) >= 0.92 : p.ticksSinceSwing >= Math.max(1, Math.round(20 / M.cps));
    /* KillAura */
    if (M.killAura && alive && bd <= Math.max(M.reach ? M.reachDist : 3.0, M.auraRange) && cpsOk) this.doAttack();
    /* TriggerBot : 조준선에 들어왔을 때만 */
    else if (M.triggerBot && alive && cpsOk &&
             rayHitsEntity(p, b, M.reach ? M.reachDist : 3.0) >= 0 && !p.blocking && !p.eating) this.doAttack();
    /* AutoClicker */
    else if (M.autoAtk && Input.mouseDown[0] && !p.blocking && !p.eating && cpsOk) this.doAttack();
  }

  /* 블록 : 우클릭을 누르고 있으면 계속 설치 (다리 놓기) */
  if (invAt(p.slot) === 'blocks' && (Input.mouseDown[2] || TouchIn.useHeld) && p.placeCool === 0) {
    if (p.placeBlock()) p.placeCool = 4;
  }

  /* 터치 : 공격 버튼을 누르고 있으면 쿨다운이 찰 때마다 자동으로 휘두른다 */
  if (TouchIn.attackHeld && !p.blocking && !p.eating &&
      (COMBAT.mode === 19 ? p.attackStrength(0.5) >= 0.98 : p.ticksSinceSwing >= 3)) this.doAttack();

  /* 자동 공격 옵션 */
  if (!M && this.settings.autoAtk && Input.mouseDown[0] && !p.blocking && !p.eating) {
    if (COMBAT.mode === 19 ? p.attackStrength(0.5) >= 0.98 : p.ticksSinceSwing >= 2) this.doAttack();
  }
};
Game.tryBeam = function () {
  var p = this.player;
  if (this.state !== 'play' || p.dead) return;
  if (!p.canBeam()) {
    if (p.ult < BEAM_COST) { this.log('궁극 게이지 부족 (' + Math.floor(p.ult) + '/' + BEAM_COST + ')', '#8a8a8a'); Snd.miss(); }
    return;
  }
  if (p.eating || p.blocking) p.stopUse();
  p.castBeam();
};
Game.tryRage = function () {
  var p = this.player;
  if (this.state !== 'play' || p.dead) return;
  if (!p.canRage()) {
    if (p.rageTicks <= 0) { this.log('격노 게이지 부족 (' + Math.floor(p.ult) + '/100)', '#8a8a8a'); Snd.miss(); }
    return;
  }
  if (p.eating) p.stopUse();
  p.castRage();
};
Game.doAttack = function () {
  var p = this.player;
  if (p.dead || this.state !== 'play' || p.eating) return;
  if (p.blocking) p.blocking = false;
  /* 블록을 들고 있으면 좌클릭은 블록 파괴 (상대가 사거리 안이면 공격 우선) */
  if (invAt(p.slot) === 'blocks') {
    var b = this.bot, near = b && !b.dead &&
      Math.sqrt((b.x - p.x) * (b.x - p.x) + (b.z - p.z) * (b.z - p.z)) < 3.2;
    if (!near && p.breakBlock()) return;
  }
  p.attemptAttack(this.bot);
};

/* ---------------- 틱 ---------------- */
Game.tick = function () {
  this.tickCount++;
  /* 2.0 : 연출 상태 */
  if (this.shake > 0) this.shake *= 0.80;
  if (this.cinema.mode) {
    this.cinema.t += 0.05;
    if (this.cinema.t > this.cinema.dur) this.cinema.mode = 0;
  }
  if (this.koCam.active) {
    this.koCam.t++;
    if (this.koCam.t > 11) this.timeScale = 1;
    if (this.koCam.t > this.koCam.dur) { this.koCam.active = false; this.timeScale = 1; }
  }
  tickBeams(); tickPearls(); tickWinds(); tickArrows();
  if (this.mode === 'bedwars' && (this.state === 'play' || this.state === 'countdown')) {
    this.bwTickGen(); this.bwCheckBeds(); this.bwTickRespawn();
  }
  if (this.mode === 'murder' && this.state === 'play') { this.mmTickBow(); this.mmCheckWin(); }
  if (this.centerTime > 0) this.centerTime--;
  if (this.itemNameTime > 0) this.itemNameTime--;
  if (this.equipAnim > 0) this.equipAnim = Math.max(0, this.equipAnim - 0.22);
  if (HUD.hitMark > 0) HUD.hitMark--;

  if (this.state === 'menu' || this.state === 'matchend') { updateParticles(); return; }

  if (this.state === 'countdown') {
    this.countdown--;
    if (this.countdown === 62) this.center('', '', 16, '#fff', 0);
    this.player.tick();
    if (this.online) { this.bot.netTick(); Net.tick(); } else this.bot.tick();
    if (this.countdown === 60) this.center('3', '', 34, '#ff6b6b', 20), this.settings.sound && Snd.count(false);
    if (this.countdown === 40) this.center('2', '', 34, '#ffd93d', 20), this.settings.sound && Snd.count(false);
    if (this.countdown === 20) this.center('1', '', 34, '#7fd6ff', 20), this.settings.sound && Snd.count(false);
    if (this.countdown <= 0) {
      this.state = 'play';
      this.center('싸워라!', '', 30, '#5ee85e', 22);
      if (this.settings.sound) Snd.count(true);
    }
    updateParticles();
    return;
  }

  if (this.state === 'play') {
    this.readInput();
    if (this.online) { this.bot.netTick(); Net.tick(); }
    else {
      this.ai.tick(this.player); this.bot.tick();
      /* 머더 : 추가 봇도 함께 굴린다 */
      if (this.mode === 'murder' && this.extraAis) {
        for (var xb = 0; xb < this.extraAis.length; xb++) {
          this.extraAis[xb].tick(this.player);
          this.extraBots[xb].tick();
        }
      }
      /* AI 날기 : 플레이어 높이를 따라다닌다 */
      if (BotMods.on && BotMods.fly && !this.bot.dead) {
        var _bt = this.bot;
        var _want = (this.player.y + 1.1) - _bt.y;
        var _bfs = BotMods.flySpeed;
        _bt.vy = -GRAVITY + clamp(_want * 0.12, -_bfs, _bfs);
        _bt.onGround = false; _bt.fallDistance = 0;
      }
    }
    this.player.tick();
    /* fly post-tick override */
    var _pM = modsFor(this.player);
    if (_pM && _pM.fly) {
      var _fp = this.player;
      _fp.vy = -GRAVITY + Hacks._flyVy;
      _fp.onGround = false; _fp.fallDistance = 0;
    }
    /* hacker passive effects every 40 ticks */
    if (Hacker.on && this.tickCount % 40 === 0 && this.bot && !this.bot.dead) {
      if (Hacker.drainHP) {
        if (this.online) { Net.send({ t: 'drain' }); }
        else { var _b = this.bot; _b.health = Math.max(0.5, _b.health - 1); if (_b.health <= 0.5) _b.die(this.player, 'hack'); }
      }
      if (Hacker.confuse) {
        if (this.online) { Net.send({ t: 'confuse' }); }
        else { this.bot.yaw = wrapDeg(this.bot.yaw + rnd(-50, 50)); }
      }
      if (Hacker.forceSwitch && !this.online) {
        this.bot.slot = (this.bot.slot + 1) % 3;
      }
    }
    this.roundTime--;
    if (this.roundTime <= 0 && (!this.online || Net.isHost)) {
      var ph = this.player.health + this.player.absorption, bh = this.bot.health + this.bot.absorption;
      this.log('시간 종료! 남은 체력으로 판정', '#ffd93d');
      if (Math.abs(ph - bh) < 0.05) { this.state = 'roundend'; this.endTimer = 70; this.center('무승부', '체력 동일', 20, '#cccccc', 70); }
      else this.endRound(ph > bh ? 0 : 1);
    }
  } else if (this.state === 'roundend') {
    this.player.tick();
    if (this.online) { this.bot.netTick(); Net.tick(); } else this.bot.tick();
    if (--this.endTimer <= 0) {
      if (!this.online || Net.isHost) this.nextRound();
    }
  }
  updateParticles();
};

/* ---------------- 루프 ---------------- */
var _acc = 0, _last = 0, _fpsT = 0, _fpsN = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  Game.now = ts;
  if (!_last) _last = ts;
  var dtReal = Math.min(0.25, (ts - _last) / 1000); _last = ts;
  /* 히트스톱 : 타격 순간 정지 */
  if (Game.hitStop > 0) { Game.hitStop -= dtReal * 1000; if (Game.hitStop < 0) Game.hitStop = 0; }
  var _tm = (Hacks.on && RoomCfg.allowHack && Hacks.timer) ? Hacks.timerSpeed : 1;
  var dt = (Game.hitStop > 0 ? 0 : dtReal * Game.timeScale * _tm);
  _acc += dt;
  var steps = 0;
  while (_acc >= 0.05 && steps < 6) { Game.tick(); _acc -= 0.05; steps++; }
  if (_acc > 0.05) _acc = 0;
  var alpha = _acc / 0.05;

  /* 메뉴 카메라 */
  if (Game.state === 'menu' || Game.state === 'matchend') {
    var m = Game.menuCam;
    m.px = m.x; m.py = m.y; m.pz = m.z; m.pYaw = m.yaw; m.pPitch = m.pitch;
    var t = ts * 0.00004;
    m.x = CX + 0.5 + Math.cos(t) * 24; m.z = CZ + 0.5 + Math.sin(t) * 24; m.y = SURF + 5.5;
    m.yaw = wrapDeg(-t / DEG + 90); m.pitch = 12;
    m.pYaw = m.yaw; m.pPitch = m.pitch;
  }

  Render.frame(alpha);
  HUD.draw(alpha);

  _fpsN++; if (ts - _fpsT > 500) { Game.fps = Math.round(_fpsN * 1000 / (ts - _fpsT)); _fpsN = 0; _fpsT = ts; Render.autoRes(Game.fps); }
  if (Render.pendingResize) { Render.pendingResize = false; Render.resize(document.getElementById('gl')); HUD.resize(); }

  /* 터치 조작은 실제 플레이 중에만 보이게 (메뉴/일시정지/핵 창 위에 겹치지 않도록) */
  var tEl = TouchIn.on ? document.getElementById('touch') : null;
  if (tEl) {
    var show = Game.state === 'play' && !Game.paused && !_hackPanelOpen && !_hackerPanelOpen && !ChatUI.open;
    if (show !== _touchShown) {
      _touchShown = show;
      tEl.style.display = show ? 'block' : 'none';
    }
    if (show && ++_tbarT > 15) { _tbarT = 0; buildTouchBar(); }
  }
}
var _touchShown = false, _tbarT = 0;

var ChatUI = { open: false, hist: [], hi: -1, sug: [], si: 0 };

function cLog(s, c) { Game.log(s, c || '#e8e8ee'); }
function cErr(s) { Game.log('✖ ' + s, '#ff7a7a'); }
function cOk(s) { Game.log('✔ ' + s, '#7dff9b'); }

/* 이름 목록에서 부분 일치 찾기 */
function pick(list, q) {
  q = (q || '').toLowerCase();
  for (var i = 0; i < list.length; i++) if (list[i].toLowerCase() === q) return list[i];
  for (var j = 0; j < list.length; j++) if (list[j].toLowerCase().indexOf(q) === 0) return list[j];
  return null;
}
function onOff(a, cur) {
  if (a === undefined || a === '') return !cur;
  return /^(on|1|true|켜|켜기|y)$/i.test(a);
}

var CMDS = [
  { n: 'help', a: '[명령어]', d: '명령어 목록 또는 상세 도움말', f: function (a) {
      if (a[0]) {
        var c = pick(CMDS.map(function (x) { return x.n; }), a[0]);
        var cm = c && CMDS.filter(function (x) { return x.n === c; })[0];
        if (!cm) return cErr('그런 명령어가 없습니다: ' + a[0]);
        cLog('/' + cm.n + ' ' + cm.a, '#ffd93d'); cLog('  ' + cm.d, '#a0a0c0');
        return;
      }
      cLog('─── 명령어 ' + CMDS.length + '개 ───', '#ffd93d');

function sendChat(msg) {
  msg = (msg || '').trim();
  if (!msg) return;
  Game.log('<' + (Game.myName || '나') + '> ' + msg, '#ffffff');
  if (Game.online && Net.connected) Net.send({ t: 'msg', m: msg.slice(0, 160) });
}

function runCommand(line) {
  var parts = line.slice(1).trim().split(/\s+/);
  var name = (parts.shift() || '').toLowerCase();
  if (!name) return;
  var cm = CMDS.filter(function (c) { return c.n === name; })[0];
  if (!cm) {
    var near = pick(CMDS.map(function (c) { return c.n; }), name);
    cErr('알 수 없는 명령어: /' + name + (near ? '  —  /' + near + ' 를 찾으셨나요?' : '  ( /help 로 목록 )'));
    return;
  }
  try { cm.f(parts); }
  catch (e) { cErr('명령 실행 중 오류: ' + e.message); }
}

/* ---- 자동완성 ---- */
function chatSuggest() {
  var box = document.getElementById('chatSug');
  var v = document.getElementById('chatIn').value;
  ChatUI.sug = [];
  if (v.charAt(0) === '/' && v.indexOf(' ') < 0) {
    var q = v.slice(1).toLowerCase();
    ChatUI.sug = CMDS.filter(function (c) { return c.n.indexOf(q) === 0; })
                     .map(function (c) { return { n: c.n, a: c.a, d: c.d }; });
  }
  if (!ChatUI.sug.length) { box.classList.remove('on'); box.innerHTML = ''; return; }
  if (ChatUI.si >= ChatUI.sug.length) ChatUI.si = 0;
  box.innerHTML = ChatUI.sug.map(function (s, i) {
    return '<div class="csug' + (i === ChatUI.si ? ' sel' : '') + '" data-c="' + s.n + '">' +
      '<b>/' + s.n + '</b><span>' + (s.a ? s.a + '  ·  ' : '') + s.d + '</span></div>';
  }).join('');
  box.classList.add('on');
  box.querySelectorAll('[data-c]').forEach(function (d) {
    d.onmousedown = function (e) {
      e.preventDefault();
      var inp = document.getElementById('chatIn');
      inp.value = '/' + this.getAttribute('data-c') + ' ';
      inp.focus(); chatSuggest();
    };
  });
}

function openChat(prefill) {
  if (ChatUI.open) return;
  ChatUI.open = true; ChatUI.hi = -1; ChatUI.si = 0;
  var el = document.getElementById('chat'), inp = document.getElementById('chatIn');
  el.classList.add('on');
  inp.value = prefill || '';
  if (document.exitPointerLock) document.exitPointerLock();
  Input.keys = {}; Input.mouseDown = [false, false, false];
  setTimeout(function () { inp.focus(); chatSuggest(); }, 0);
}
function closeChat() {
  if (!ChatUI.open) return;
  ChatUI.open = false;
  document.getElementById('chat').classList.remove('on');
  document.getElementById('chatSug').classList.remove('on');
  document.getElementById('chatIn').blur();
  if (Game.state === 'play' && !Game.paused && !_hackPanelOpen && !_hackerPanelOpen) requestLock();
}
function submitChat() {
  var inp = document.getElementById('chatIn');
  var v = inp.value.trim();
  if (v) {
    ChatUI.hist.push(v);
    if (ChatUI.hist.length > 50) ChatUI.hist.shift();
    if (v.charAt(0) === '/') runCommand(v); else sendChat(v);
  }
  inp.value = '';
  closeChat();
}

function bindChat() {
  var inp = document.getElementById('chatIn');
  if (!inp) return;
  inp.addEventListener('input', function () { ChatUI.si = 0; chatSuggest(); });
  inp.addEventListener('keydown', function (e) {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); submitChat(); }
    else if (e.key === 'Escape') { e.preventDefault(); this.value = ''; closeChat(); }
    else if (e.key === 'Tab') {
      e.preventDefault();
      if (ChatUI.sug.length) { this.value = '/' + ChatUI.sug[ChatUI.si].n + ' '; chatSuggest(); }
    }
    else if (e.key === 'ArrowDown' && ChatUI.sug.length > 1) {
      e.preventDefault(); ChatUI.si = (ChatUI.si + 1) % ChatUI.sug.length; chatSuggest();
    }
    else if (e.key === 'ArrowUp' && ChatUI.sug.length > 1) {
      e.preventDefault(); ChatUI.si = (ChatUI.si - 1 + ChatUI.sug.length) % ChatUI.sug.length; chatSuggest();
    }
    else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (ChatUI.hi < 0) ChatUI.hi = ChatUI.hist.length;
      ChatUI.hi = Math.max(0, ChatUI.hi - 1);
      if (ChatUI.hist[ChatUI.hi]) this.value = ChatUI.hist[ChatUI.hi];
    }
    else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (ChatUI.hi < 0) return;
      ChatUI.hi = Math.min(ChatUI.hist.length, ChatUI.hi + 1);
      this.value = ChatUI.hist[ChatUI.hi] || '';
    }
  });
  inp.addEventListener('keyup', function (e) { e.stopPropagation(); });
}

  function paintIcons() {

function showMods(back) {
  var rows = [], sliders = [];
  function chk(o, key, label, desc) {
    var id = 'md' + rows.length;
    rows.push({ id: id, o: o, k: key });
    return '<label for="' + id + '" class="modrow' + (o[key] ? ' on' : '') + '">' +
      '<input type="checkbox" id="' + id + '"' + (o[key] ? ' checked' : '') + '>' +
      '<span class="mt">' + label + '</span><span class="md">' + (desc || '') + '</span></label>';
  }
  /* AI 에게 줄 수 있는 모듈을 레지스트리에서 그대로 뽑아 쓴다 */
  var botHtml = '';
  for (var ci = 0; ci < HACK_CATS.length; ci++) {
    var cat = HACK_CATS[ci];
    var mods = HACK_MODULES.filter(function (m) { return m.bot && m.c === cat; });
    if (!mods.length) continue;
    botHtml += '<div class="lab" style="font-size:11px;opacity:.7">' + cat + '</div>';
    for (var mi = 0; mi < mods.length; mi++) {
      var m = mods[mi];
      botHtml += chk(BotMods, m.k, m.n, m.d);
      /* 슬라이더는 label 밖에 둔다 (label 안이면 클릭이 체크박스로 샌다) */
      if (m.s) {
        botHtml += '<div class="modset">';
        for (var si = 0; si < m.s.length; si++) {
          var s = m.s[si], sid = 'bs_' + s.k;
          sliders.push({ id: sid, k: s.k, st: s.st, u: s.u });
          botHtml += '<div class="slider" style="margin:0"><span style="font-size:10.5px">' + s.n + '</span>' +
            '<input type="range" id="' + sid + '" min="' + s.min + '" max="' + s.max + '" step="' + s.st +
            '" value="' + BotMods[s.k] + '"><span id="' + sid + '_l" style="font-size:10.5px;min-width:44px;text-align:right">' +
            (s.st < 1 ? BotMods[s.k].toFixed(2) : Math.round(BotMods[s.k])) + s.u + '</span></div>';
        }
        botHtml += '</div>';
      }
    }
  }
  var masterIdx = rows.length + 3;   // allowHack/Hacker/Anchor 다음이 BotMods.on

  var h = '<h2>모드 설정</h2>' +
    '<div class="sub">AI 대전 · 온라인 대전 모두 적용됩니다</div>' +

    '<div class="lab">내 모드 <span>사용 허용</span></div>' +
    chk(RoomCfg, 'allowHack', '핵쓰기 클라이언트 <kbd>Z</kbd>',
      HACK_MODULES.filter(function (m) { return !m.botOnly; }).length + '개 모듈 · 전투 / 이동 / 플레이어 / 시각 / 기타') +
    chk(RoomCfg, 'allowHacker', '해커 모드 <kbd>X</kbd>',
      '상대 체력 · 무기 · 아이템 훔쳐보기 / 체력 흡수 · 혼란 주기') +
    chk(RoomCfg, 'allowAnchor', '리스폰 정박기',
      '핫바 4번 · 우클릭으로 설치 · 죽으면 그 자리에서 부활 (4회)') +

    '<div class="lab">AI 모드 <span>상대에게 끼워주기</span></div>' +
    chk(BotMods, 'on', '★ AI 핵 활성화',
      '이걸 켜야 아래 항목이 AI 에게 적용됩니다 (오프라인 대전 전용)') +
    botHtml +

    '<div class="hint">AI 에게 핵을 끼워주면 <b>진짜 핵쟁이랑 붙는 기분</b>을 낼 수 있습니다.<br>' +
    '내 모드는 게임 중 <b>Z</b> (핵 클라이언트) · <b>X</b> (해커) 키로 창을 엽니다.</div>' +
    '<button class="mcbtn" id="btnModBack" style="margin-top:16px">돌아가기</button>';
  showUI(h, true);
  rows.forEach(function (r) {
    var el = document.getElementById(r.id);
    if (!el) return;
    el.onchange = function () {
      r.o[r.k] = this.checked; Snd.click();
      if (this.checked) this.parentNode.classList.add('on');
      else this.parentNode.classList.remove('on');
      /* 허용을 끄면 이미 켜져 있던 핵도 함께 끈다 */
      if (r.o === RoomCfg && !this.checked) {
        if (r.k === 'allowHack') Hacks.on = false;
        if (r.k === 'allowHacker') Hacker.on = false;
      }
      /* AI 모듈을 켜면 AI 핵 자체도 켠다 */
      if (r.o === BotMods && r.k !== 'on' && this.checked && !BotMods.on) {
        BotMods.on = true;
        var mr = rows[masterIdx];
        var master = mr && document.getElementById(mr.id);
        if (master) { master.checked = true; master.parentNode.classList.add('on'); }
      }
    };
  });
  sliders.forEach(function (s) {
    var el = document.getElementById(s.id);
    if (!el) return;
    el.oninput = function () {
      BotMods[s.k] = parseFloat(this.value);
      var l = document.getElementById(s.id + '_l');
      if (l) l.textContent = (s.st < 1 ? BotMods[s.k].toFixed(2) : Math.round(BotMods[s.k])) + s.u;
    };
  });
  $('#btnModBack').onclick = function () { Snd.click(); back(); };
}

function isTouchOnly() {
  try { return ('ontouchstart' in window) && !window.matchMedia('(pointer:fine)').matches; }

}
function keyOf(obj, val) { for (var k in obj) if (obj[k] === val) return k; return ''; }

/* 핫바 : 실제로 쓰는 슬롯만 큼직한 버튼으로 */
function buildTouchBar() {
  var bar = document.getElementById('tbar');
  if (!bar || !Game.player) return;
  var items = Game.hotbar ? Game.hotbar() : [];
  var icons = ['🗡', '🍎', '🔮', '⚓'];
  var html = '';
  for (var i = 0; i < 4; i++) {
    var it = items[i];
    if (!it) continue;
    html += '<div class="tslot' + (Game.player.slot === i ? ' tsel' : '') + '" data-slot="' + i + '">' +
      icons[i] + (it.count > 1 ? '<b>' + it.count + '</b>' : '') + '</div>';
  }
  bar.innerHTML = html;
  bar.querySelectorAll('[data-slot]').forEach(function (d) {
    d.addEventListener('touchstart', function (e) {
      e.preventDefault(); e.stopPropagation();
      selectSlot(parseInt(this.getAttribute('data-slot'), 10));
      buildTouchBar();
    }, { passive: false });
    d.addEventListener('mousedown', function (e) {
      e.preventDefault(); e.stopPropagation();
      selectSlot(parseInt(this.getAttribute('data-slot'), 10));
      buildTouchBar();
    });
  });
}

function bindTouch() {
  var stick = document.getElementById('tstick');
  var base = document.getElementById('tstickBase');
  var knob = document.getElementById('tstickKnob');
  var look = document.getElementById('tlook');
  if (!stick) return;
  var R = 52;   // 조이스틱 반경(px)
  var cx = 0, cy = 0;

  function stickStart(t) {
    TouchIn.stickId = t.identifier;
    var r = base.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    base.style.opacity = '1';
    stickMove(t);
  }
  function stickMove(t) {
    var dx = t.clientX - cx, dy = t.clientY - cy;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var k = Math.min(1, d / R);
    var nx = dx / d * k, ny = dy / d * k;
    knob.style.transform = 'translate(' + (nx * R) + 'px,' + (ny * R) + 'px)';
    /* 데드존 + 8방향 감각을 위해 살짝 양자화 */
    TouchIn.mx = Math.abs(nx) > 0.28 ? clamp(nx * 1.6, -1, 1) : 0;
    TouchIn.my = Math.abs(ny) > 0.28 ? clamp(-ny * 1.6, -1, 1) : 0;
  }
  function stickEnd() {
    TouchIn.stickId = -1; TouchIn.mx = TouchIn.my = 0;
    knob.style.transform = 'translate(0,0)';
    base.style.opacity = '.75';
  }

  stick.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (TouchIn.stickId < 0) stickStart(e.changedTouches[0]);
  }, { passive: false });

  look.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (TouchIn.lookId < 0) {
      var t = e.changedTouches[0];
      TouchIn.lookId = t.identifier; TouchIn.lookX = t.clientX; TouchIn.lookY = t.clientY;
    }
  }, { passive: false });

  document.addEventListener('touchmove', function (e) {
    if (!TouchIn.on) return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === TouchIn.stickId) { e.preventDefault(); stickMove(t); }
      else if (t.identifier === TouchIn.lookId) {
        e.preventDefault();
        var p = Game.player;
        if (p && !p.dead) {
          var f = Game.settings.sens * 0.6 + 0.2, f1 = f * f * f * 8;
          p.yaw = wrapDeg(p.yaw + (t.clientX - TouchIn.lookX) * f1 * 0.42);
          p.pitch = clamp(p.pitch + (t.clientY - TouchIn.lookY) * f1 * 0.42 * (Game.settings.invY ? -1 : 1), -90, 90);
        }
        TouchIn.lookX = t.clientX; TouchIn.lookY = t.clientY;
      }
    }
  }, { passive: false });

  function endTouch(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var id = e.changedTouches[i].identifier;
      if (id === TouchIn.stickId) stickEnd();
      if (id === TouchIn.lookId) TouchIn.lookId = -1;
    }
  }
  document.addEventListener('touchend', endTouch);
  document.addEventListener('touchcancel', endTouch);

  /* --- 버튼 : 누르는 동안 유지되는 것들 --- */
  function hold(id, onDown, onUp) {
    var el = document.getElementById(id);
    if (!el) return;
    function down(e) { e.preventDefault(); e.stopPropagation(); el.classList.add('tdown'); onDown(); }
    function up(e) { if (e) { e.preventDefault(); e.stopPropagation(); } el.classList.remove('tdown'); if (onUp) onUp(); }
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', up, { passive: false });
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', function () { el.classList.remove('tdown'); if (onUp) onUp(); });
  }

  hold('tAtk', function () { TouchIn.attackHeld = true; Input.mouseDown[0] = true; Game.doAttack(); },
               function () { TouchIn.attackHeld = false; Input.mouseDown[0] = false; });
  hold('tUse', function () { TouchIn.useHeld = true; Game.player.startUse(); },
               function () { TouchIn.useHeld = false; Game.player.stopUse(); });
  hold('tJump', function () { TouchIn.jump = true; }, function () { TouchIn.jump = false; });
  hold('tQ', function () { Game.tryBeam(); });
  hold('tF', function () { Game.tryRage(); });

  /* 웅크리기 : 짧게 누르면 웅크리기 토글, 길게 누르면 달리기 */
  var sneakEl = document.getElementById('tSneak'), sneakT = 0, sneakLong = false;
  function sneakDown(e) {
    e.preventDefault(); e.stopPropagation();
    sneakLong = false;
    sneakT = setTimeout(function () {
      sneakLong = true; TouchIn.sneak = false; TouchIn.sprint = true;
      sneakEl.classList.add('tlock');
    }, 260);
    TouchIn.sneak = true; sneakEl.classList.add('tdown');
  }
  function sneakUp(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    clearTimeout(sneakT);
    TouchIn.sneak = false; TouchIn.sprint = false;
    sneakEl.classList.remove('tdown'); sneakEl.classList.remove('tlock');
  }
  if (sneakEl) {
    sneakEl.addEventListener('touchstart', sneakDown, { passive: false });
    sneakEl.addEventListener('touchend', sneakUp, { passive: false });
    sneakEl.addEventListener('touchcancel', sneakUp, { passive: false });
    sneakEl.addEventListener('mousedown', sneakDown);
    sneakEl.addEventListener('mouseup', sneakUp);
  }

  /* 상단 유틸 */
  function tap(id, fn) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('touchstart', function (e) { e.preventDefault(); e.stopPropagation(); fn(); }, { passive: false });
    el.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); fn(); });
  }
  tap('tChat', function () { openChat('/'); });
  tap('tPause', function () { if (Game.paused) resumeGame(); else showPause(); });
  tap('tHackBtn', function () { if (RoomCfg.allowHack) toggleHackPanel(); });
  tap('tHackerBtn', function () { if (RoomCfg.allowHacker) toggleHackerPanel(); });
}

function bindInput() {
  var cv = document.getElementById('gl');
  var lastW = 0;

  document.addEventListener('keydown', function (e) {
    if (ChatUI.open) return;                       // 채팅 입력 중엔 게임 키 무시
    if (e.code === 'F5' || e.code === 'F3' || e.code === 'Tab') e.preventDefault();
    /* 채팅 열기 : T = 채팅, / 또는 Enter = 명령어 */
    if (Game.state === 'play' && !Game.paused) {
      if (e.code === 'KeyT') { e.preventDefault(); openChat(''); return; }
      if (e.key === '/') { e.preventDefault(); openChat('/'); return; }
      if (e.code === 'Enter' || e.code === 'NumpadEnter') { e.preventDefault(); openChat(''); return; }
    }
    if (Input.keys[e.code]) { return; }
    Input.keys[e.code] = true;
    if (e.code === 'Escape') {
      if (Game.state !== 'menu' && Game.state !== 'matchend') {
        if (Game.paused) resumeGame(); else showPause();
      }
      return;
    }
    if (Game.state === 'menu' || Game.state === 'matchend' || Game.paused) return;
    if (e.code === 'F3') { Game.settings.debug = !Game.settings.debug; }
    if (e.code === 'F5') { Render.thirdPerson = (Render.thirdPerson + 1) % 2; }
    if (e.code === 'KeyW') {
      var now = performance.now();
      if (now - lastW < 260) Input.sprintTap = true;
      lastW = now;
    }
    if (e.code === 'KeyR') { var pp = Game.player; if (Game.state === 'play' && !pp.dead && pp.gapples > 0) { pp.slot = 1; pp.startUse(); Game.itemNameTime = 30; } }
    if (e.code === 'KeyQ') Game.tryBeam();
    if (e.code === 'KeyF') Game.tryRage();
    if (e.code === 'KeyB' && Game.mode === 'bedwars') toggleShop();
    if (e.code === 'KeyZ' && RoomCfg.allowHack) toggleHackPanel();
    if (e.code === 'KeyX' && RoomCfg.allowHacker) toggleHackerPanel();
    var n = e.code.match(/^Digit([1-9])$/);
    if (n) selectSlot(parseInt(n[1], 10) - 1);
  });
  document.addEventListener('keyup', function (e) {
    if (ChatUI.open) return;
    Input.keys[e.code] = false;
    if (e.code === 'KeyR' && Game.player && Game.player.eating) Game.player.stopUse();
  });

  cv.addEventListener('mousedown', function (e) {
    if (TouchIn.on) return;                  // 터치 모드에선 화면 버튼이 담당
    if (ChatUI.open) { closeChat(); return; }
    if (!Input.locked) {
      if (_hackPanelOpen || _hackerPanelOpen) {
        if (_hackPanelOpen) toggleHackPanel();
        if (_hackerPanelOpen) toggleHackerPanel();
        return;
      }
      if (Game.state !== 'menu' && !Game.paused) requestLock();
      return;
    }
    Input.mouseDown[e.button] = true;
    if (e.button === 0) Game.doAttack();
    if (e.button === 2) Game.player.startUse();
    e.preventDefault();
  });
  document.addEventListener('mouseup', function (e) {
    Input.mouseDown[e.button] = false;
    if (e.button === 2) Game.player.stopUse();
  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('mousemove', function (e) {
    if (!Input.locked || TouchIn.on) return;
    var p = Game.player;
    if (!p || p.dead) return;
    var f = Game.settings.sens * 0.6 + 0.2, f1 = f * f * f * 8;
    p.yaw = wrapDeg(p.yaw + e.movementX * f1 * 0.15);
    p.pitch = clamp(p.pitch + e.movementY * f1 * 0.15 * (Game.settings.invY ? -1 : 1), -90, 90);
  });
  document.addEventListener('wheel', function (e) {
    if (!Input.locked) return;
    var d = e.deltaY > 0 ? 1 : -1;
    selectSlot((Game.player.slot + d + 9) % 9);
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('pointerlockchange', function () {
    if (TouchIn.on) { Input.locked = true; return; }
    Input.locked = (document.pointerLockElement === cv);
    if (!Input.locked) {
      Input.mouseDown[0] = Input.mouseDown[2] = false;
      if (Game.player) Game.player.stopUse();
      if (Game.state !== 'menu' && Game.state !== 'matchend' && !Game.paused &&
          !_hackPanelOpen && !_hackerPanelOpen && !ChatUI.open) showPause();
    }
  });
  window.addEventListener('blur', function () {
    Input.keys = {}; Input.mouseDown = [false, false, false];
  });
  window.addEventListener('resize', function () { Render.resize(cv); HUD.resize(); });
}

function selectSlot(i) {
  var p = Game.player;
  if (p.slot === i) return;
  if (i > invMaxSlot()) return;
  if (i > 0 && !invAt(i)) return;              // 인벤토리에서 뺀 칸은 선택 불가
  p.slot = i; p.stopUse();
  Game.equipAnim = 1; Game.itemNameTime = 40;
  if (Game.settings.sound) Snd.pop();
  if (TouchIn.on) buildTouchBar();
}

/* 창을 드래그로 옮길 수 있게 만든다 */
function makeDraggable(el, handle) {
  handle.onmousedown = function (ev) {
    if (ev.target.classList.contains('fx')) return;
    ev.preventDefault();
    var r = el.getBoundingClientRect();
    el.style.transform = 'none'; el.style.top = r.top + 'px';
    el.style.left = r.left + 'px'; el.style.right = 'auto';
    var ox = ev.clientX - r.left, oy = ev.clientY - r.top;
    function mv(e2) {
      el.style.left = clamp(e2.clientX - ox, 0, window.innerWidth - r.width) + 'px';
      el.style.top = clamp(e2.clientY - oy, 0, window.innerHeight - 40) + 'px';
    }
    function up() { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); }
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  };
}

var HK_UI = { cat: '전투', q: '', open: {} };

function buildHackPanel() {
  var el = document.getElementById('hackPanel'); if (!el) return;
  var q = HK_UI.q.toLowerCase();
  var list = HACK_MODULES.filter(function (m) {
    if (m.botOnly) return false;
    if (q) return (m.n + ' ' + m.d).toLowerCase().indexOf(q) >= 0;
    return m.c === HK_UI.cat;
  });
  var onCount = 0;
  for (var i = 0; i < HACK_MODULES.length; i++) if (Hacks[HACK_MODULES[i].k] && !HACK_MODULES[i].botOnly) onCount++;

  var tabs = HACK_CATS.map(function (cat) {
    return '<div class="ftab' + (!q && cat === HK_UI.cat ? ' fsel' : '') + '" data-cat="' + cat + '">' + cat + '</div>';
  }).join('');

  var body = list.map(function (m) {
    var on = !!Hacks[m.k], open = !!HK_UI.open[m.k];
    var h = '<div class="fmod' + (on ? ' fon' : '') + (open ? ' fopen' : '') + '" data-hk="' + m.k + '">' +
      '<div class="fdot"></div><div class="flabel">' + m.n + '</div>' +
      (m.s ? '<div class="farrow" data-exp="' + m.k + '">▶</div>' : '<div class="farrow"></div>') +
      '</div>';
    if (open) {
      h += '<div class="fdesc">' + m.d + '</div>';
      if (m.s) {
        h += '<div class="fset">' + m.s.map(function (s) {
          var v = Hacks[s.k];
          return '<div class="fsrow"><div class="fslab"><span>' + s.n + '</span>' +
            '<span class="fsval" id="hv_' + s.k + '">' + (s.st < 1 ? v.toFixed(2) : Math.round(v)) + s.u + '</span></div>' +
            '<input type="range" data-set="' + s.k + '" data-st="' + s.st + '" data-u="' + s.u + '" min="' + s.min +
            '" max="' + s.max + '" step="' + s.st + '" value="' + v + '"></div>';
        }).join('') + '</div>';
      }
    }
    return h;
  }).join('');
  if (!body) body = '<div class="fempty">일치하는 모듈이 없습니다</div>';

  el.innerHTML =
    '<div class="fbar" id="hkBar"><div class="flogo">☠</div>' +
      '<div class="fname">' + CLIENT_NAME + '</div><div class="fver">v2.0</div>' +
      '<div class="fx" id="hkClose">✕</div></div>' +
    '<div class="ftabs">' + tabs + '</div>' +
    '<div class="fsearch"><input id="hkQ" placeholder="모듈 검색..." value="' + HK_UI.q.replace(/"/g, '&quot;') + '"></div>' +
    '<div class="fmod' + (Hacks.on ? ' fon' : '') + '" data-hk="on" style="border-bottom:1px solid #ffffff0d">' +
      '<div class="fdot"></div><div class="flabel">클라이언트 활성화</div>' +
      '<div class="fkey">' + (Hacks.on ? 'ENABLED' : 'DISABLED') + '</div><div class="farrow"></div></div>' +
    '<div class="flist">' + body + '</div>' +
    '<div class="ffoot"><b>Z</b> 닫기 · <b>우클릭</b> 복귀 · <b>▶</b> 설정' +
      '<span class="fcount">' + onCount + ' 활성</span></div>';

  makeDraggable(el, el.querySelector('#hkBar'));
  el.querySelector('#hkClose').onclick = function () { toggleHackPanel(); };
  el.querySelectorAll('[data-cat]').forEach(function (d) {
    d.onclick = function () { HK_UI.cat = this.getAttribute('data-cat'); HK_UI.q = ''; Snd.click(); buildHackPanel(); };
  });
  var qi = el.querySelector('#hkQ');
  qi.oninput = function () { HK_UI.q = this.value; buildHackPanel(); document.getElementById('hkQ').focus(); };
  el.querySelectorAll('[data-hk]').forEach(function (div) {
    div.onclick = function (ev) {
      var k = this.getAttribute('data-hk');
      if (ev.target.hasAttribute && ev.target.hasAttribute('data-exp')) {
        HK_UI.open[k] = !HK_UI.open[k]; Snd.click(); buildHackPanel(); return;
      }
      Hacks[k] = !Hacks[k]; Snd.click();
      if (k !== 'on' && Hacks[k] && !Hacks.on) Hacks.on = true;   // 모듈을 켜면 클라이언트도 켠다
      buildHackPanel();
    };
  });
  el.querySelectorAll('[data-set]').forEach(function (inp) {
    inp.oninput = function () {
      var k = this.getAttribute('data-set'), st = parseFloat(this.getAttribute('data-st'));
      Hacks[k] = parseFloat(this.value);
      var lb = document.getElementById('hv_' + k);
      if (lb) lb.textContent = (st < 1 ? Hacks[k].toFixed(2) : Math.round(Hacks[k])) + this.getAttribute('data-u');
    };
  });
}

function buildHackerPanel() {
  var el = document.getElementById('hackerPanel'); if (!el) return;
  var bot = Game.bot;
  var hp = bot ? bot.health.toFixed(1) : '?';
  var ab = bot ? bot.absorption.toFixed(1) : '0.0';
  var wpnMap = { diamond_sword: '다이아 검', iron_sword: '철 검', stone_sword: '돌 검', gold_sword: '황금 검' };
  var wpn = bot && bot.kit ? (wpnMap[bot.kit.item] || '검') : '?';
  var ga = bot ? bot.gapples : '?';
  var pe = bot ? bot.pearls : '?';
  var hpPct = bot ? Math.max(0, Math.min(100, bot.health / (bot.maxHealth || 20) * 100)) : 0;
  function arow(key, label) {
    var on = Hacker[key];
    return '<div class="faction ' + (on ? 'fon' : '') + '" data-hc="' + key + '">' +
      '<div class="fdot"></div><div class="flabel">' + label + '</div></div>';
  }
  var dist = (bot && Game.player) ? Math.sqrt((bot.x - Game.player.x) * (bot.x - Game.player.x) +
    (bot.z - Game.player.z) * (bot.z - Game.player.z)).toFixed(1) + 'm' : '?';
  var onC = (Hacker.drainHP ? 1 : 0) + (Hacker.confuse ? 1 : 0) + (Hacker.forceSwitch ? 1 : 0);
  el.innerHTML =
    '<div class="fbar" id="hcBar"><div class="flogo">👁</div>' +
      '<div class="fname">TRACE</div><div class="fver">EXPLOIT</div>' +
      '<div class="fx" id="hcClose">✕</div></div>' +
    '<div class="fmod' + (Hacker.on ? ' fon' : '') + '" data-hc="on" style="border-bottom:1px solid #ffffff0d">' +
      '<div class="fdot"></div><div class="flabel">인젝션 활성화</div>' +
      '<div class="fkey">' + (Hacker.on ? 'HOOKED' : 'IDLE') + '</div></div>' +
    '<div class="hkinfo">' +
      '<div class="hkrow"><span>대상</span><b>' + (bot ? bot.name : '?') + '</b></div>' +
      '<div class="hkrow"><span>체력</span><b>' + hp + ' ❤</b></div>' +
      '<div class="hkbar"><div style="width:' + hpPct + '%;background:linear-gradient(90deg,#12d67a,#ffd93d,#ff4a4a)"></div></div>' +
      '<div class="hkrow"><span>흡수</span><b>' + ab + '</b></div>' +
      '<div class="hkrow"><span>무기</span><b>' + wpn + '</b></div>' +
      '<div class="hkrow"><span>황금사과</span><b>' + ga + '</b></div>' +
      '<div class="hkrow"><span>엔더진주</span><b>' + pe + '</b></div>' +
      '<div class="hkrow"><span>거리</span><b>' + dist + '</b></div>' +
    '</div>' +
    '<div class="fdiv"></div>' +
    arow('drainHP', '체력 흡수 (40틱)') +
    arow('confuse', '혼란 · 시야 틀기') +
    arow('forceSwitch', '강제 슬롯 전환') +
    '<div class="ffoot"><b>X</b> 닫기 · <b>우클릭</b> 복귀<span class="fcount">' + onC + ' 활성</span></div>';
  makeDraggable(el, el.querySelector('#hcBar'));
  el.querySelector('#hcClose').onclick = function () { toggleHackerPanel(); };
  el.querySelectorAll('[data-hc]').forEach(function (div) {
    div.onclick = function () {
      var k = this.getAttribute('data-hc'); Hacker[k] = !Hacker[k]; Snd.click();
      if (k !== 'on' && Hacker[k] && !Hacker.on) Hacker.on = true;
      buildHackerPanel();
    };
  });
}

/* ---------------- 부팅 ---------------- */
function boot() {
  uiEl = document.getElementById('ui'); panelEl = document.getElementById('panel');
  var cv = document.getElementById('gl');
  var loadEl = document.getElementById('load'), bar = document.getElementById('loadbar'), ltx = document.getElementById('loadtxt');

  function step(pct, msg, fn) {
    bar.style.width = pct + '%'; ltx.textContent = msg;
    setTimeout(fn, 16);
  }

  if (!initGL(cv)) {
    loadEl.innerHTML = '<div style="color:#ff6b6b;font-size:18px">WebGL 을 사용할 수 없습니다</div>' +
      '<div style="font-size:13px;color:#999">브라우저 하드웨어 가속을 켜고 다시 시도해 주세요</div>';
    return;
  }
  Render.resize(cv);
  HUD.init(document.getElementById('hud'));

  Game.map = MAPS[0]; Game.builtMap = MAPS[0];
  step(15, '네더 텍스처를 굽는 중...', function () {
    Render.init();
    HUD.init(document.getElementById('hud'));
    HUD.resize();
    step(45, '용암 투기장을 세우는 중...', function () {
      generateArena(20240816);
      step(70, '메시를 만드는 중...', function () {
        Render.worldMesh = buildWorldMesh();
        step(92, '검을 벼르는 중...', function () {
          Game.player = new Entity({ name: '나', skinIdx: 0 });
          Game.bot = new Entity({ name: '상대', isBot: true, skinIdx: 1 });
          Game.player.setKit(Game.kit); Game.bot.setKit(Game.kit);
          Game.player.reset(SPAWNS[0]); Game.bot.reset(SPAWNS[1]);
          Game.entities = [Game.player, Game.bot];
          /* 머더용 추가 봇 2명 (엔티티 배열에는 모드 진입 시 합류) */
          Game.extraBots = [];
          Game.extraAis = [];
          for (var eb = 0; eb < 2; eb++) {
            var nb = new Entity({ name: MM_NAMES[2 + eb], isBot: true, skinIdx: (2 + eb) % 4 });
            nb.setKit(Game.kit); nb.reset(SPAWNS[eb % SPAWNS.length]);
            Game.extraBots.push(nb);
            Game.extraAis.push(new BotAI(nb, Game.diff));
          }
          Game.ai = new BotAI(Game.bot, Game.diff);
          Game.menuCam = {
            x: CX + 24, y: SURF + 5, z: CZ, px: CX + 24, py: SURF + 5, pz: CZ,
            yaw: 90, pitch: 12, pYaw: 90, pPitch: 12, sneaking: false, sprinting: false,
            hurtTime: 0, maxHurtTime: 0, attackedAtYaw: 0, dead: false, deathTicks: 0,
            distWalked: 0, limbSwingAmount: 0, pLimbSwingAmount: 0
          };
          Render.fov = Game.settings.fov;
          Snd.setVol(Game.settings.vol);
          bindInput();
          bindTouch();
          bindChat();
          /* 터치 기기면 모바일 조작을 자동으로 켠다 */
          if (Game.settings.touchUI === null) Game.settings.touchUI = isTouchOnly();
          setTouchMode(Game.settings.touchUI);
          loadEl.style.display = 'none';
          showMenu();
          requestAnimationFrame(loop);
        });
      });
    });
  });
}

document.addEventListener('click', function once() {
  Snd.init(); Snd.resume();
  document.removeEventListener('click', once);
});
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
</body>
</html>
